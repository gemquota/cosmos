<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSMOS — Ecosystem</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1118;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
h1{font-size:3rem;font-weight:800;background:linear-gradient(90deg,#7b2fff,#ff8c00,#00ff9f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem}
.sub{color:#666;font-size:.9rem;margin-bottom:1.5rem}
.links{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.links a{padding:.5rem 1.2rem;border-radius:8px;text-decoration:none;font-size:.85rem;font-weight:600;border:1px solid rgba(255,255,255,.1);color:#ccc;transition:all .2s}
.links a:hover{border-color:rgba(123,47,255,.3);color:#fff;transform:translateY(-1px)}
.links .hub{border-color:rgba(123,47,255,.3);color:#a855f7}
.links .hub:hover{background:rgba(123,47,255,.1)}
.links .dash{border-color:rgba(255,165,0,.3);color:#ffa500}
.links .dash:hover{background:rgba(255,165,0,.1)}
.links .repo{border-color:rgba(0,255,159,.3);color:#00ff9f}
.links .repo:hover{background:rgba(0,255,159,.1)}
.footer{margin-top:2.5rem;font-size:.7rem;color:#333}
</style>
</head>
<body>
<h1>🌌 COSMOS</h1>
<div class="sub">Recursive Self-Improvement Ecosystem</div>
<div class="links">
  <a href="dashboard/" class="dash">Ecosystem Dashboard</a>
  <a href="https://gemquota.github.io/hub/" class="hub">Project Hub</a>
  <a href="https://github.com/gemquota/cosmos" class="repo">GitHub</a>
</div>
<div class="footer">4 components · mykb · myrsikb · rsis3 · space</div>
</body>
</html>
