<text x="500.0" y="1172.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE FIELD</text>
<text x="72" y="1194" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">COMET = an artifact descending the entropy gradient (probe answer → KG edge); motion encodes maturation.</text>
<text x="72" y="1211" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">ZONES = the three basins from A-24; CONTOURS = equal-entropy rings — the field, not the metaphor.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">ARTIFACT DOTS sit where they actually live: drafts top-left, verdicts mid, wiki pages bottom.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">This is the E-13 curve expanded across both axes — one dimension became the whole plane.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">the whole system is one gradient — every artifact is rolling downhill toward memory</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
