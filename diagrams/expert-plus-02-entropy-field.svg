<text x="500.0" y="849.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">FIELD READ</text>
<text x="74" y="874" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Entropy falls with execution (X→) and with time (Y↓) — the field's gradient is the system's purpose.</text>
