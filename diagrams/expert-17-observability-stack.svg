<text x="500.0" y="914.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE TWO READERS</text>
<text x="74" y="940" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">HUMAN — dashboard reader → writes next spec in SPACE;  L3 — trend reader → evolves strategy directly.</text>
<text x="74" y="964" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">Both close the loop; only L3 closes it without a human in the path.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE STACK</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">COLOUR = who does the stage — emit indigo, buffer/snapshot/render green, read pink, decide amber, return cyan.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">EVERY STAGE NAMES ITS FORMAT — JSONL → disk → JSON → HTML → eyes → spec → loop: the stack is format transitions.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE CLOSING ARC = the loop from reading back to emitting — observability is a cycle, not a log.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">the system watches itself the same way it works — through artifacts, not shared state</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
