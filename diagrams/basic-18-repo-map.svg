<text x="76" y="270" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">dashboard/index.html · the unified hub (port 9000)</text>
<text x="76" y="296" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">rack/pulses/ · dashboard-data.json · JSONL buffer</text>
<text x="76" y="322" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10">evaluator/evaluator.py · IMMUTABLE · SHA-256 verified</text>
<text x="76" y="348" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">.rsis/knowledge_graph.json · .rsis/vectors/ · telemetry/*.jsonl</text>
<text x="76" y="374" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">112 files · ~67k LOC · Python</text>
