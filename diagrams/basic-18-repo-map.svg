<text x="76" y="974" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">150 tests · 14 suites · TypeScript</text>
<rect x="60" y="1130" width="880" height="100" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1130" width="880" height="32" rx="10" fill="#10b981" opacity=".16"/>
<rect x="60" y="1150" width="880" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="1150.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHY THE SHARED FILESYSTEM MATTERS</text>
<text x="74" y="1176" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">All three engines read/write the same git-tracked tree — temporal recovery, cross-component diffs, and one backup story.</text>
<text x="74" y="1200" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">The dashboard lives in rsis3/ but embeds mykb/ and space/ pages — it is the tree's single integration point.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">the repo map is the answer to 'where does this live?' — one tree, three engines, one hub</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
