<text x="76" y="596" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">.wiki-daemon/server.py · search_index.json · graph.json</text>
<text x="76" y="622" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">index.html (wiki browser) · okf-graph.html (knowledge graph)</text>
<text x="76" y="648" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">git-based temporal snapshots · session capture hooks</text>
<text x="76" y="674" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">2,436 files · ~58MB · Python + Markdown</text>
