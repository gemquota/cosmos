<text x="110" y="1116" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">ROTATION SPEED = the loop's real cadence, time-compressed — L1 1s · RRP 12s · L3 60s (real: 1–2s · ~1 min · ~1 hr).</text>
<text x="110" y="1134" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">TICKS = one full cycle divided into 24/12/6 equal phase slots — a visual clock, not a protocol claim.</text>
<text x="110" y="1152" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">COMET = an event crossing the loop boundary — a pulse becoming a round, a round becoming consolidation, memory returning as context.</text>
<text x="110" y="1170" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">The hands are the phase of each loop; the ratios (12:1, 25:1) are the orchestration — not decoration.</text>
