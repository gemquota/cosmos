<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE CONSERVATION LAWS — WHAT THE SYSTEM CANNOT LOSE</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Six quantities that are conserved across every transformation — the physics of the ecosystem</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="60" y="128" width="880" height="104" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="128" width="880" height="30" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="60" y="146" width="880" height="12" fill="#f59e0b" opacity=".12"/>
<text x="500.0" y="147.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">ARTIFACT LINEAGE</text>
<text x="74" y="172" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">every candidate has a spec parent · every KG edge has a lesson parent</text>
<text x="74" y="194" fill="#475569" font-family="system-ui,sans-serif" font-size="9">VIOLATION →  a parentless artifact is a bug</text>
<rect x="60" y="266" width="880" height="104" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="266" width="880" height="30" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="60" y="284" width="880" height="12" fill="#818cf8" opacity=".12"/>
<text x="500.0" y="285.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">BUDGET CONSERVATION</text>
<text x="74" y="310" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">10 calls · 120s · 3 retries · ≤5 evals — per session, not per mood</text>
<text x="74" y="332" fill="#475569" font-family="system-ui,sans-serif" font-size="9">VIOLATION →  a spent budget is never restored mid-session</text>
<rect x="60" y="404" width="880" height="104" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="404" width="880" height="30" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="60" y="422" width="880" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="423.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">SOURCE-OF-TRUTH</text>
<text x="74" y="448" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">wiki is the canonical copy; indexes and graphs are derived</text>
<text x="74" y="470" fill="#475569" font-family="system-ui,sans-serif" font-size="9">VIOLATION →  derived state never overwrites the corpus</text>
<rect x="60" y="542" width="880" height="104" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="542" width="880" height="30" rx="10" fill="#10b981" opacity=".16"/>
<rect x="60" y="560" width="880" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="561.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">TELEMETRY APPEND-ONLY</text>
<text x="74" y="586" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">the JSONL buffer is never edited, only consumed and truncated</text>
<text x="74" y="608" fill="#475569" font-family="system-ui,sans-serif" font-size="9">VIOLATION →  a rewritten history would break trends</text>
<rect x="60" y="680" width="880" height="104" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="680" width="880" height="30" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="698" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="699.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">EVALUATOR CONSTANCY</text>
<text x="74" y="724" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">the judge's digest is the same at every spawn</text>
<text x="74" y="746" fill="#475569" font-family="system-ui,sans-serif" font-size="9">VIOLATION →  a drifted evaluator invalidates every verdict</text>
<rect x="60" y="818" width="880" height="104" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="818" width="880" height="30" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="60" y="836" width="880" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="837.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">TEMPORAL CONTINUITY</text>
<text x="74" y="862" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">every write is a git commit — the timeline has no gaps</text>
<text x="74" y="884" fill="#475569" font-family="system-ui,sans-serif" font-size="9">VIOLATION →  an un-snapshotted change is invisible to time-travel</text>
<rect x="60" y="956" width="880" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="956" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="976" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="976.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHY 'CONSERVED' IS THE RIGHT WORD</text>
<text x="74" y="1002" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">These quantities are invariant under the system's normal transformations — improvement changes code, not lineage.</text>
<text x="74" y="1026" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">The invariant ledger (E-14) listed WHAT cannot change; this map says what cannot be LOST as things change.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE LAWS</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">COLOUR = the component that guards the law — each law is enforced by exactly one owner.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">VIOLATION clauses are testable: parentless artifact, overspent budget, rewritten buffer, drifted digest, gap in history.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">TOGETHER the six laws define 'the same system': if all six hold, every diagram in this viewer still describes it.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">conservation is the deepest invariant — the system can change anything as long as these six quantities survive</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>