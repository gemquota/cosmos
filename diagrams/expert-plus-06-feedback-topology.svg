<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE FEEDBACK TOPOLOGY — FOUR LOOPS, TWO SIGNS, ONE SYSTEM</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Every loop's sign, gain, and latency — stability is a property of the loop set, not the parts</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="60" y="128" width="880" height="128" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="128" width="880" height="32" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="60" y="148" width="880" height="12" fill="#f59e0b" opacity=".12"/>
<text x="500.0" y="148.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">IMPROVEMENT LOOP — NEGATIVE FEEDBACK</text>
<text x="74" y="174" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">PATH —  L2 → evaluator → L2</text>
<text x="74" y="198" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">stabilising — the gate rejects, so change is damped</text>
<circle cx="930" cy="164" r="22" fill="none" stroke="#f59e0b" stroke-width="2"/>
<text x="930" y="170" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace,Menlo,monospace" font-size="17" font-weight="800">-</text>
<rect x="60" y="286" width="880" height="128" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="286" width="880" height="32" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="60" y="306" width="880" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="306.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">MEMORY LOOP — POSITIVE FEEDBACK</text>
<text x="74" y="332" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">PATH —  L3 → KG → retrieval → L1</text>
<text x="74" y="356" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">compounding — more memory, better actions, more memory</text>
<circle cx="930" cy="322" r="22" fill="none" stroke="#22d3ee" stroke-width="2"/>
<text x="930" y="328" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="17" font-weight="800">+</text>
<rect x="60" y="444" width="880" height="128" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="444" width="880" height="32" rx="10" fill="#10b981" opacity=".16"/>
<rect x="60" y="464" width="880" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="464.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">TELEMETRY LOOP — NEUTRAL FEEDBACK</text>
<text x="74" y="490" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">PATH —  pulse → dashboard → strategy</text>
<text x="74" y="514" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">observational — unless a human acts, it changes nothing</text>
<circle cx="930" cy="480" r="22" fill="none" stroke="#10b981" stroke-width="2"/>
<text x="930" y="486" text-anchor="middle" fill="#10b981" font-family="ui-monospace,Menlo,monospace" font-size="17" font-weight="800">0</text>
<rect x="60" y="602" width="880" height="128" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="602" width="880" height="32" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="60" y="622" width="880" height="12" fill="#818cf8" opacity=".12"/>
<text x="500.0" y="622.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">OUTER LOOP — POSITIVE FEEDBACK</text>
<text x="74" y="648" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">PATH —  spec → candidate → pulse → lesson → KG → retrieval → spec</text>
<text x="74" y="672" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">the flywheel — every cycle should raise success rate</text>
<circle cx="930" cy="638" r="22" fill="none" stroke="#818cf8" stroke-width="2"/>
<text x="930" y="644" text-anchor="middle" fill="#818cf8" font-family="ui-monospace,Menlo,monospace" font-size="17" font-weight="800">+</text>
<rect x="60" y="760" width="880" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="760" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="780" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="780.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE SIGN RULE</text>
<text x="74" y="806" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">Negative feedback = the evaluator: it exists to oppose change, which is why the system stays stable while improving.</text>
<text x="74" y="830" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">Positive loops are the growth story; the negative loop is the brake — the net sign is the system's character.</text>
<rect x="60" y="890" width="880" height="80" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="890" width="880" height="32" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="60" y="910" width="880" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="910.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">LATENCY IS THE GAIN</text>
<text x="74" y="936" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">A loop's effective gain falls as its period rises (X+-04) — slow loops damp themselves by being slow.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE TOPOLOGY</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">SIGNS = − stabilising · + compounding · 0 observational; the glyph circle repeats the sign.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE CAUSALITY GRAPH (X+-01) drew the edges; this map labels each cycle's sign and role.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">STABILITY IS EMERGENT: no single loop is the system — the set of four, with signs and lags, is.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">feedback is the system's personality — one brake, two engines, one mirror</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>