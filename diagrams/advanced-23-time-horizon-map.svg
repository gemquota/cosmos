  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE TIME HORIZON MAP — TWO SPECTRA, ALL SIX RHYTHMS</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Operation cadence and memory persistence — the system's two clocks laid out</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<text x="500" y="108" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">X axis = how often something runs · Y axis = how long what it makes survives</text>
<rect x="60" y="136" width="880" height="42" rx="9" fill="#818cf8" opacity=".14" stroke="#818cf8" stroke-width="1" stroke-opacity=".35"/>
<text x="76" y="161.0" fill="#818cf8" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700">SPECTRUM 1 · OPERATION CADENCE</text>
<text x="924" y="161.0" text-anchor="end" fill="#475569" font-family="system-ui,sans-serif" font-size="9">log time</text>
<line x1="90" y1="250" x2="910" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arwG)"/>
<text x="500" y="278" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="9.5">FAST — seconds ←———→ — hours / days</text>
<circle cx="160" cy="250" r="9" fill="#818cf8" stroke="#0b1120" stroke-width="1.6"/>
<text x="160" y="222" text-anchor="middle" fill="#818cf8" font-family="ui-monospace,Menlo,monospace" font-size="9">L1 · ~1s</text>
<circle cx="300" cy="250" r="9" fill="#10b981" stroke="#0b1120" stroke-width="1.6"/>
<text x="300" y="222" text-anchor="middle" fill="#10b981" font-family="ui-monospace,Menlo,monospace" font-size="9">TELEMETRY · ~1s</text>
<circle cx="470" cy="250" r="9" fill="#f59e0b" stroke="#0b1120" stroke-width="1.6"/>
<text x="470" y="222" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace,Menlo,monospace" font-size="9">RRP ROUND · ~12s</text>
<circle cx="620" cy="250" r="9" fill="#22d3ee" stroke="#0b1120" stroke-width="1.6"/>
<text x="620" y="222" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="9">RETRIEVAL · on-demand</text>
<circle cx="770" cy="250" r="9" fill="#22d3ee" stroke="#0b1120" stroke-width="1.6"/>
<text x="770" y="222" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="9">L3 · ~60s</text>
<circle cx="890" cy="250" r="9" fill="#818cf8" stroke="#0b1120" stroke-width="1.6"/>
<text x="890" y="222" text-anchor="middle" fill="#818cf8" font-family="ui-monospace,Menlo,monospace" font-size="9">CROSS-SESSION · hours</text>
<rect x="60" y="320" width="880" height="42" rx="9" fill="#22d3ee" opacity=".14" stroke="#22d3ee" stroke-width="1" stroke-opacity=".35"/>
<text x="76" y="345.0" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700">SPECTRUM 2 · MEMORY PERSISTENCE</text>
<text x="924" y="345.0" text-anchor="end" fill="#475569" font-family="system-ui,sans-serif" font-size="9">what survives</text>
<line x1="90" y1="430" x2="910" y2="430" stroke="#334155" stroke-width="2" marker-end="url(#arwG)"/>
<text x="500" y="458" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="9.5">EPHEMERAL — volatile ←———→ — PERMANENT · git-tracked</text>
<circle cx="140" cy="430" r="9" fill="#10b981" stroke="#0b1120" stroke-width="1.6"/>
<text x="140" y="402" text-anchor="middle" fill="#10b981" font-family="ui-monospace,Menlo,monospace" font-size="9">pulse JSONL</text>
<circle cx="260" cy="430" r="9" fill="#f472b6" stroke="#0b1120" stroke-width="1.6"/>
<text x="260" y="402" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9">eval verdicts</text>
<circle cx="400" cy="430" r="9" fill="#f59e0b" stroke="#0b1120" stroke-width="1.6"/>
<text x="400" y="402" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace,Menlo,monospace" font-size="9">spec drafts</text>
<circle cx="530" cy="430" r="9" fill="#22d3ee" stroke="#0b1120" stroke-width="1.6"/>
<text x="530" y="402" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="9">lessons</text>
<circle cx="680" cy="430" r="9" fill="#22d3ee" stroke="#0b1120" stroke-width="1.6"/>
<text x="680" y="402" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="9">KG edges</text>
<circle cx="830" cy="430" r="9" fill="#22d3ee" stroke="#0b1120" stroke-width="1.6"/>
<text x="830" y="402" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="9">wiki corpus</text>
<rect x="60" y="500" width="880" height="170" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="500" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="520" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="520.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHAT THE TWO SPECTRA REVEAL</text>
<text x="74" y="546" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Fast things make ephemeral things: L1 pulses are the fastest and least durable artifact in the system.</text>
<text x="74" y="570" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Slow things make permanent things: L3 consolidation is slow precisely because it writes the wiki.</text>
<text x="74" y="594" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Retrieval sits at the join: it runs on demand (middle of spectrum 1) but serves the most durable store (end of spectrum 2).</text>
<text x="74" y="618" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">The 12:1 and 25:1 ratios are spectrum-1 facts; the git snapshot is a spectrum-2 fact.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE MAP</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">NODE COLOUR = owning component; X position on each spectrum is the real value, not decorative.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE DIAGONAL RULE: speed of production and durability of product trade off — the graph is dense along the anti-diagonal.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">MEMORY sits right: on-demand latency (fast enough) and permanent storage (durable enough) — the compromise is the point.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">two spectra are enough to locate every artifact in the ecosystem — speed and survival</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>