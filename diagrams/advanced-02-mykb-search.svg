<text x="364" y="362" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9">TF-IDF cosine scores</text>
<text x="364" y="378" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">over chunks</text>
