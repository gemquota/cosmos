<text x="844" y="362" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9">score → top_n=30</text>
<text x="844" y="378" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">path + title</text>
<line x1="1040" y1="367" x2="1068" y2="367" stroke="#f59e0b" stroke-width="2" opacity="0.6" marker-end="url(#arwS)"/>
