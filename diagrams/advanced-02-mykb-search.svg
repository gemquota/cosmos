<rect x="590" y="336" width="210" height="12" fill="#f59e0b" opacity=".12"/>
<text x="695.0" y="338.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="10" font-weight="700">rrf_fusion()</text>
<text x="604" y="362" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9">dense + sparse</text>
<text x="604" y="378" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">reciprocal rank fusion</text>
