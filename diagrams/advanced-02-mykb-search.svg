<text x="1084" y="378" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">wiki pages openable</text>
<line x1="1280" y1="367" x2="1308" y2="367" stroke="#f59e0b" stroke-width="2" opacity="0.6" marker-end="url(#arwS)"/>
<rect x="110" y="460" width="610" height="130" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="110" y="460" width="610" height="34" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="110" y="482" width="610" height="12" fill="#22d3ee" opacity=".12"/>
<text x="415.0" y="481.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">SCORING — TF-IDF</text>
<text x="124" y="508" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="10">score(doc) = Σ  tf(w, doc) × idf(w)</text>
<text x="124" y="532" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="10">tf  = word count in doc / total words</text>
<text x="124" y="556" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="10">idf = inverse document frequency across wiki</text>
<text x="124" y="580" fill="#475569" font-family="system-ui,sans-serif" font-size="9">Implemented in server.py search_query() + search_fusion.py</text>
<rect x="750" y="460" width="540" height="130" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="750" y="460" width="540" height="34" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="750" y="482" width="540" height="12" fill="#f59e0b" opacity=".12"/>
<text x="1020.0" y="481.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">HYBRID FUSION — RRF</text>
<text x="764" y="508" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="10">rrf_fusion(dense, sparse, k=60, top_n=30)</text>
<text x="764" y="532" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="10">score = Σ 1 / (k + rank_i)  across result sets</text>
<text x="764" y="556" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="10">combines semantic + lexical rankings</text>
<text x="764" y="580" fill="#475569" font-family="system-ui,sans-serif" font-size="9">Dense path: vector similarity • Sparse path: TF-IDF</text>
<text x="130" y="630" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="11">⬇ WHO CONSUMES SEARCH</text>
