<rect x="60" y="928" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="929.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE 7-PROVIDER DISPATCH</text>
<text x="74" y="954" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">provider = factory product (E-03) — answers are varied by construction, which is what makes 25 rounds converge.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE JOURNEY</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">COLOUR = SPACE amber through the session; green/pink mark where the product is handed to consumers and the audit trail.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">STAGE TAGS are real session landmarks — init, rounds, provider dispatch, draft, export.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE TWO CONSUMERS never touch the session — they only read exports, which keeps SPACE isolated.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">a spec is what survives the session — everything else in SPACE is process, not product</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
