<text x="728.0" y="805.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">MYKB · ARCHIVE</text>
<text x="530" y="830" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">keeps exports as wiki-adjacent artifacts for future retrieval</text>
<rect x="60" y="910" width="880" height="80" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
