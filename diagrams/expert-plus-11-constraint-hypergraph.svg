<text x="640" y="560" text-anchor="middle" dominant-baseline="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="7.5" font-weight="800">DASH-DATA</text>
<circle cx="520" cy="620" r="24" fill="#f59e0b" opacity=".16" stroke="#f59e0b" stroke-width="1.8"/>
<text x="520" y="620" text-anchor="middle" dominant-baseline="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="7.5" font-weight="800">EXPORTS</text>
<ellipse cx="560.0" cy="235.0" rx="152.0" ry="92" fill="none" stroke="#f472b6" stroke-width="1.6" stroke-dasharray="5,4" opacity=".85"/>
