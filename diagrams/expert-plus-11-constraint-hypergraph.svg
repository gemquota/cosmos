<text x="340.0" y="616.0" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="7.5">git temporal · source of truth</text>
<ellipse cx="640.0" cy="560.0" rx="74" ry="74" fill="none" stroke="#10b981" stroke-width="1.6" stroke-dasharray="5,4" opacity=".85"/>
<text x="640.0" y="622.0" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="7.5">single dashboard rule</text>
<rect x="60" y="720" width="880" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="720" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="740" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="740.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHY HYPEREDGES, NOT ARROWS</text>
<text x="74" y="766" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">A constraint is not an edge between two things — it binds a SET: the eval budget binds candidate AND verdict together.</text>
<text x="74" y="792" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The B-22 ledger showed who touches which store; this graph shows which stores a rule touches at once.</text>
<text x="74" y="818" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">Violating any bubble breaks the invariant ledger (E-14) — the hypergraph is the invariants' geometry.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE HYPERGRAPH</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">BUBBLES = constraints (multi-way relations); DOTS = artifacts; an artifact in many bubbles obeys many rules.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">DASHED LINES = the boundary is the rule, not a data flow — bubbles enclose, arrows would mislead.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE WIKI BUBBLE is the largest because memory is the most-constrained store (write path + index + snapshots).</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">constraints are shapes, not lines — the system's rules are regions that several things must satisfy together</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>