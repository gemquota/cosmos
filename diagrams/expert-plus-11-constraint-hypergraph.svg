<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE CONSTRAINT HYPERGRAPH — CONSTRAINTS AS BUBBLES OVER ARTIFACTS</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Six constraints, each binding several artifacts at once — a graph, but with multi-way edges</text>
