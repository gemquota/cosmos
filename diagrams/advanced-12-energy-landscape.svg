<text x="504.0" y="1019.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE LANDSCAPE</text>
<text x="110" y="1044" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">ELEVATION = maturity cost — theory sits high (cheap to draft), consolidated memory sits low (expensive to reach, stable once there).</text>
<text x="110" y="1062" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">SADDLES = the gates — an artifact must climb the evaluator barrier (55) to leave ideation, and the consolidation barrier (42) to become memory.</text>
<text x="110" y="1080" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">COMET = one artifact descending the gradient — spec → candidate → pulse → lesson → KG edge. Motion is the maturation cascade.</text>
<text x="110" y="1098" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">Telemetry's success-rate is the height function: as artifacts settle into wells, measured success rises.</text>
<text x="110" y="1116" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">The dashed routes are the real interfaces — retrieval :8765 returns memory to action, pulses reach dashboard-data.json.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">the system's 'why' as terrain — every artifact rolls downhill toward the basin that stabilises it</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 5 · dynamical portraits</text>
