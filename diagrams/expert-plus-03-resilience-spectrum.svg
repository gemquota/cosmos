<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE RESILIENCE SPECTRUM — WHAT SURVIVES, WHAT DEGRADES</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Every dependency ranked from brittle to resilient, with its degradation ladder</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<line x1="90" y1="300" x2="910" y2="300" stroke="#334155" stroke-width="2.5" marker-end="url(#arwG)"/>
<text x="500" y="335" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="10.5">BRITTLE ←———→ RESILIENT</text>
<circle cx="130" cy="300" r="13" fill="#f472b6" stroke="#0b1120" stroke-width="2"/>
<text x="130" y="262" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="8.5">:8765 PORT CLASH</text>
<text x="130" y="278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="7">▾</text>
<text x="130" y="358" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="7.5">documented but inevitable</text>
<circle cx="260" cy="300" r="13" fill="#f472b6" stroke="#0b1120" stroke-width="2"/>
<text x="260" y="262" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="8.5">EVALUATOR TIMEOUT</text>
<text x="260" y="278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="7">▾</text>
<text x="260" y="358" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="7.5">fail → retry (≤5)</text>
<circle cx="400" cy="300" r="13" fill="#f59e0b" stroke="#0b1120" stroke-width="2"/>
<text x="400" y="262" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace,Menlo,monospace" font-size="8.5">PROVIDER OUTAGE</text>
<text x="400" y="278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="7">▾</text>
<text x="400" y="358" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="7.5">7-provider failover</text>
<circle cx="530" cy="300" r="13" fill="#22d3ee" stroke="#0b1120" stroke-width="2"/>
<text x="530" y="262" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="8.5">WIKI CORRUPTION</text>
<text x="530" y="278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="7">▾</text>
<text x="530" y="358" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="7.5">temporal restore</text>
<circle cx="660" cy="300" r="13" fill="#10b981" stroke="#0b1120" stroke-width="2"/>
<text x="660" y="262" text-anchor="middle" fill="#10b981" font-family="ui-monospace,Menlo,monospace" font-size="8.5">DASHBOARD DOWN</text>
<text x="660" y="278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="7">▾</text>
<text x="660" y="358" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="7.5">buffer keeps flowing</text>
<circle cx="800" cy="300" r="13" fill="#f59e0b" stroke="#0b1120" stroke-width="2"/>
<text x="800" y="262" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace,Menlo,monospace" font-size="8.5">SPACE UI DOWN</text>
<text x="800" y="278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="7">▾</text>
<text x="800" y="358" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="7.5">exports stay intact</text>
<text x="90" y="396" text-anchor="start" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">the ladder every item climbs: 1 · degrade gracefully → 2 · retry → 3 · restore from snapshot</text>
<rect x="60" y="430" width="880" height="160" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="430" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="450" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="450.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE RULE THE SPECTRUM REVEALS</text>
<text x="74" y="476" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Resilience correlates with distance from the trust boundary: the evaluator and the port clash are the brittle ends.</text>
<text x="74" y="502" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Everything with a restore path (wiki, index) sits right; everything with only a retry sits left.</text>
<text x="74" y="528" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">The A-22 table listed modes; this spectrum ranks them — the two views share all six dependencies.</text>
<rect x="60" y="620" width="880" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="620" width="880" height="32" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="60" y="640" width="880" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="640.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE ONE THAT CANNOT DEGRADE</text>
<text x="74" y="666" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The wiki corpus has no degraded mode — corruption is restored, not tolerated. That is what 'source of truth' means here.</text>
<text x="74" y="692" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">Every other dependency can fail softly; memory cannot, because everything else depends on it.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE SPECTRUM</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">POSITION = assessed resilience from the failure modes (A-22); COLOUR = owning component.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE LADDER below the axis is the recovery grammar: degrade → retry → restore, in that order.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">Brittle is not bad — it is cheap: the port clash is the system's one known, documented, accepted weakness.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">resilience is a budget too — the system spends it on memory and spends it off the trust boundary</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>