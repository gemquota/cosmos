<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE SIX HANDOFFS — THE SYSTEM'S REAL INTERFACES</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Six directional contracts between the four runtimes — port, payload, cadence</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="60" y="120" width="440" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="120" width="440" height="32" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="60" y="140" width="440" height="12" fill="#f59e0b" opacity=".12"/>
<text x="280.0" y="140.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">SPACE  →  RSIS3</text>
<text x="74" y="166" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="10.5">PAYLOAD — SPEC DRAFTS</text>
<text x="74" y="188" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">exports/ on the shared filesystem · MD/JSON</text>
<text x="74" y="210" fill="#475569" font-family="system-ui,sans-serif" font-size="9">CADENCE — on-demand after RRP sessions</text>
<line x1="500" y1="210" x2="556" y2="210" stroke="#818cf8" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<text x="528.0" y="198" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="8.5">→ RSIS3</text>
<rect x="500" y="120" width="440" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="500" y="120" width="440" height="32" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="500" y="140" width="440" height="12" fill="#818cf8" opacity=".12"/>
<text x="720.0" y="140.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">RSIS3  →  EVALUATOR</text>
<text x="514" y="166" fill="#818cf8" font-family="system-ui,sans-serif" font-size="10.5">PAYLOAD — CANDIDATE JSON</text>
<text x="514" y="188" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">stdin subprocess · SHA-256 verified</text>
<text x="514" y="210" fill="#475569" font-family="system-ui,sans-serif" font-size="9">CADENCE — ≤5 per session · 60s cap</text>
<line x1="444" y1="210" x2="388" y2="210" stroke="#f472b6" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<text x="416.0" y="198" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="8.5">→ EVALUATOR</text>
<rect x="60" y="370" width="440" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="370" width="440" height="32" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="60" y="390" width="440" height="12" fill="#818cf8" opacity=".12"/>
<text x="280.0" y="390.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">RSIS3  →  DASHBOARD</text>
<text x="74" y="416" fill="#818cf8" font-family="system-ui,sans-serif" font-size="10.5">PAYLOAD — PULSES</text>
<text x="74" y="438" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">rack/pulses → dashboard-data.json · JSONL</text>
<text x="74" y="460" fill="#475569" font-family="system-ui,sans-serif" font-size="9">CADENCE — ~1s cadence</text>
<line x1="500" y1="460" x2="556" y2="460" stroke="#10b981" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<text x="528.0" y="448" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="8.5">→ DASHBOARD</text>
<rect x="500" y="370" width="440" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="500" y="370" width="440" height="32" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="500" y="390" width="440" height="12" fill="#22d3ee" opacity=".12"/>
<text x="720.0" y="390.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">MYKB  →  RSIS3</text>
<text x="514" y="416" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="10.5">PAYLOAD — RETRIEVAL</text>
<text x="514" y="438" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">HTTP :8765 · ranked wiki context</text>
<text x="514" y="460" fill="#475569" font-family="system-ui,sans-serif" font-size="9">CADENCE — on-demand during L1</text>
<line x1="444" y1="460" x2="388" y2="460" stroke="#818cf8" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<text x="416.0" y="448" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="8.5">→ RSIS3</text>
<rect x="60" y="620" width="440" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="620" width="440" height="32" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="60" y="640" width="440" height="12" fill="#818cf8" opacity=".12"/>
<text x="280.0" y="640.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">RSIS3  →  MYKB</text>
<text x="74" y="666" fill="#818cf8" font-family="system-ui,sans-serif" font-size="10.5">PAYLOAD — SESSION CAPTURE</text>
<text x="74" y="688" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">wiki pages + KG edges + snapshots</text>
<text x="74" y="710" fill="#475569" font-family="system-ui,sans-serif" font-size="9">CADENCE — post-session · L3</text>
<line x1="500" y1="710" x2="556" y2="710" stroke="#22d3ee" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<text x="528.0" y="698" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="8.5">→ MYKB</text>
<rect x="500" y="620" width="440" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="500" y="620" width="440" height="32" rx="10" fill="#10b981" opacity=".16"/>
<rect x="500" y="640" width="440" height="12" fill="#10b981" opacity=".12"/>
<text x="720.0" y="640.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">DASHBOARD  →  SPACE</text>
<text x="514" y="666" fill="#10b981" font-family="system-ui,sans-serif" font-size="10.5">PAYLOAD — LAUNCH</text>
<text x="514" y="688" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">open web UI (:8888) + meta viewer (:8899)</text>
<text x="514" y="710" fill="#475569" font-family="system-ui,sans-serif" font-size="9">CADENCE — on-demand, user-driven</text>
<line x1="444" y1="710" x2="388" y2="710" stroke="#f59e0b" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<text x="416.0" y="698" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8.5">→ SPACE</text>
<rect x="60" y="885" width="880" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="885" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="905" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="905.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHAT THE SIX SHARE</text>
<text x="74" y="931" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">All six are directional and content-addressed: files on disk or JSON over a port — no shared objects, no hidden state.</text>
<text x="74" y="957" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Two are user-initiated (launch), three are engine-initiated, one is a spawn — the only handoff that runs code is RSIS3 → evaluator.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE HANDOFFS</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">COLOUR = sender palette; the arrowhead lands in the receiver's colour — read each card as 'sender → receiver'.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE SPAWN IS SPECIAL: RSIS3 → evaluator runs a verified subprocess, because the judge must never be imported into the judged.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE LAUNCH IS THE DASH: dashboard → SPACE opens the web UI — the reverse of the telemetry handoff (RSIS3 → dashboard).</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">six contracts, zero shared objects — the ecosystem is a graph of files and ports, not a graph of calls</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>