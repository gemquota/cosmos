<rect x="840" y="198" width="330" height="12" fill="#f59e0b" opacity=".14"/>
<text x="1005.0" y="195.0" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="15" font-weight="700">✧ SPACE</text>
<text x="1005.0" y="230" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11.5">RRP Ideation Engine — TypeScript</text>
<text x="1005" y="244" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">Structured prompt/spec generation</text>
<text x="1005" y="266" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">326-probe framework across 7 series</text>
<text x="1005" y="288" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">7 LLM providers integrated</text>
<text x="1005" y="310" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">6 export formats (JSON/MD/YAML/HTML…)  </text>
<text x="1005" y="332" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">150 tests • 14 suites</text>
