<text x="600.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">COSMOS — SYSTEM OVERVIEW</text>
<text x="600.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Cognitive Orchestration System for Meta-cognitive Orchestration &amp; Synthesis</text>
<line x1="72.0" y1="76" x2="1128.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="80" y="100" width="1040" height="46" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="600" y="120" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">🌌 COSMOS — one ecosystem, three components, one goal: recursive self-improvement</text>
<text x="600" y="138" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="10">Hub-and-spoke architecture  •  Shared filesystem  •  GitHub Pages + local servers</text>
<rect x="180" y="170" width="330" height="210" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
<rect x="180" y="170" width="330" height="40" rx="14" fill="#818cf8" opacity=".18"/>
<rect x="180" y="198" width="330" height="12" fill="#818cf8" opacity=".14"/>
<text x="345.0" y="195.0" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="15" font-weight="700">🔄 RSIS3</text>
<text x="345.0" y="230" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11.5">Core Cognitive Engine — Python</text>
<text x="345" y="244" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">Three-loop recursive self-improvement</text>
<text x="345" y="266" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">L1: per-task action loop (seconds)</text>
<text x="345" y="288" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">L2: per-session improvement (minutes)</text>
<text x="345" y="310" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">L3: cross-session evolution (hours/days)</text>
<text x="345" y="332" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">IMMUTABLE AI evaluator gates changes</text>
<text x="345" y="354" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">112 files • 67k LOC</text>
<rect x="510" y="170" width="330" height="210" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="2" filter="url(#shadow)"/>
<rect x="510" y="170" width="330" height="40" rx="14" fill="#22d3ee" opacity=".18"/>
<rect x="510" y="198" width="330" height="12" fill="#22d3ee" opacity=".14"/>
<text x="675.0" y="195.0" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="15" font-weight="700">🧠 MyKB</text>
<text x="675.0" y="230" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11.5">Long-Term Memory — Python + Markdown</text>
<text x="675" y="244" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">Obsidian wiki — 2,360+ markdown pages</text>
<text x="675" y="266" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">TF-IDF search over 48 knowledge domains</text>
<text x="675" y="288" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">Temporal engine: time-travel snapshots</text>
<text x="675" y="310" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">Knowledge graph + session capture hooks</text>
<text x="675" y="332" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">2,436 files • 58MB</text>
