<line x1="840" y1="275" x2="1005" y2="275" stroke="#22d3ee" stroke-width="2" opacity="0.5" marker-end="url(#arwM)"/>
<text x="600" y="265" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9" font-style="italic">memory I/O</text>
<text x="930" y="265" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9" font-style="italic">specs flow</text>
<rect x="80" y="420" width="1040" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="80" y="420" width="1040" height="34" rx="10" fill="#10b981" opacity=".16"/>
<rect x="80" y="442" width="1040" height="12" fill="#10b981" opacity=".12"/>
<text x="600.0" y="441.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">HOW THEY WORK TOGETHER</text>
<text x="94" y="468" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">1.  SPACE ideates — RRP sessions produce structured specifications (326 probes, 7 series)</text>
<text x="94" y="494" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">2.  MyKB stores — specs and session artifacts persist as wiki pages and knowledge graph entries</text>
<text x="94" y="520" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">3.  RSIS3 executes — L1 acts, L2 improves (evaluator-gated), L3 evolves strategies across sessions</text>
<text x="94" y="546" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">4.  MyKB consolidates — results written back to the knowledge graph for the next cycle</text>
<text x="94" y="572" fill="#475569" font-family="system-ui,sans-serif" font-size="10">The cycle repeats: ideation → storage → execution → consolidation → better ideation</text>
<rect x="80" y="620" width="1040" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="80" y="620" width="1040" height="34" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="80" y="642" width="1040" height="12" fill="#f472b6" opacity=".12"/>
