<text x="94" y="668" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">2,881 total files   •   ~239k LOC   •   ~70MB   •   235 directories</text>
<text x="94" y="698" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">2 git repos (cosmos + hub)   •   2 GitHub Pages deployments</text>
<text x="94" y="728" fill="#475569" font-family="system-ui,sans-serif" font-size="10">Ports: 9000 Dashboard  •  8765 MyKB  •  8888/8899 SPACE  •  8080 RSIS3 (static by default)</text>
<text x="600.0" y="840" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Generated from source analysis</text>
