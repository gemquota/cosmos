<text x="500.0" y="820.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHAT THE HEATMAP SAYS</text>
<text x="74" y="846" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">rsis3 core is the hub: highest fan-out (needs rack, evaluator, mykb) and highest fan-in (rack, dashboard depend on it).</text>
<text x="74" y="870" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">dashboard is a pure consumer (fan-in 0) and space/mykb are pure providers at the code level — their coupling is via files.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE MATRIX</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">HEAT = directed dependency count (0 · 1 · 2 · 3+): amber warm, red hot — rows depend on columns.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">ZERO CELLS MATTER: evaluator depends on nothing, and nothing (except the spawn) depends on it — that isolation is the point.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">The B-14 ownership matrix was WHO RUNS WHAT; this matrix is WHO IMPORTS WHOM — code coupling, not runtime coupling.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">coupling is where complexity lives — the heatmap shows it is concentrated in exactly one module</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>