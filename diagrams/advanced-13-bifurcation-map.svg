<text x="110" y="1004" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">λ = INTEGRATION DEPTH — the control parameter; each milestone is a real subsystem joining the ecosystem.</text>
<text x="110" y="1022" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">EACH BRANCH = one attractor born into the portrait: fixed point → limit cycle → separatrix → four basins.</text>
<text x="110" y="1040" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">λ CURSOR sweeps the timeline; inside every panel the loops keep firing at their real cadences (motion = live loops).</text>
<text x="110" y="1058" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">Regimes match the repo: RSIS3 core → +MyKB memory → +SPACE ideation → +unified-dashboard telemetry.</text>
<text x="110" y="1076" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">The topology is the point: adding a subsystem does not add a box — it changes the dynamics.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">bifurcation diagrams answer 'what changes when a new component joins?' — here the answer is the phase portrait itself</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 5 · dynamical portraits</text>
