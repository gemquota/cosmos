<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE COMPLEXITY BUDGET — WHERE THE WEIGHT LIVES</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">LOC, files, and interfaces — the real tax is the boundary count, not the line count</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<text x="500" y="108" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">three size dimensions, one budget: the 6 interfaces are worth more than all 239k LOC</text>
<rect x="60" y="136" width="880" height="42" rx="9" fill="#818cf8" opacity=".14" stroke="#818cf8" stroke-width="1" stroke-opacity=".35"/>
<text x="76" y="161.0" fill="#818cf8" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700">DIMENSION 1 · LINES OF CODE</text>
<text x="924" y="161.0" text-anchor="end" fill="#475569" font-family="system-ui,sans-serif" font-size="9">~239k total</text>
<rect x="60" y="205" width="362" height="34" rx="6" fill="#818cf8" opacity=".85"/>
<text x="241" y="226" text-anchor="middle" fill="#0b1120" font-family="system-ui,sans-serif" font-size="10" font-weight="800">RSIS3</text>
<text x="240.9" y="200" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="8">~67k LOC</text>
<rect x="439.8" y="205" width="373" height="34" rx="6" fill="#f59e0b" opacity=".85"/>
<text x="626" y="226" text-anchor="middle" fill="#0b1120" font-family="system-ui,sans-serif" font-size="10" font-weight="800">SPACE</text>
<text x="626.1" y="200" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="8">~69k LOC</text>
<rect x="830.4000000000001" y="205" width="556" height="34" rx="6" fill="#22d3ee" opacity=".85"/>
<text x="1108" y="226" text-anchor="middle" fill="#0b1120" font-family="system-ui,sans-serif" font-size="10" font-weight="800">MYKB+</text>
<text x="1108.5" y="200" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="8">~103k LOC</text>
<text x="60" y="268" text-anchor="start" fill="#475569" font-family="ui-monospace,Menlo,monospace" font-size="8.5">0 ──────────────── 239k LOC (total, incl. dashboard, tests, docs)</text>
<rect x="60" y="300" width="880" height="42" rx="9" fill="#22d3ee" opacity=".14" stroke="#22d3ee" stroke-width="1" stroke-opacity=".35"/>
<text x="76" y="325.0" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700">DIMENSION 2 · FILES</text>
<text x="924" y="325.0" text-anchor="end" fill="#475569" font-family="system-ui,sans-serif" font-size="9">2,881 total</text>
<rect x="60" y="366" width="802" height="34" rx="6" fill="#22d3ee" opacity=".85"/>
<text x="461" y="387" text-anchor="middle" fill="#0b1120" font-family="system-ui,sans-serif" font-size="10" font-weight="800">wiki pages</text>
<rect x="880.4000000000001" y="366" width="177" height="34" rx="6" fill="#f472b6" opacity=".85"/>
<text x="969" y="387" text-anchor="middle" fill="#0b1120" font-family="system-ui,sans-serif" font-size="10" font-weight="800">rsis3 + space + rest</text>
<text x="60" y="428" text-anchor="start" fill="#475569" font-family="ui-monospace,Menlo,monospace" font-size="8.5">0 ──────────────── 2,881 files (wiki corpus dominates — and it is data, not logic)</text>
<rect x="60" y="460" width="880" height="42" rx="9" fill="#10b981" opacity=".14" stroke="#10b981" stroke-width="1" stroke-opacity=".35"/>
<text x="76" y="485.0" fill="#10b981" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700">DIMENSION 3 · INTERFACES — THE REAL BUDGET</text>
<text x="924" y="485.0" text-anchor="end" fill="#475569" font-family="system-ui,sans-serif" font-size="9">the tax</text>
<rect x="60" y="524" width="432" height="40" rx="8" fill="#10b981" opacity=".8"/>
<line x1="132" y1="524" x2="132" y2="564" stroke="#0b1120" stroke-width="1.5"/>
<text x="132" y="548" text-anchor="middle" fill="#0b1120" font-family="ui-monospace,Menlo,monospace" font-size="8">IF-1</text>
<line x1="204" y1="524" x2="204" y2="564" stroke="#0b1120" stroke-width="1.5"/>
<text x="204" y="548" text-anchor="middle" fill="#0b1120" font-family="ui-monospace,Menlo,monospace" font-size="8">IF-2</text>
<line x1="276" y1="524" x2="276" y2="564" stroke="#0b1120" stroke-width="1.5"/>
<text x="276" y="548" text-anchor="middle" fill="#0b1120" font-family="ui-monospace,Menlo,monospace" font-size="8">IF-3</text>
<line x1="348" y1="524" x2="348" y2="564" stroke="#0b1120" stroke-width="1.5"/>
<text x="348" y="548" text-anchor="middle" fill="#0b1120" font-family="ui-monospace,Menlo,monospace" font-size="8">IF-4</text>
<line x1="420" y1="524" x2="420" y2="564" stroke="#0b1120" stroke-width="1.5"/>
<text x="420" y="548" text-anchor="middle" fill="#0b1120" font-family="ui-monospace,Menlo,monospace" font-size="8">IF-5</text>
<line x1="492" y1="524" x2="492" y2="564" stroke="#0b1120" stroke-width="1.5"/>
<text x="492" y="548" text-anchor="middle" fill="#0b1120" font-family="ui-monospace,Menlo,monospace" font-size="8">IF-6</text>
<text x="60" y="592" text-anchor="start" fill="#475569" font-family="system-ui,sans-serif" font-size="8.5">6 cross-component interfaces — each one a contract with error modes, formats, and cadence (A-25)</text>
<rect x="60" y="640" width="880" height="160" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="640" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="660" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="660.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE BUDGET RULE</text>
<text x="74" y="686" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Complexity is not LOC — it is coupling: 239k lines with 6 interfaces is simpler than 50k lines with 30 interfaces.</text>
<text x="74" y="712" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The system spends its complexity budget on recursion depth (loops, meta) and keeps the module graph flat (A-21).</text>
<text x="74" y="738" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">Every new interface must repay its cost: it has to cross one of the six existing contracts or justify a seventh.</text>
<rect x="60" y="830" width="880" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="830" width="880" height="32" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="60" y="850" width="880" height="12" fill="#818cf8" opacity=".12"/>
<text x="500.0" y="850.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE GAUGE</text>
<text x="74" y="876" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">LOC budget spent: 100% · files budget spent: 100% · interface budget spent: 6/6 — the tax is fully allocated.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE BUDGET</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">BAR WIDTH = real measured weight (LOC / files / interface count) — this diagram is drawn to scale.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">MYKB+ = wiki markdown plus Python tooling: the corpus is 2,360 pages of data, not logic — a different kind of weight.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE INTERFACE BAR is the budget that matters: six contracts carry the entire ecosystem.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">complexity is a budget you spend on coupling — the system chose six contracts and unlimited recursion</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>