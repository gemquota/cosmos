<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE FAILURE CASCADE — WHAT DEGRADES, WHAT SURVIVES</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Four dependencies, their failure modes, and the degraded modes the system was built for</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="60" y="130" width="880" height="38" rx="8" fill="#f472b6" opacity=".12" stroke="#334155"/>
<text x="165.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">DEPENDENCY</text>
<text x="380.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">FAILURE MODE</text>
<text x="605.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">DEGRADED MODE</text>
<text x="830.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">RECOVERY</text>
<rect x="60" y="168" width="880" height="64" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="203.5" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="8.5">MYKB DAEMON :8765</text>
<text x="280" y="203.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">retrieval returns nothing</text>
<text x="500" y="203.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">L1 runs context-free · capture deferred</text>
<text x="730" y="203.5" fill="#f472b6" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">daemon restart · buffer replays</text>
<rect x="60" y="232" width="880" height="64" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="267.5" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="8.5">EVALUATOR TIMEOUT</text>
<text x="280" y="267.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">candidate gets no verdict</text>
<text x="500" y="267.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">L2 treats as fail · retries (≤5)</text>
<text x="730" y="267.5" fill="#f472b6" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">next candidate · session continues</text>
<rect x="60" y="296" width="880" height="64" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="331.5" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="8.5">SPACE WEB UI DOWN</text>
<text x="280" y="331.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">no new RRP sessions</text>
<text x="500" y="331.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">L2 drafts from stale specs · exports intact</text>
<text x="730" y="331.5" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">restart :8888 · session resumes</text>
<rect x="60" y="360" width="880" height="64" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="395.5" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="8.5">DASHBOARD DOWN</text>
<text x="280" y="395.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">no live charts</text>
<text x="500" y="395.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">pulses keep buffering in JSONL</text>
<text x="730" y="395.5" fill="#10b981" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">reload — snapshot is re-read</text>
<rect x="60" y="424" width="880" height="64" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="459.5" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="8.5">LLM PROVIDER OUTAGE</text>
<text x="280" y="459.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">probe answers fail</text>
<text x="500" y="459.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">RRP retries provider · falls back to another of 7</text>
<text x="730" y="459.5" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">provider factory failover (E-03)</text>
<rect x="60" y="488" width="880" height="64" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="523.5" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="8.5">WIKI CORRUPTION</text>
<text x="280" y="523.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">search returns garbage</text>
<text x="500" y="523.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">temporal engine restores last snapshot</text>
<text x="730" y="523.5" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">git revert · index rebuild</text>
<rect x="60" y="620" width="880" height="130" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="620" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="640" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="640.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHAT THE TABLE IS REALLY SAYING</text>
<text x="74" y="666" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">No single failure is fatal: every dependency has a degraded mode, and every degraded mode has a recovery.</text>
<text x="74" y="692" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The two hardest are evaluator and daemon — one is a trust boundary, the other is the only always-on server.</text>
<text x="74" y="718" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">The port clash (:8765) is the one failure that can happen even when nothing else breaks.</text>
<rect x="60" y="780" width="880" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="780" width="880" height="32" rx="10" fill="#10b981" opacity=".16"/>
<rect x="60" y="800" width="880" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="800.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE RESILIENCE LADDER</text>
<text x="74" y="826" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">1 · degrade gracefully (context-free L1)  →  2 · retry (evaluator, provider)  →  3 · restore (temporal snapshots)</text>
<text x="74" y="852" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Checkpoint → HITL → fallback: RSIS3's triple recovery is the same ladder, applied to sessions instead of services.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE CASCADE</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">COLOUR = the component whose failure is described — pink for trust/external, amber SPACE, green dashboard, cyan MyKB.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">READ ACROSS = one dependency's whole story: mode → symptom → degraded behaviour → recovery path.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">DEGRADED MODES are design decisions, not accidents — the system is built to keep acting without memory.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">the failure table is the architecture's honesty document — everything can break, nothing is fatal</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>