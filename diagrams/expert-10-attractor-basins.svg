<text x="504.0" y="1019.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE PHASE PORTRAIT</text>
<text x="110" y="1044" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">BASIN = the loop that dominates a region · SEPARATRIX = the unstable ridge where pull is balanced, so states wander.</text>
<text x="110" y="1063" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">COMET SPEED = maturation rate — pulses reach DASH in ~5s (seconds of real time), consolidation takes 14s (hours).</text>
<text x="110" y="1082" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">DASHED CROSS-FLOWS = the one-way maturation pipeline: SPACE spec → RSIS3 implementation → MYKB consolidation, with retrieval back.</text>
<text x="110" y="1101" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">Each closed loop is one artifact class circulating into its home loop — motion is the system doing its job.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">phase space asks one question of every artifact: which loop wins? — and the answer is visible as motion</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 4 · experimental dynamics</text>
