<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE PULSE ANATOMY — ONE TELEMETRY EVENT, DISSECTED</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">What a pulse is, who writes it, and how it becomes a dashboard chart</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<text x="500" y="108" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">a pulse is the atomic unit of observability — emitted by every loop iteration</text>
<rect x="60" y="130" width="880" height="190" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="130" width="880" height="32" rx="10" fill="#10b981" opacity=".16"/>
<rect x="60" y="150" width="880" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="150.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE PAYLOAD — what one pulse carries</text>
<text x="76" y="178" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">{ "ts": 1753987200, "loop": "L1", "step": "tool_call", "tool": "rg" }</text>
<text x="76" y="204" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">{ "outcome": "ok", "duration_ms": 412, "retries": 0 }</text>
<text x="76" y="230" fill="#475569" font-family="system-ui,sans-serif" font-size="9">timestamp · loop · step · tool · outcome · duration · retries — nothing else. Pulses are tiny by design.</text>
<line x1="500" y1="320" x2="500" y2="348" stroke="#10b981" stroke-width="2.5" opacity="0.8" marker-end="url(#arwD)"/>
<rect x="140" y="356" width="720" height="84" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="140" y="356" width="720" height="28" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="140" y="372" width="720" height="12" fill="#818cf8" opacity=".12"/>
<text x="500.0" y="374.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">EMIT</text>
<text x="152" y="396" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">every loop iteration — L1 tool calls, L2 rounds, L3 cycles</text>
<line x1="500" y1="440" x2="500" y2="458" stroke="#10b981" stroke-width="2" opacity="0.6" marker-end="url(#arwD)"/>
<rect x="140" y="470" width="720" height="84" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="140" y="470" width="720" height="28" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="140" y="486" width="720" height="12" fill="#818cf8" opacity=".12"/>
<text x="500.0" y="488.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">APPEND</text>
<text x="152" y="510" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">JSONL buffer · rack/pulses/ · append-only</text>
<line x1="500" y1="554" x2="500" y2="572" stroke="#10b981" stroke-width="2" opacity="0.6" marker-end="url(#arwD)"/>
<rect x="140" y="584" width="720" height="84" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="140" y="584" width="720" height="28" rx="10" fill="#10b981" opacity=".16"/>
<rect x="140" y="600" width="720" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="602.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">EXTRACT</text>
<text x="152" y="624" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">rack reads the buffer → dashboard-data.json</text>
<line x1="500" y1="668" x2="500" y2="686" stroke="#10b981" stroke-width="2" opacity="0.6" marker-end="url(#arwD)"/>
<rect x="140" y="698" width="720" height="84" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="140" y="698" width="720" height="28" rx="10" fill="#10b981" opacity=".16"/>
<rect x="140" y="714" width="720" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="716.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">RENDER</text>
<text x="152" y="738" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">Chart.js + Tailwind in the dashboard → 20-pulse view</text>
<line x1="500" y1="782" x2="500" y2="800" stroke="#10b981" stroke-width="2" opacity="0.6" marker-end="url(#arwD)"/>
<rect x="140" y="812" width="720" height="84" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="140" y="812" width="720" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="140" y="828" width="720" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="830.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">EXTRAPOLATE</text>
<text x="152" y="852" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">TelemetryExtrapolator projects velocity/trends</text>
<rect x="60" y="932" width="880" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="932" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="952" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="952.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHY PULSES ARE NOT MEMORY</text>
<text x="74" y="978" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Pulses are observability — high volume, short-lived, append-only. Memory (A-17) is curated, durable, retrievable.</text>
<text x="74" y="1002" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">The dashboard reads the latest snapshot; the extrapolator reads the trend; neither rewrites the buffer.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE ANATOMY</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">GREEN = telemetry path (emit → render); pink = the extrapolator that turns history into a forecast.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE JSON ABOVE IS THE WHOLE CONTRACT — six fields, one line; anything bigger would slow the action loop.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">APPEND-ONLY is the integrity model: the buffer is never edited, only consumed — rollback means truncate.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">observability is a river, not a library — pulses flow past, lessons are kept</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>