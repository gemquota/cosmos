<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1600" height="1000" fill="url(#bgGrad)"/>
<text x="800.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">RSIS3 — EVALUATOR PIPELINE</text>
<text x="800.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">How improvements get validated: L2 candidate → immutable evaluator → PASS/FAIL gate</text>
<line x1="96.0" y1="76" x2="1504.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="110" y="130" width="300" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="110" y="130" width="300" height="32" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="110" y="150" width="300" height="12" fill="#818cf8" opacity=".12"/>
<text x="260.0" y="150.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L2ImprovementLoop</text>
<text x="124" y="176" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">_generate_candidate(goal)</text>
<text x="124" y="196" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">→ ImprovementCandidate</text>
<text x="124" y="216" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">  description, target_files,</text>
<text x="124" y="236" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">  diff_or_code, rationale</text>
<text x="124" y="256" fill="#475569" font-family="system-ui,sans-serif" font-size="9">max 5 attempts per session</text>
<line x1="410" y1="205" x2="448" y2="205" stroke="#818cf8" stroke-width="2.5" opacity="0.8" marker-end="url(#arwR)"/>
<rect x="450" y="130" width="300" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="450" y="130" width="300" height="32" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="450" y="150" width="300" height="12" fill="#22d3ee" opacity=".12"/>
<text x="600.0" y="150.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">EvaluatorClient</text>
<text x="464" y="176" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">verify_integrity()</text>
<text x="464" y="196" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">→ SHA-256 digest of</text>
<text x="464" y="216" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">  evaluator/evaluator.py</text>
<text x="464" y="236" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">startup_digest_verify=True</text>
<text x="464" y="256" fill="#475569" font-family="system-ui,sans-serif" font-size="9">read_only_mount=True</text>
<line x1="750" y1="205" x2="788" y2="205" stroke="#22d3ee" stroke-width="2.5" opacity="0.8" marker-end="url(#arwM)"/>
<rect x="790" y="130" width="320" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="790" y="130" width="320" height="32" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="790" y="150" width="320" height="12" fill="#f59e0b" opacity=".12"/>
<text x="950.0" y="150.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">subprocess.run()</text>
<text x="804" y="176" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">[sys.executable, evaluator.py]</text>
<text x="804" y="196" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">input=json.dumps(candidate)</text>
<text x="804" y="216" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">capture_output, timeout=60s</text>
<text x="804" y="236" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">evaluator runs in isolation</text>
<text x="804" y="256" fill="#475569" font-family="system-ui,sans-serif" font-size="9">never in scope for self-improvement</text>
<line x1="1110" y1="205" x2="1148" y2="205" stroke="#f59e0b" stroke-width="2.5" opacity="0.8" marker-end="url(#arwS)"/>
<rect x="1150" y="130" width="340" height="260" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="1150" y="130" width="340" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="1150" y="150" width="340" height="12" fill="#f472b6" opacity=".12"/>
<text x="1320.0" y="150.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">evaluator/evaluator.py — IMMUTABLE</text>
<text x="1164" y="176" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">Standalone read-only process</text>
<text x="1164" y="196" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">Reads candidate from stdin</text>
<text x="1164" y="216" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">Scores 5 dimensions:</text>
<text x="1164" y="236" fill="#475569" font-family="system-ui,sans-serif" font-size="9">  correctness, safety, efficiency,</text>
<text x="1164" y="256" fill="#475569" font-family="system-ui,sans-serif" font-size="9">  style, regression</text>
<text x="1164" y="276" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">Returns JSON decision</text>
<text x="1164" y="296" fill="#475569" font-family="system-ui,sans-serif" font-size="9">Prompt: evaluator/prompt.txt</text>
<text x="1164" y="316" fill="#475569" font-family="system-ui,sans-serif" font-size="9">--verify &lt;sha256&gt; at startup</text>
<rect x="110" y="420" width="480" height="130" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="110" y="420" width="480" height="32" rx="10" fill="#10b981" opacity=".16"/>
<rect x="110" y="440" width="480" height="12" fill="#10b981" opacity=".12"/>
<text x="350.0" y="440.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">EvalResult (dataclass)</text>
<text x="124" y="466" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">decision: "PASS" | "FAIL"</text>
<text x="124" y="486" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">scores: dict — 5 dimensions</text>
<text x="124" y="506" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">rationale + suggestions</text>
<text x="124" y="526" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">passed → decision == "PASS"</text>
<text x="124" y="546" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">score_avg → mean of scores</text>
<line x1="630" y1="555" x2="620" y2="610" stroke="#10b981" stroke-width="2.5" opacity="0.8" marker-end="url(#arwD)"/>
<rect x="420" y="615" width="380" height="140" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="420" y="615" width="380" height="32" rx="10" fill="#10b981" opacity=".16"/>
<rect x="420" y="635" width="380" height="12" fill="#10b981" opacity=".12"/>
<text x="610.0" y="635.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">PASS — apply improvement</text>
<text x="434" y="661" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">_apply_improvement(candidate)</text>
<text x="434" y="681" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">checkpoint before mutation</text>
<text x="434" y="701" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">memory.record_improvement()</text>
<text x="434" y="721" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">→ KG + vector store</text>
<line x1="1100" y1="555" x2="1140" y2="610" stroke="#f472b6" stroke-width="2.5" opacity="0.8" marker-end="url(#arwH)"/>
<rect x="940" y="615" width="380" height="140" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="940" y="615" width="380" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="940" y="635" width="380" height="12" fill="#f472b6" opacity=".12"/>
<text x="1130.0" y="635.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">FAIL — discard + recover</text>
<text x="954" y="661" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">discard candidate</text>
<text x="954" y="681" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">log failure pattern</text>
<text x="954" y="701" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">recovery.record_failure()</text>
<text x="954" y="721" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">retry or escalate to L3</text>
<path d="M 800 755 C 880 755, 880 330, 800 330" stroke="#475569" stroke-width="2" fill="none" opacity="0.85" stroke-dasharray="6,4" marker-end="url(#arwG)"/>
<text x="900" y="560" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">next attempt (up to 5)</text>
<rect x="110" y="620" width="260" height="130" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="110" y="620" width="260" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="110" y="640" width="260" height="12" fill="#f472b6" opacity=".12"/>
<text x="240.0" y="640.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Failure modes</text>
<text x="124" y="666" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">TimeoutExpired → FAIL</text>
<text x="124" y="686" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">process error → FAIL</text>
<text x="124" y="706" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">non-zero exit → FAIL</text>
<text x="124" y="726" fill="#475569" font-family="system-ui,sans-serif" font-size="9">rationale records the cause</text>
<line x1="310" y1="555" x2="300" y2="618" stroke="#f472b6" stroke-width="2" opacity="0.5" marker-end="url(#arwH)"/>
<rect x="110" y="790" width="1380" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="110" y="790" width="1380" height="34" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="110" y="812" width="1380" height="12" fill="#22d3ee" opacity=".12"/>
<text x="800.0" y="811.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHY IMMUTABLE</text>
<text x="124" y="838" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The evaluator is the only component never modified by the system — it is the trust anchor for self-improvement.</text>
<text x="124" y="864" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">SHA-256 digest verification at startup detects any tampering before a single candidate is judged.</text>
<text x="124" y="890" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">L2 generates → evaluator judges → L1 executes approved changes → L3 consolidates what was learned</text>
<text x="800.0" y="930" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Generated from source analysis</text>
</svg>