<text x="500.0" y="580.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE LOGIC</text>
<text x="74" y="606" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Each leaf is a single cause; each branch is an OR over its leaves — any leaf triggers the branch.</text>
<text x="74" y="632" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The TOP is OR over branches — but recovery is AND: you need daemon up AND index rebuilt AND cache warm.</text>
<text x="74" y="658" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">Compare the A-22 table: there you read failures across a row; here you read them down the tree's branches.</text>
<rect x="60" y="740" width="880" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="740" width="880" height="32" rx="10" fill="#10b981" opacity=".16"/>
<rect x="60" y="760" width="880" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="760.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE ONE INEVITABLE LEAF</text>
<text x="74" y="786" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">port clash :8765 is the only leaf with no external cause — it is designed in, which is why it has a documented owner.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE TREE</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">BRANCH COLOUR = the component that fails; circle gates = OR junctions (any child cause fires the parent).</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE TREE IS SHALLOW ON PURPOSE: two levels means every failure is diagnosable from the dashboard in one hop.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">This is the failure cascade (A-22) re-encoded as logic — same facts, different grammar.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">a fault tree is a promise: every failure the system can suffer is named and reachable</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>