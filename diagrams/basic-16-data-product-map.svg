<rect x="60" y="560" width="880" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="560" width="880" height="32" rx="10" fill="#10b981" opacity=".16"/>
<rect x="60" y="580" width="880" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="580.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">FORMAT FAMILIES</text>
<text x="74" y="606" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">JSON is the machine spine — candidates, verdicts, telemetry, dashboard data all speak it.</text>
<text x="74" y="632" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Markdown is the human spine — specs, lessons, and wiki pages are readable and diffable.</text>
<text x="74" y="658" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">SPACE exports one spec in six formats; MyKB archives them; RSIS3 consumes the canonical one.</text>
<rect x="60" y="740" width="880" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="740" width="880" height="32" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="60" y="760" width="880" height="12" fill="#818cf8" opacity=".12"/>
<text x="500.0" y="760.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHO PAYS FOR EACH PRODUCT</text>
<text x="74" y="786" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Every producer has exactly one primary consumer — except pulses, which fan out to the rack, the dashboard, and L3 trend detection.</text>
<text x="74" y="812" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Every consumer is coupled to a format contract: changing a format is an interface change, not a code change.</text>
<text x="74" y="838" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">The only bidirectional pair: candidates (RSIS3 → evaluator) and verdicts (evaluator → RSIS3) — one subprocess, two JSON messages.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE MAP</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">COLOURED FORMAT CELLS = producer palette — who owns the schema: SPACE amber, RSIS3 indigo, MyKB cyan, dashboard green, evaluator pink.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">READ ACROSS a row as a contract: producer → consumer with a format that neither side may silently change.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">The eight rows are the system's entire observable surface — nothing else crosses a component boundary.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">if a reviewer asks 'what does this system actually emit?', the answer is exactly these eight products</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>