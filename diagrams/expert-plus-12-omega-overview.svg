<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE Ω</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">BIG CIRCLES = the four runtimes (r ∝ footprint); SMALL DOTS = artifact families where they live on the spectra.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">DASHED ARCS = the six handoffs (B-17) drawn as geometry — every family sits inside its owner's basin.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">This is the whole ecosystem in one view: the X++ graph is this picture with hover, click, and a λ time slider.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">Ω is the last diagram — every other graph in this viewer is a zoom into this one plane</text>
