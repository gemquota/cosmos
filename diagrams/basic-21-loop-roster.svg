<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE LOOP ROSTER — ALL SIX RHYTHMS</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Every periodic process, its cadence, its trigger — and the ratios that phase-lock them</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="60" y="130" width="880" height="38" rx="8" fill="#f472b6" opacity=".12" stroke="#334155"/>
<text x="190.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">LOOP</text>
<text x="405.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">CADENCE</text>
<text x="620.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">TRIGGER</text>
<text x="845.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">RATIO</text>
<rect x="60" y="168" width="880" height="46" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="194.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">L1 · ACTION LOOP</text>
<text x="330" y="194.5" fill="#818cf8" font-family="ui-monospace,Menlo,monospace" font-size="8.5" font-weight="700">~1s</text>
<text x="500" y="194.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">per task / tool call</text>
<text x="760" y="194.5" fill="#818cf8" font-family="ui-monospace,Menlo,monospace" font-size="8.5" font-weight="700">1 — the base clock</text>
<rect x="60" y="214" width="880" height="46" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="240.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">RRP · IDEATION ROUND</text>
<text x="330" y="240.5" fill="#f59e0b" font-family="ui-monospace,Menlo,monospace" font-size="8.5" font-weight="700">~12s</text>
<text x="500" y="240.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">per SPACE probe round</text>
<text x="760" y="240.5" fill="#f59e0b" font-family="ui-monospace,Menlo,monospace" font-size="8.5" font-weight="700">12:1 vs L1</text>
<rect x="60" y="260" width="880" height="46" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="286.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">L3 · CONSOLIDATION</text>
<text x="330" y="286.5" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="8.5" font-weight="700">~60s</text>
<text x="500" y="286.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">per session plateau</text>
<text x="760" y="286.5" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="8.5" font-weight="700">5:1 vs RRP</text>
<rect x="60" y="306" width="880" height="46" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="332.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">RETRIEVAL</text>
<text x="330" y="332.5" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="8.5" font-weight="700">on-demand</text>
<text x="500" y="332.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">L1 asks MyKB :8765</text>
<text x="760" y="332.5" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="8.5" font-weight="700">sporadic</text>
<rect x="60" y="352" width="880" height="46" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="378.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">EVALUATOR</text>
<text x="330" y="378.5" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="8.5" font-weight="700">≤5 / session</text>
<text x="500" y="378.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">L2 candidate generated</text>
<text x="760" y="378.5" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="8.5" font-weight="700">burst · 60s cap</text>
<rect x="60" y="398" width="880" height="46" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="424.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">TELEMETRY FLUSH</text>
<text x="330" y="424.5" fill="#10b981" font-family="ui-monospace,Menlo,monospace" font-size="8.5" font-weight="700">~1s</text>
<text x="500" y="424.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">every pulse emitted</text>
<text x="760" y="424.5" fill="#10b981" font-family="ui-monospace,Menlo,monospace" font-size="8.5" font-weight="700">1:1 with L1</text>
<rect x="60" y="470" width="880" height="42" rx="9" fill="#f59e0b" opacity=".14" stroke="#f59e0b" stroke-width="1" stroke-opacity=".35"/>
<text x="76" y="495.0" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700">THE TWO RATIOS THAT PHASE-LOCK THE SYSTEM</text>
<text x="924" y="495.0" text-anchor="end" fill="#475569" font-family="system-ui,sans-serif" font-size="9">time-compressed</text>
<rect x="60" y="528" width="424" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="528" width="424" height="32" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="60" y="548" width="424" height="12" fill="#f59e0b" opacity=".12"/>
<text x="272.0" y="548.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">12 : 1 — PULSES PER RRP ROUND</text>
<text x="74" y="574" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Twelve L1 pulses fire inside one RRP ideation round.</text>
<text x="74" y="598" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The engine is executing while SPACE is ideating.</text>
<text x="74" y="622" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">This is the cadence ratio from the coupled-oscillators portrait (E-11).</text>
<rect x="516" y="528" width="424" height="180" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="516" y="528" width="424" height="32" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="516" y="548" width="424" height="12" fill="#818cf8" opacity=".12"/>
<text x="728.0" y="548.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">25 : 1 — ROUNDS PER SPEC</text>
<text x="530" y="574" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Twenty-five RRP rounds refine one spec draft.</text>
<text x="530" y="598" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The spec is the artifact that survives to become a candidate.</text>
<text x="530" y="622" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">25 rounds × ~12s ≈ the L2 session budget in compressed time.</text>
<rect x="60" y="736" width="880" height="140" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="736" width="880" height="32" rx="10" fill="#10b981" opacity=".16"/>
<rect x="60" y="756" width="880" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="756.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHAT PHASE-LOCK MEANS HERE</text>
<text x="74" y="782" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The loops are not free-running: L1 pulses gate on task boundaries, RRP rounds gate on probe answers, L3 gates on session plateaus.</text>
<text x="74" y="808" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">When the ratios hold, telemetry lines up — 12 pulses per round is visible in dashboard-data.json, not just in theory.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE ROSTER</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">COLOUR = the loop's component: RSIS3 indigo, SPACE amber, MyKB cyan, telemetry green, evaluator pink.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">READ CADENCE in compressed diagram time — real seconds are longer; the ratios are the invariant, not the absolute numbers.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">RETRIEVAL and EVALUATOR are not periodic — they are event-driven, which is why they break the 1/12/60 ladder.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">six rhythms, two ratios, one ladder — the roster is the system's heartbeat on paper</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>