<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE PROTOCOL STACK — THE RRP, LAYER BY LAYER</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">From a single probe to a consumed spec — seven layers with the ratios between them</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="120.0" y="128" width="760" height="72" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="120.0" y="128" width="760" height="28" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="120.0" y="144" width="760" height="12" fill="#818cf8" opacity=".12"/>
<text x="500.0" y="146.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L7 · CONSUMPTION</text>
<text x="132.0" y="168" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">RSIS3 L2 imports the canonical spec → candidates</text>
<line x1="500" y1="200" x2="500" y2="220" stroke="#f59e0b" stroke-width="2" opacity="0.6" marker-end="url(#arwS)"/>
<rect x="133.0" y="230" width="734" height="72" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="133.0" y="230" width="734" height="28" rx="10" fill="#10b981" opacity=".16"/>
<rect x="133.0" y="246" width="734" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="248.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L6 · EXPORT</text>
<text x="145.0" y="270" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">6 formats rendered from the canonical draft</text>
<line x1="500" y1="302" x2="500" y2="322" stroke="#f59e0b" stroke-width="2" opacity="0.6" marker-end="url(#arwS)"/>
<rect x="146.0" y="332" width="708" height="72" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="146.0" y="332" width="708" height="28" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="146.0" y="348" width="708" height="12" fill="#f59e0b" opacity=".12"/>
<text x="500.0" y="350.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L5 · SPEC</text>
<text x="158.0" y="372" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">one structured artifact per session</text>
<line x1="500" y1="404" x2="500" y2="424" stroke="#f59e0b" stroke-width="2" opacity="0.6" marker-end="url(#arwS)"/>
<rect x="159.0" y="434" width="682" height="72" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="159.0" y="434" width="682" height="28" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="159.0" y="450" width="682" height="12" fill="#f59e0b" opacity=".12"/>
<text x="500.0" y="452.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L4 · SESSION</text>
<text x="171.0" y="474" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">25 rounds × 7 series · 326 probes in play</text>
<line x1="500" y1="506" x2="500" y2="526" stroke="#f59e0b" stroke-width="2" opacity="0.6" marker-end="url(#arwS)"/>
<rect x="172.0" y="536" width="656" height="72" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="172.0" y="536" width="656" height="28" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="172.0" y="552" width="656" height="12" fill="#f59e0b" opacity=".12"/>
<text x="500.0" y="554.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L3 · ROUND</text>
<text x="184.0" y="576" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">probe → answer → reflect · 12s</text>
<line x1="500" y1="608" x2="500" y2="628" stroke="#f59e0b" stroke-width="2" opacity="0.6" marker-end="url(#arwS)"/>
<rect x="185.0" y="638" width="630" height="72" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="185.0" y="638" width="630" height="28" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="185.0" y="654" width="630" height="12" fill="#f59e0b" opacity=".12"/>
<text x="500.0" y="656.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L2 · SERIES</text>
<text x="197.0" y="678" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">7 series with dependency chain S1 → S7</text>
<line x1="500" y1="710" x2="500" y2="730" stroke="#f59e0b" stroke-width="2" opacity="0.6" marker-end="url(#arwS)"/>
<rect x="198.0" y="740" width="604" height="72" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="198.0" y="740" width="604" height="28" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="198.0" y="756" width="604" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="758.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L1 · PROBE</text>
<text x="210.0" y="780" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">the atomic question · 326 of them</text>
<rect x="60" y="846" width="880" height="100" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="846" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="866" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="866.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE RATIOS BETWEEN LAYERS</text>
<text x="74" y="892" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">L3 → L4: 12 pulses per round (12:1) ·  L4 → L5: 25 rounds per spec (25:1)</text>
<text x="74" y="918" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">L1 → L2: 326 probes distributed across 7 series ·  L5 → L6: one spec, six renderings</text>
<rect x="60" y="850" width="880" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="850" width="880" height="32" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="60" y="870" width="880" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="870.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHY THE STACK NARROWS</text>
<text x="74" y="896" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Each layer is a lossy-but-purposeful compression: probes → answers → ranked answers → spec → format.</text>
<text x="74" y="920" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">The narrowing is the information flow (E-13) drawn as layers instead of a curve.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE STACK</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">STACK WIDTH = the layer's breadth — 326 probes are wide, one canonical spec is narrow.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">COLOUR = owning component: probes/rounds/series/spec amber, exports green, consumption indigo, atomic questions cyan.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">READ BOTTOM-UP as the protocol: L1 atoms compose into L7 consumption; each arrow is a defined transition.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">the RRP is not a checklist — it is a protocol with defined layers and measured ratios</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>