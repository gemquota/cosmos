<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE IMPROVEMENT STACK — ONE IDEA BECOMES MEMORY</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Six rungs from ideation to durable memory — the return path is retrieval</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="170" y="120" width="660" height="86" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="170" y="120" width="660" height="30" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="170" y="138" width="660" height="12" fill="#f59e0b" opacity=".12"/>
<text x="500.0" y="139.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">1 · IDEA</text>
<text x="182" y="162" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">a probe answer in an RRP session — 326 probes, 7 series</text>
<line x1="500.0" y1="210" x2="500.0" y2="236" stroke="#f59e0b" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<rect x="170" y="240" width="660" height="86" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="170" y="240" width="660" height="30" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="170" y="258" width="660" height="12" fill="#f59e0b" opacity=".12"/>
<text x="500.0" y="259.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">2 · SPEC</text>
<text x="182" y="282" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">structured spec draft — exported in 6 formats</text>
<line x1="500.0" y1="330" x2="500.0" y2="356" stroke="#f59e0b" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<rect x="170" y="360" width="660" height="86" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="170" y="360" width="660" height="30" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="170" y="378" width="660" height="12" fill="#818cf8" opacity=".12"/>
<text x="500.0" y="379.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">3 · CANDIDATE</text>
<text x="182" y="402" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">L2 turns the spec into code/diff — evaluator-gated</text>
<line x1="500.0" y1="450" x2="500.0" y2="476" stroke="#818cf8" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<rect x="170" y="480" width="660" height="86" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="170" y="480" width="660" height="30" rx="10" fill="#10b981" opacity=".16"/>
<rect x="170" y="498" width="660" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="499.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">4 · PULSE</text>
<text x="182" y="522" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">L1 runs emit telemetry — JSONL, ~1s cadence</text>
<line x1="500.0" y1="570" x2="500.0" y2="596" stroke="#10b981" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<rect x="170" y="600" width="660" height="86" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="170" y="600" width="660" height="30" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="170" y="618" width="660" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="619.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">5 · LESSON</text>
<text x="182" y="642" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">post-session capture — what worked, what didn't</text>
<line x1="500.0" y1="690" x2="500.0" y2="716" stroke="#22d3ee" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<rect x="170" y="720" width="660" height="86" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="170" y="720" width="660" height="30" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="170" y="738" width="660" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="739.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">6 · MEMORY</text>
<text x="182" y="762" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">KG edge + wiki page — retrievable via :8765</text>
<path d="M 830,640 C 920,640 920,300 830,300" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="7,5" opacity=".85" marker-end="url(#arwM)"/>
<text x="905" y="470" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="9">retrieval · :8765</text>
<text x="905" y="486" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="8">memory → next idea</text>
<path d="M 500 412 L 512 424 L 500 436 L 488 424 Z" fill="#0b1120" stroke="#f472b6" stroke-width="1.8"/>
<text x="500" y="402" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="8">EVALUATOR GATE</text>
<rect x="60" y="978" width="880" height="82" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="978" width="880" height="30" rx="10" fill="#10b981" opacity=".16"/>
<rect x="60" y="996" width="880" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="997.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE STACK IN ONE LINE</text>
<text x="74" y="1022" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">idea → spec → candidate → pulse → lesson → memory — every rung is a format change, every arrow is a component handoff.</text>
<rect x="60" y="1154" width="880" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1154" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1170" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1172.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE STACK</text>
<text x="72" y="1194" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">UPWARD FLOW = maturation: each rung is produced by the component above's colour — SPACE amber → RSIS3 indigo → DASH green → MyKB cyan.</text>
<text x="72" y="1211" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">GATE = between candidate and pulse: the evaluator is the only rung that can send an artifact back down.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">RETURN ARC = the stack is a loop: consolidated memory is retrieved (:8765) to seed the next idea.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">FOUR COLOURS, SIX RUNGS — the two middle transitions (spec→candidate, pulse→lesson) are RSIS3's two L2/L3 jobs.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">improvement is not a circle in this system — it is a stack with a return elevator</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>