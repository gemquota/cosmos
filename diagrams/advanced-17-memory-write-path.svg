<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE MEMORY WRITE PATH — HOW A SESSION BECOMES KNOWLEDGE</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Three capture hooks, one consolidation cycle — the only way the corpus grows</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="60" y="120" width="880" height="42" rx="9" fill="#22d3ee" opacity=".14" stroke="#22d3ee" stroke-width="1" stroke-opacity=".35"/>
<text x="76" y="145.0" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700">CAPTURE HOOKS</text>
<text x="924" y="145.0" text-anchor="end" fill="#475569" font-family="system-ui,sans-serif" font-size="9">session → durable traces</text>
<rect x="60" y="178" width="880" height="74" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="178" width="880" height="30" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="60" y="196" width="880" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="197.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">HOOK 1 · RETRIEVAL LOG</text>
<text x="72" y="220" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">what was asked + what came back  →  query record</text>
<rect x="60" y="268" width="880" height="74" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="268" width="880" height="30" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="60" y="286" width="880" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="287.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">HOOK 2 · EVAL VERDICT</text>
<text x="72" y="310" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">candidate + scores + gate reasoning  →  artifact history</text>
<rect x="60" y="358" width="880" height="74" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="358" width="880" height="30" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="60" y="376" width="880" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="377.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">HOOK 3 · SESSION TRANSCRIPT</text>
<text x="72" y="400" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">tool calls, observations, outcomes  →  raw transcript</text>
<line x1="500" y1="432" x2="500" y2="458" stroke="#22d3ee" stroke-width="2.5" opacity="0.8" marker-end="url(#arwM)"/>
<rect x="60" y="466" width="880" height="42" rx="9" fill="#818cf8" opacity=".14" stroke="#818cf8" stroke-width="1" stroke-opacity=".35"/>
<text x="76" y="491.0" fill="#818cf8" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700">L3 CONSOLIDATION</text>
<text x="924" y="491.0" text-anchor="end" fill="#475569" font-family="system-ui,sans-serif" font-size="9">~60s cycle</text>
<rect x="60" y="524" width="880" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="524" width="880" height="28" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="60" y="540" width="880" height="12" fill="#818cf8" opacity=".12"/>
<text x="500.0" y="542.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">NORMALIZE</text>
<text x="72" y="564" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">markdown lint · dedupe · link wiki pages</text>
<line x1="500" y1="582" x2="500" y2="598" stroke="#475569" stroke-width="1.8" opacity="0.6" marker-end="url(#arwG)"/>
<rect x="60" y="598" width="880" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="598" width="880" height="28" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="60" y="614" width="880" height="12" fill="#818cf8" opacity=".12"/>
<text x="500.0" y="616.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WRITE</text>
<text x="72" y="638" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">new wiki page + KG edge in graph.json</text>
<line x1="500" y1="656" x2="500" y2="672" stroke="#475569" stroke-width="1.8" opacity="0.6" marker-end="url(#arwG)"/>
<rect x="60" y="672" width="880" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="672" width="880" height="28" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="60" y="688" width="880" height="12" fill="#818cf8" opacity=".12"/>
<text x="500.0" y="690.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">SNAPSHOT</text>
<text x="72" y="712" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">git commit → temporal engine checkpoint</text>
<line x1="500" y1="730" x2="500" y2="746" stroke="#475569" stroke-width="1.8" opacity="0.6" marker-end="url(#arwG)"/>
<rect x="60" y="746" width="880" height="58" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="746" width="880" height="28" rx="10" fill="#10b981" opacity=".16"/>
<rect x="60" y="762" width="880" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="764.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">REBUILD</text>
<text x="72" y="786" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">TF-IDF index refresh → retrievable via :8765</text>
<rect x="60" y="840" width="880" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="840" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="860" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="860.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE ORDER IS A LIE — THE TIMING IS REAL</text>
<text x="74" y="886" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Hooks 1–3 fire during the session (L1/L2 pace); consolidation runs on the L3 cycle (~60s compressed) after the plateau.</text>
<text x="74" y="910" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">Until L3 runs, the traces exist only as JSONL/transcripts — memory is written in one batch, not continuously.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE WRITE PATH</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">CYAN = capture (MyKB hooks); indigo = consolidation stages; green = the index rebuild that makes memory retrievable.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">READ DOWNWARD as one pipeline: three hooks feed one batch cycle that ends with retrieval being able to see the new page.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE SNAPSHOT IS THE SAFETY: every write is a git commit, so the temporal engine can roll any capture back.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">memory grows in batches, not streams — capture is cheap, consolidation is the gate</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>