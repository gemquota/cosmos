<text x="464" y="576" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">grades response quality</text>
<text x="464" y="598" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">feeds adaptive-router</text>
<text x="464" y="620" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">skip questions when</text>
