<text x="824" y="546" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">complete(params: CompletionParams) → Promise&lt;CompletionResult&gt;</text>
<text x="824" y="568" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">CompletionParams: prompt, model?, temperature?, maxTokens?</text>
<text x="824" y="590" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">CompletionResult: text, usage?, meta?</text>
<text x="824" y="612" fill="#475569" font-family="system-ui,sans-serif" font-size="9">Every provider implements the same contract — swappable via config</text>
<text x="110" y="500" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="11">⬇ CONSUMERS</text>
