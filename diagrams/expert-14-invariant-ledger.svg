<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE INVARIANT LEDGER — WHAT NEVER CHANGES</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">The constants the whole ecosystem is built around, what enforces each, and what would break it</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="60" y="130" width="880" height="38" rx="8" fill="#f472b6" opacity=".12" stroke="#334155"/>
<text x="175.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">INVARIANT</text>
<text x="455.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">ENFORCED BY</text>
<text x="780.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">WOULD BREAK IF…</text>
<rect x="60" y="168" width="880" height="56" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="199.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">EVALUATOR IMMUTABILITY</text>
<text x="300" y="199.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">SHA-256 digest · read-only mount</text>
<text x="630" y="199.5" fill="#f472b6" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">self-improvement must never rewrite its judge</text>
<rect x="60" y="224" width="880" height="56" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="255.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">326 PROBES · 7 SERIES</text>
<text x="300" y="255.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">prompt-framework/ is versioned</text>
<text x="630" y="255.5" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">the RRP input surface is fixed by design</text>
<rect x="60" y="280" width="880" height="56" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="311.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">6 EXPORT FORMATS</text>
<text x="300" y="311.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">exports/ formatters</text>
<text x="630" y="311.5" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">consumers depend on the format set</text>
<rect x="60" y="336" width="880" height="56" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="367.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">7 LLM PROVIDERS</text>
<text x="300" y="367.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">provider factory</text>
<text x="630" y="367.5" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">no single provider is load-bearing</text>
<rect x="60" y="392" width="880" height="56" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="423.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">12:1 · 25:1 RATIOS</text>
<text x="300" y="423.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">loop clocks · dashboard telemetry</text>
<text x="630" y="423.5" fill="#10b981" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">the cadence relationships are measured, not tuned</text>
<rect x="60" y="448" width="880" height="56" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="479.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">WIKI IS THE SOURCE OF TRUTH</text>
<text x="300" y="479.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">capture hooks + git</text>
<text x="630" y="479.5" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">any writer that bypasses capture corrupts memory</text>
<rect x="60" y="504" width="880" height="56" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="535.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">ONE DASHBOARD</text>
<text x="300" y="535.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">root index.html redirect</text>
<text x="630" y="535.5" fill="#10b981" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">standalone dashboards are not added</text>
<rect x="60" y="560" width="880" height="56" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="591.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">PORT MAP :9000 :8765 :8888 :8899</text>
<text x="300" y="591.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">config.js + server bindings</text>
<text x="630" y="591.5" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">clients hard-code the contract</text>
<rect x="60" y="620" width="880" height="130" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="620" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="640" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="640.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE POINT OF THE LEDGER</text>
<text x="74" y="666" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Invariants are the architecture's axioms — you can change anything else and the system still means the same thing.</text>
<text x="74" y="692" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Most are enforced by structure (spawn, redirect, factory), not by policy — nobody can violate them by accident.</text>
<text x="74" y="718" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">The wiki-as-truth invariant is the one with teeth: violating it corrupts memory for every future session.</text>
<rect x="60" y="780" width="880" height="100" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="780" width="880" height="32" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="60" y="800" width="880" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="800.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">INVARIANTS VS THE DOUBLING PASS</text>
<text x="74" y="826" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Every diagram in this viewer is an observation of these constants — the ledger is the theory, the diagrams are the data.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE LEDGER</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">COLOUR = the component that guarantees the invariant — pink for the trust boundary, amber SPACE, green dashboard, cyan MyKB.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">ENFORCED BY is a mechanism, not a wish: digests, factories, redirects, bindings — all visible in the code.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">WOULD BREAK IF… is the failure clause — every invariant has one, which is what makes it testable.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">if two diagrams disagree, one of them is wrong — the ledger is the tiebreaker</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>