<text x="165.0" y="158.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L1 COLLECTOR</text>
<text x="70" y="178" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">tool calls · observations · retries</text>
<path d="M 165 260 C 165 300, 400 300, 500 320" stroke="#475569" stroke-width="1.8" fill="none" opacity="0.55" marker-end="url(#arwG)"/>
