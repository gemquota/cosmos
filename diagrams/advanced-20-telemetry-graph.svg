<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE TELEMETRY GRAPH — FROM LOOP TO CHART</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Four collectors, one buffer, one JSON snapshot, one extrapolator</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<text x="500" y="108" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">every loop emits; the rack buffers; the dashboard renders; the extrapolator forecasts</text>
<rect x="60" y="140" width="210" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="140" width="210" height="28" rx="10" fill="#818cf8" opacity=".16"/>
