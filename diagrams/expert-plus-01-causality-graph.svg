<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE CAUSALITY GRAPH — WHAT CAUSES WHAT, WITH LAG</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Nine events, ten causal edges, four loops — the ecosystem as a directed graph of consequences</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<circle cx="200" cy="210" r="30" fill="#f59e0b" opacity=".16" stroke="#f59e0b" stroke-width="1.8"/>
<text x="200" y="210" text-anchor="middle" dominant-baseline="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8.5" font-weight="800">SPEC</text>
<circle cx="460" cy="190" r="30" fill="#818cf8" opacity=".16" stroke="#818cf8" stroke-width="1.8"/>
<text x="460" y="190" text-anchor="middle" dominant-baseline="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="8.5" font-weight="800">CANDIDATE</text>
