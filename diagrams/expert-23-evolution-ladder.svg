<text x="740" y="744" text-anchor="start" fill="#475569" font-family="system-ui,sans-serif" font-size="7.5">capability</text>
<rect x="60" y="848" width="880" height="100" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="848" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="868" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="868.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHAT A GATE IS</text>
<text x="74" y="894" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Each gate is a measured capability, not a code review: retrieval must round-trip, specs must pass the evaluator, embeds must render.</text>
<text x="74" y="920" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">Failing a gate does not roll back the rung — it holds the ladder until the measurement passes.</text>
<rect x="60" y="972" width="880" height="80" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="972" width="880" height="32" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="60" y="992" width="880" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="992.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">LINK TO THE OTHER λ DIAGRAMS</text>
<text x="74" y="1018" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">B-24 showed the λ stages as a timeline; A-13 as bifurcations; this ladder adds the gate each climb must clear.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE LADDER</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">RUNG COLOUR = the subsystem added at that λ; DIAMONDS = gates with their proof conditions.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">READ UPWARD: each rung is a strict superset and each gate is a measurable prerequisite for the next.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">The ladder and the timeline (B-24) tell the same story in two grammars — history and requirements.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">evolution is not automatic here — each rung must earn its gate, and the gates are measurements</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
