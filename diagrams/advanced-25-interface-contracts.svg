<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE INTERFACE CONTRACT TABLE — THE FINE PRINT</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Six interfaces with transport, payload, error handling and cadence — the spec-level detail</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="60" y="130" width="880" height="38" rx="8" fill="#f472b6" opacity=".12" stroke="#334155"/>
<text x="160.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">INTERFACE</text>
<text x="360.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">TRANSPORT</text>
<text x="555.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">PAYLOAD</text>
<text x="735.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">ERROR MODE</text>
<text x="880.0" y="153.0" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="9.5">CADENCE</text>
<rect x="60" y="168" width="880" height="74" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="208.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">SPACE → RSIS3</text>
<text x="270" y="208.5" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="8.5">filesystem · exports/</text>
<text x="470" y="208.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">spec draft · 6 formats</text>
<text x="660" y="208.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">missing draft → L2 stalls</text>
<text x="830" y="208.5" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">on-demand</text>
<rect x="60" y="242" width="880" height="74" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="282.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">RSIS3 → EVALUATOR</text>
<text x="270" y="282.5" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="8.5">subprocess · stdin/stdout</text>
<text x="470" y="282.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">candidate + verdict JSON</text>
<text x="660" y="282.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">timeout 60s → treated as fail</text>
<text x="830" y="282.5" fill="#f472b6" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">≤5/session</text>
<rect x="60" y="316" width="880" height="74" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="356.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">RSIS3 → DASHBOARD</text>
<text x="270" y="356.5" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="8.5">JSONL → dashboard-data.json</text>
<text x="470" y="356.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">pulse events</text>
<text x="660" y="356.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">buffer survives · no loss</text>
<text x="830" y="356.5" fill="#10b981" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">~1s</text>
<rect x="60" y="390" width="880" height="74" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="430.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">MYKB → RSIS3</text>
<text x="270" y="430.5" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="8.5">HTTP :8765</text>
<text x="470" y="430.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">query + ranked window</text>
<text x="660" y="430.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">daemon down → context-free L1</text>
<text x="830" y="430.5" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">on-demand</text>
<rect x="60" y="464" width="880" height="74" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="504.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">RSIS3 → MYKB</text>
<text x="270" y="504.5" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="8.5">filesystem · wiki + graph</text>
<text x="470" y="504.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">capture page + KG edge</text>
<text x="660" y="504.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">write fail → git-safe retry</text>
<text x="830" y="504.5" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">post-session</text>
<rect x="60" y="538" width="880" height="74" fill="#0f172a" stroke="#334155" stroke-width="0.7"/>
<text x="70" y="578.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">DASHBOARD → SPACE</text>
<text x="270" y="578.5" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="8.5">browser · link</text>
<text x="470" y="578.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">open :8888 / :8899</text>
<text x="660" y="578.5" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="8.5">UI down → link 404</text>
<text x="830" y="578.5" fill="#10b981" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">user-driven</text>
<rect x="60" y="640" width="880" height="130" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="640" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="660" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="660.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">CONTRACT RULES EVERY ENGINEER HERE KNOWS</text>
<text x="74" y="686" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">1 · Payloads are versioned by directory (exports/, rack/pulses/) — never by ad-hoc schema drift.</text>
<text x="74" y="710" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">2 · Errors are modes, not exceptions — every row above names the degraded behaviour, not a stack trace.</text>
<text x="74" y="734" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">3 · Cadence is part of the contract — on-demand vs ~1s vs post-session changes how clients must buffer.</text>
<rect x="60" y="800" width="880" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="800" width="880" height="32" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="60" y="820" width="880" height="12" fill="#818cf8" opacity=".12"/>
<text x="500.0" y="820.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE ONLY BIDIRECTIONAL PAIR</text>
<text x="74" y="846" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">RSIS3 → evaluator → RSIS3: two JSON messages over one subprocess — the contract's tightest loop.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE TABLE</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">COLOURED CADENCE CELL = sender palette — the contract is owned by whoever initiates the message.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">ERROR MODE column is the contract's most important part: it names the degraded mode from the failure cascade (A-22).</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">COMPARE WITH B-17: B-17 shows the six handoffs as cards; this table adds transport and error semantics.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">interfaces here are contracts with error modes — the ecosystem is specified, not just sketched</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>