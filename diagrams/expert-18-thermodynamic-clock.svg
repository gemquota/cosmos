<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE THERMODYNAMIC CLOCK — COST AND ORDER AROUND THE LOOP</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Cheap chaos in ideation, expensive order in memory — the gradient the whole system runs on</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<circle cx="500" cy="470" r="250" fill="none" stroke="#334155" stroke-width="1.4"/>
<circle cx="500" cy="220" r="56" fill="#f59e0b" opacity=".18" stroke="#f59e0b" stroke-width="2"/>
<text x="500" y="214" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="11.5" font-weight="800">IDEATION</text>
<text x="500" y="234" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="7.5">high entropy · cheap to draft</text>
<text x="500" y="252" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,monospace" font-size="8">T↑</text>
<circle cx="750" cy="470" r="56" fill="#f472b6" opacity=".18" stroke="#f472b6" stroke-width="2"/>
<text x="750" y="464" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="11.5" font-weight="800">EVALUATOR</text>
<text x="750" y="484" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="7.5">energy barrier · rejection is work</text>
<text x="750" y="502" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,monospace" font-size="8">ΔG</text>
<circle cx="500" cy="720" r="56" fill="#22d3ee" opacity=".18" stroke="#22d3ee" stroke-width="2"/>
<text x="500" y="714" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="11.5" font-weight="800">CONSOLIDATION</text>
<text x="500" y="734" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="7.5">low entropy · expensive to build</text>
<text x="500" y="752" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,monospace" font-size="8">T↓</text>
<circle cx="250" cy="470" r="56" fill="#818cf8" opacity=".18" stroke="#818cf8" stroke-width="2"/>
<text x="250" y="464" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="11.5" font-weight="800">EXECUTION</text>
<text x="250" y="484" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="7.5">the work in between</text>
<text x="250" y="502" text-anchor="middle" fill="#475569" font-family="ui-monospace,Menlo,monospace" font-size="8">W</text>
<path d="M 500 220 Q 625.0 285.0 750 470" fill="none" stroke="#475569" stroke-width="1.8" opacity=".8" marker-end="url(#arwG)"/>
<path d="M 750 470 Q 625.0 535.0 500 720" fill="none" stroke="#475569" stroke-width="1.8" opacity=".8" marker-end="url(#arwG)"/>
<path d="M 500 720 Q 375.0 535.0 250 470" fill="none" stroke="#475569" stroke-width="1.8" opacity=".8" marker-end="url(#arwG)"/>
<path d="M 250 470 Q 375.0 285.0 500 220" fill="none" stroke="#475569" stroke-width="1.8" opacity=".8" marker-end="url(#arwG)"/>
<circle r="5.5" fill="#ffffff" stroke="#0b1120" stroke-width="1"><animateMotion dur="12s" repeatCount="indefinite" path="M 500 220 A 250 250 0 1 1 499.9 220 Z"/></circle>
<text x="500" y="780" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9">comet = one artifact's thermodynamic journey — cheap chaos → barrier → work → expensive order</text>
<rect x="60" y="820" width="880" height="140" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="820" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="840" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="840.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE GRADIENT, STATED HONESTLY</text>
<text x="74" y="866" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Cost here is real: tokens for ideation, time for evaluation, git+index work for consolidation.</text>
<text x="74" y="892" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Order is real too: a spec is more structured than an idea; a KG edge is more structured than a transcript.</text>
<text x="74" y="918" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">The clock is the energy landscape (A-12) drawn as a cycle instead of a terrain — same gradient, closed path.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE CLOCK</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">COMET = one artifact circling: each lap spends entropy (ideation) to buy order (memory) — motion is the gradient.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE EVALUATOR IS THE BARRIER: energy must be spent to cross it; rejected artifacts bounce back to ideation.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">TEMPERATURE LABELS are entropy, not heat: T↑ = many possibilities, T↓ = few — the loop runs downhill overall.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">the whole system is a heat engine for knowledge — it burns possibilities to forge facts</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>