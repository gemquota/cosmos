<text x="800.0" y="811.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">CONSUMED BY L3EvolutionLoop</text>
<text x="124" y="838" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">_detect_trends() → _consolidate_memory() → _evolve_strategies() → _refine_redundancies()</text>
<text x="124" y="864" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Insights land in the knowledge graph → next session's retrieval context</text>
<text x="124" y="890" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">The loop closes: L1/L2 produce telemetry → L3 turns it into better L1/L2 behavior</text>
