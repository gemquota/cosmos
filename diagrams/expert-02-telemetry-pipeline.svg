<text x="974" y="198" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">flush() every 5s (threaded)</text>
<text x="974" y="220" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">_session_id = uuid4()</text>
<text x="974" y="242" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">start()/stop() lifecycle</text>
