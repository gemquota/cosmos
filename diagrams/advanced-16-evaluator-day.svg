<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE EVALUATOR'S DAY — ONE VERDICT, END TO END</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">From candidate JSON to pass/fail — the only code path RSIS3 may not rewrite</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="90" y="130" width="700" height="92" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="90" y="130" width="700" height="30" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="90" y="148" width="700" height="12" fill="#818cf8" opacity=".12"/>
<text x="440.0" y="149.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">1 · CANDIDATE</text>
<text x="102" y="172" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">L2 drafts diff/code + rationale</text>
<text x="102" y="192" fill="#475569" font-family="system-ui,sans-serif" font-size="9">transport: JSON, stdin</text>
<line x1="500" y1="222" x2="500" y2="240" stroke="#f472b6" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<rect x="90" y="252" width="700" height="92" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="90" y="252" width="700" height="30" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="90" y="270" width="700" height="12" fill="#f472b6" opacity=".12"/>
<text x="440.0" y="271.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">2 · INTEGRITY</text>
<text x="102" y="294" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">SHA-256 of evaluator.py verified at startup</text>
<text x="102" y="314" fill="#475569" font-family="system-ui,sans-serif" font-size="9">transport: --verify &lt;sha256&gt;</text>
<line x1="500" y1="344" x2="500" y2="362" stroke="#f472b6" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<rect x="90" y="374" width="700" height="92" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="90" y="374" width="700" height="30" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="90" y="392" width="700" height="12" fill="#f472b6" opacity=".12"/>
<text x="440.0" y="393.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">3 · SPAWN</text>
<text x="102" y="416" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">subprocess.run([python, evaluator.py], timeout=60)</text>
<text x="102" y="436" fill="#475569" font-family="system-ui,sans-serif" font-size="9">transport: read-only mount</text>
<line x1="500" y1="466" x2="500" y2="484" stroke="#f472b6" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<rect x="90" y="496" width="700" height="92" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="90" y="496" width="700" height="30" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="90" y="514" width="700" height="12" fill="#22d3ee" opacity=".12"/>
<text x="440.0" y="515.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">4 · SCORE</text>
<text x="102" y="538" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">5 dimensions: correctness · safety · efficiency · style · regression</text>
<text x="102" y="558" fill="#475569" font-family="system-ui,sans-serif" font-size="9">transport: prompt.txt</text>
<line x1="500" y1="588" x2="500" y2="606" stroke="#f472b6" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<rect x="90" y="618" width="700" height="92" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="90" y="618" width="700" height="30" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="90" y="636" width="700" height="12" fill="#f472b6" opacity=".12"/>
<text x="440.0" y="637.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">5 · VERDICT</text>
<text x="102" y="660" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">pass/fail + scores → stdout as JSON</text>
<text x="102" y="680" fill="#475569" font-family="system-ui,sans-serif" font-size="9">transport: stdout</text>
<line x1="500" y1="710" x2="500" y2="728" stroke="#818cf8" stroke-width="2" opacity="0.6" marker-end="url(#arwG)"/>
<rect x="90" y="740" width="700" height="92" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="90" y="740" width="700" height="30" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="90" y="758" width="700" height="12" fill="#818cf8" opacity=".12"/>
<text x="440.0" y="759.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">6 · APPLY</text>
<text x="102" y="782" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">pass → apply candidate; fail → L2 retries (≤5/session)</text>
<text x="102" y="802" fill="#475569" font-family="system-ui,sans-serif" font-size="9">transport: L2 loop</text>
<rect x="60" y="868" width="880" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="868" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="888" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="888.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE BOUNDARIES</text>
<text x="74" y="914" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The evaluator never imports RSIS3, never touches the repo except read-only, and is never in scope for self-improvement.</text>
<text x="74" y="940" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Its prompt and code are content-addressed — any drift is caught by the digest check before the spawn.</text>
<text x="74" y="966" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">Budgets: ≤5 candidates per session · 60s per evaluation · verdicts stored with the candidate for audit.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE DAY</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">PINK = the immutable evaluator's steps; indigo = the L2 loop that owns the candidate; cyan = the scoring model.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE ONLY TWO-STEP LOOP: verdicts flow back to L2, rejected candidates restart at step 1 — the session survives.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">Every step is logged — the verdict is part of the artifact's history in MyKB (capture, A-17).</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">the evaluator is not an oracle — it is a checked subprocess with a contract and a budget</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>