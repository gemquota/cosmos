<text x="890" y="526" text-anchor="start" fill="#10b981" font-family="ui-monospace,Menlo,monospace" font-size="8">T≈1hr</text>
<text x="540" y="604" text-anchor="middle" fill="#64748b" font-family="ui-monospace,Menlo,monospace" font-size="8.5">← 1 second ───────────────────────────── 1 hour →</text>
<rect x="60" y="630" width="880" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="630" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="650" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="650.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHY THE SEPARATION MATTERS</text>
<text x="74" y="676" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Each clock is ≥5× slower than the one above — fast loops finish many cycles inside slow ones, so they can be treated as stable.</text>
<text x="74" y="702" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">This is the adiabatic assumption: L1 sees L3 as frozen; L3 sees L1 as averaged. The ratios 12:1 and 5:1 are the separations.</text>
<text x="74" y="728" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">If the clocks converged, the loops would entangle and the recursion would become a single indistinguishable buzz.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE SEPARATION</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">WAVE = one loop's activity over a shared 1-hour window; PERIOD MARK = its real cadence on the log axis.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">SEPARATION, NOT SYNCHRONY, is the design: overlapping periods would couple the loops destructively.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">The roster (B-21) listed periods; this map draws them to the same scale so the gaps become visible.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">the system is stable because its clocks are far apart — order-of-magnitude spacing is the real architecture</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>