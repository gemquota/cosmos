<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="glowViolet"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
    <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
    <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
    <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
    <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>

  <!-- Decorative orbit rings -->
  <circle cx="800" cy="560" r="420" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,8" opacity=".4"/>
  <circle cx="800" cy="560" r="560" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,12" opacity=".2"/>
  <circle cx="800" cy="560" r="300" fill="none" stroke="#334155" stroke-width=".5" stroke-dasharray="8,16" opacity=".3"/>

  <!-- Title -->
  <text x="800" y="42" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">COMPONENT RELATIONSHIP DIAGRAM</text>
  <text x="800" y="64" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="13">RSIS3 ↔ MyKB ↔ SPACE — actual data flows, HTTP ports, file formats, and orchestration</text>
  <line x1="100" y1="78" x2="1500" y2="78" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== THE THREE COMPONENTS ===== -->

  <!-- RSIS3 (top center) -->
  <rect x="610" y="140" width="380" height="170" rx="16" fill="#131c31" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="610" y="140" width="380" height="40" rx="16" fill="url(#rGrad)" opacity=".22"/>
  <rect x="610" y="168" width="380" height="12" fill="url(#rGrad)" opacity=".2"/>
  <circle cx="642" cy="160" r="14" fill="#818cf8" opacity=".35"/>
  <text x="642" y="165" text-anchor="middle" fill="#e2e8f0" font-size="16">🔄</text>
  <text x="800" y="166" text-anchor="middle" fill="#c7d2fe" font-family="system-ui,sans-serif" font-size="20" font-weight="700">RSIS3</text>
  <text x="800" y="196" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">Core Cognitive Engine • Python</text>
  <text x="800" y="218" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">L1/L2/L3 Recursive Improvement Loops</text>
  <text x="800" y="238" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">MemoryManager • EvaluatorClient • TelemetryCollector</text>
  <text x="800" y="258" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">CheckpointManager • RecoveryManager • ResourceEnforcer</text>
  <text x="800" y="280" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="10">📁 112 files • 67k LOC • port 8080</text>

  <!-- MyKB (bottom left) -->
  <rect x="110" y="720" width="380" height="170" rx="16" fill="#131c31" stroke="#22d3ee" stroke-width="2" filter="url(#shadow)"/>
  <rect x="110" y="720" width="380" height="40" rx="16" fill="url(#mGrad)" opacity=".22"/>
  <rect x="110" y="748" width="380" height="12" fill="url(#mGrad)" opacity=".2"/>
  <circle cx="142" cy="740" r="14" fill="#22d3ee" opacity=".35"/>
  <text x="142" y="745" text-anchor="middle" fill="#e2e8f0" font-size="16">🧠</text>
  <text x="300" y="746" text-anchor="middle" fill="#a5f3fc" font-family="system-ui,sans-serif" font-size="20" font-weight="700">MyKB</text>
  <text x="300" y="776" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">Long-Term Memory • Python + Markdown</text>
  <text x="300" y="798" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">Obsidian Wiki • 2,360+ .md pages</text>
  <text x="300" y="818" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">TF-IDF Search • Temporal Engine • Knowledge Graph</text>
  <text x="300" y="838" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">server.py HTTP API • .wiki-daemon modules</text>
  <text x="300" y="860" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="10">📁 2,436 files • 58MB • port 8765</text>

  <!-- SPACE (bottom right) -->
  <rect x="1110" y="720" width="380" height="170" rx="16" fill="#131c31" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1110" y="720" width="380" height="40" rx="16" fill="url(#sGrad)" opacity=".22"/>
  <rect x="1110" y="748" width="380" height="12" fill="url(#sGrad)" opacity=".2"/>
  <circle cx="1142" cy="740" r="14" fill="#f59e0b" opacity=".35"/>
  <text x="1142" y="745" text-anchor="middle" fill="#e2e8f0" font-size="16">✧</text>
  <text x="1300" y="746" text-anchor="middle" fill="#fde68a" font-family="system-ui,sans-serif" font-size="20" font-weight="700">SPACE</text>
  <text x="1300" y="776" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">RRP Ideation Engine • TypeScript</text>
  <text x="1300" y="798" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">7 LLM Providers • 6 Export Formats</text>
  <text x="1300" y="818" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">326-Probe Framework • 7 Series</text>
  <text x="1300" y="838" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">CLI + Web UI + Meta Viewer</text>
  <text x="1300" y="860" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="10">📁 333 files • 69k LOC • port 8888/8899</text>

  <!-- ===== CONNECTING ARROWS ===== -->

  <!-- RSIS3 ↔ MyKB (left edge, bidirectional) -->
  <!-- RSIS3 → MyKB: writes improvements/telemetry -->
  <path d="M 640 310 C 430 380, 330 540, 300 718" stroke="#22d3ee" stroke-width="3" fill="none" opacity=".85" marker-end="url(#arwM)"/>
  <!-- MyKB → RSIS3: knowledge retrieval -->
  <path d="M 315 718 C 380 560, 470 400, 640 330" stroke="#818cf8" stroke-width="3" fill="none" opacity=".85" marker-end="url(#arwR)"/>

  <!-- RSIS3 ↔ SPACE (right edge) -->
  <!-- RSIS3 → SPACE: improvement needs/goals -->
  <path d="M 960 310 C 1120 380, 1220 540, 1290 718" stroke="#f59e0b" stroke-width="3" fill="none" opacity=".85" marker-end="url(#arwS)"/>
  <!-- SPACE → RSIS3: RRP spec sessions -->
  <path d="M 1270 718 C 1160 560, 1080 400, 960 330" stroke="#818cf8" stroke-width="3" fill="none" opacity=".85" marker-end="url(#arwR)"/>

  <!-- MyKB ↔ SPACE (bottom edge) -->
  <!-- SPACE → MyKB: export specs into wiki -->
  <path d="M 1108 800 C 900 830, 700 830, 492 800" stroke="#22d3ee" stroke-width="3" fill="none" opacity=".85" marker-end="url(#arwM)"/>
  <!-- MyKB → SPACE: framework/knowledge context -->
  <path d="M 492 840 C 700 870, 900 870, 1108 840" stroke="#f59e0b" stroke-width="3" fill="none" opacity=".85" marker-end="url(#arwS)"/>

  <!-- ===== FLOW LABELS ===== -->

  <!-- SPACE → RSIS3 label (top right) -->
  <rect x="1070" y="430" width="240" height="92" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1190" y="452" text-anchor="middle" fill="#c7d2fe" font-family="system-ui,sans-serif" font-size="12" font-weight="700">① SPACE → RSIS3</text>
  <text x="1090" y="472" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">RRP Session Specifications</text>
  <text x="1090" y="490" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9">exports/*.json, *.md, *.yaml</text>
  <text x="1090" y="506" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9">→ improvement goals &amp; constraints</text>

  <!-- RSIS3 → SPACE label (top right inner) -->
  <text x="1190" y="406" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" font-style="italic">▲ needs/goals → ideation</text>

  <!-- RSIS3 → MyKB label (top left) -->
  <rect x="290" y="430" width="240" height="92" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="452" text-anchor="middle" fill="#a5f3fc" font-family="system-ui,sans-serif" font-size="12" font-weight="700">② RSIS3 → MyKB</text>
  <text x="310" y="472" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">Improvements + Telemetry</text>
  <text x="310" y="490" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9">.rsis/knowledge_graph.json</text>
  <text x="310" y="506" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9">.rsis/telemetry/*.jsonl → wiki/daily/</text>

  <!-- MyKB → RSIS3 label (middle left) -->
  <text x="370" y="560" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" font-style="italic">▲ knowledge retrieval → processing</text>

  <!-- MyKB → SPACE label (bottom) -->
  <rect x="660" y="870" width="280" height="76" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="892" text-anchor="middle" fill="#fde68a" font-family="system-ui,sans-serif" font-size="12" font-weight="700">④ MyKB → SPACE</text>
  <text x="800" y="912" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">Wiki content → framework context</text>
  <text x="800" y="930" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9">domain knowledge feeds question routing</text>

  <!-- SPACE → MyKB label (bottom, above) -->
  <rect x="660" y="790" width="280" height="62" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="812" text-anchor="middle" fill="#a5f3fc" font-family="system-ui,sans-serif" font-size="12" font-weight="700">③ SPACE → MyKB</text>
  <text x="800" y="832" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">Specs → wiki pages (markdown)</text>

  <!-- ===== CENTER: Self-Improvement Cycle ===== -->
  <rect x="560" y="390" width="480" height="130" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="560" y="390" width="480" height="34" rx="14" fill="url(#dGrad)" opacity=".15"/>
  <rect x="560" y="412" width="480" height="12" fill="url(#dGrad)" opacity=".1"/>
  <text x="800" y="416" text-anchor="middle" fill="#a7f3d0" font-family="system-ui,sans-serif" font-size="14" font-weight="700">♻ SELF-IMPROVEMENT CYCLE</text>

  <text x="590" y="444" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11" font-weight="600">SPACE ideates</text>
  <text x="720" y="444" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">RRP sessions generate specs</text>
  <text x="720" y="462" fill="#475569" font-family="system-ui,sans-serif" font-size="9">326 probes → structured specification</text>

  <text x="590" y="488" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11" font-weight="600">MyKB stores</text>
  <text x="720" y="488" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">knowledge persists across sessions</text>
  <text x="720" y="506" fill="#475569" font-family="system-ui,sans-serif" font-size="9">searchable via TF-IDF + temporal history</text>

  <text x="590" y="532" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11" font-weight="600">RSIS3 executes</text>
  <text x="720" y="532" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">L1 action → L2 improvement → L3 evolution</text>
  <text x="720" y="548" fill="#475569" font-family="system-ui,sans-serif" font-size="9">validated by IMMUTABLE evaluator</text>

  <!-- ===== BOTTOM: Orchestration + Shared FS ===== -->

  <!-- Shared filesystem -->
  <rect x="110" y="960" width="620" height="150" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="110" y="960" width="620" height="30" rx="12" fill="#1e293b"/>
  <text x="420" y="981" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13" font-weight="600">📁 Shared File System — /dev/cosmos/components/</text>

  <text x="140" y="1010" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">rsis3/ → .rsis/ (knowledge_graph.json, telemetry/, vectors/)</text>
  <text x="140" y="1030" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">mykb/ → wiki/ (2,360+ pages), .wiki-daemon/ (search_index.json, graph.json)</text>
  <text x="140" y="1050" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">space/ → exports/ (specifications.json/.md/.yaml/.html), prompt-framework/</text>
  <text x="140" y="1070" fill="#475569" font-family="system-ui,sans-serif" font-size="9">All three components read/write here — the persistent integration point</text>
  <text x="140" y="1090" fill="#475569" font-family="system-ui,sans-serif" font-size="9">2,881 files • ~70MB total • git-tracked for temporal recovery</text>

  <!-- Orchestrator -->
  <rect x="760" y="960" width="740" height="150" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="760" y="960" width="740" height="30" rx="12" fill="#10b981" opacity=".12"/>
  <text x="1130" y="981" text-anchor="middle" fill="#a7f3d0" font-family="system-ui,sans-serif" font-size="13" font-weight="600">🎛 ORCHESTRATION — cosmos CLI + Dashboard</text>

  <text x="790" y="1010" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">cosmos start all → launches all servers</text>
  <text x="790" y="1030" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">cosmos status → polls HTTP health of each port</text>
  <text x="790" y="1050" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">Dashboard (port 9000) → iframe embeds: RSIS3 dash, MyKB wiki, SPACE web UI</text>
  <text x="790" y="1070" fill="#475569" font-family="system-ui,sans-serif" font-size="9">Sentry Heartbeat monitors ports 9000, 8888, 8899 and auto-restarts on failure</text>
  <text x="790" y="1090" fill="#475569" font-family="system-ui,sans-serif" font-size="9">Logs centralized at sentry.log with component-prefixed entries</text>

  <!-- Orchestration arrows up to components -->
  <path d="M 1050 958 C 1050 900, 960 760, 870 720" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" opacity=".5" marker-end="url(#arwD)"/>
  <path d="M 1150 958 C 1150 880, 1250 800, 1310 722" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" opacity=".5" marker-end="url(#arwD)"/>
  <path d="M 850 958 C 850 900, 700 800, 520 720" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" opacity=".5" marker-end="url(#arwD)"/>

  <!-- Legend -->
  <rect x="480" y="1140" width="640" height="40" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="510" y="1166" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">Legend:</text>
  <line x1="565" y1="1160" x2="595" y2="1160" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arwR)"/>
  <text x="603" y="1165" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">RSIS3 flow</text>
  <line x1="680" y1="1160" x2="710" y2="1160" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#arwM)"/>
  <text x="718" y="1165" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">MyKB flow</text>
  <line x1="795" y1="1160" x2="825" y2="1160" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arwS)"/>
  <text x="833" y="1165" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">SPACE flow</text>
  <line x1="910" y1="1160" x2="940" y2="1160" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arwD)"/>
  <text x="948" y="1165" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">Orchestration</text>

  <text x="800" y="1195" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="10">Generated from source analysis of components/rsis3/, components/mykb/, components/space/</text>
</svg>
