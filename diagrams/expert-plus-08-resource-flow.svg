<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE RESOURCE FLOW — TOKENS, TIME, DISK, CPU</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Four currencies the ecosystem spends — where they enter, where they pool, where they sink</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="60" y="128" width="880" height="92" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="128" width="880" height="30" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="60" y="146" width="880" height="12" fill="#f59e0b" opacity=".12"/>
<text x="500.0" y="147.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">TOKENS</text>
<text x="74" y="172" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">SOURCE —  7 LLM providers     →     SINK —  SPACE ideation</text>
<text x="74" y="193" fill="#475569" font-family="system-ui,sans-serif" font-size="9">the only paid currency</text>
<rect x="330" y="190" width="300" height="10" rx="5" fill="#f59e0b" opacity=".85"/>
<text x="640" y="199" text-anchor="start" fill="#475569" font-family="system-ui,sans-serif" font-size="7.5">relative weight</text>
<rect x="60" y="248" width="880" height="92" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="248" width="880" height="30" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="60" y="266" width="880" height="12" fill="#818cf8" opacity=".12"/>
<text x="500.0" y="267.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">TIME</text>
<text x="74" y="292" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">SOURCE —  loops + budgets     →     SINK —  L1 steps · eval 60s</text>
<text x="74" y="313" fill="#475569" font-family="system-ui,sans-serif" font-size="9">wall-clock, capped per stage</text>
<rect x="330" y="310" width="230" height="10" rx="5" fill="#818cf8" opacity=".85"/>
<text x="570" y="319" text-anchor="start" fill="#475569" font-family="system-ui,sans-serif" font-size="7.5">relative weight</text>
<rect x="60" y="368" width="880" height="92" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="368" width="880" height="30" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="60" y="386" width="880" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="387.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">DISK</text>
<text x="74" y="412" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">SOURCE —  wiki + JSONL + index     →     SINK —  58MB corpus · 2,436 files</text>
<text x="74" y="433" fill="#475569" font-family="system-ui,sans-serif" font-size="9">git-tracked, snapshot-safe</text>
<rect x="330" y="430" width="190" height="10" rx="5" fill="#22d3ee" opacity=".85"/>
<text x="530" y="439" text-anchor="start" fill="#475569" font-family="system-ui,sans-serif" font-size="7.5">relative weight</text>
<rect x="60" y="488" width="880" height="92" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="488" width="880" height="30" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="506" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="507.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">CPU</text>
<text x="74" y="532" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">SOURCE —  evaluator spawn     →     SINK —  60s subprocess · read-only</text>
<text x="74" y="553" fill="#475569" font-family="system-ui,sans-serif" font-size="9">isolated, never shared</text>
<rect x="330" y="550" width="150" height="10" rx="5" fill="#f472b6" opacity=".85"/>
<text x="490" y="559" text-anchor="start" fill="#475569" font-family="system-ui,sans-serif" font-size="7.5">relative weight</text>
<rect x="60" y="608" width="880" height="130" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="608" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="628" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="628.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHERE THE CURRENCIES MEET</text>
<text x="74" y="654" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">TOKENS buy answers; answers cost TIME to evaluate; TIME is spent to write DISK; DISK is verified by CPU at every spawn.</text>
<text x="74" y="680" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The budget caps (E-22) are the exchange rates: 60s of CPU per verdict, 120s per L1 step, ~58MB of wiki.</text>
<text x="74" y="706" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">Pulses are nearly free (JSONL append); consolidation is the expensive buy — which is why it is batched.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE FLOW</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">BAR WIDTH = relative consumption — tokens flow widest, CPU is the narrowest and most guarded.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">EVERY CURRENCY HAS A SINK: no resource flows in a circle without being spent — budgets are conservation laws (E-24).</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">The four bands are the ecosystem's economy — the dashboard is the one place all four are visible at once.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">the system's economy: pay tokens to think, spend time to judge, invest disk to remember, guard CPU to trust</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>