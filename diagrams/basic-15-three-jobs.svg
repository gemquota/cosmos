<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE THREE JOBS — ONE PER LOOP</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">L1 acts, L2 improves, L3 evolves — nested scope, three timescales, three budgets</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="60" y="120" width="880" height="240" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="120" width="880" height="34" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="60" y="142" width="880" height="12" fill="#818cf8" opacity=".12"/>
<text x="500.0" y="141.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L1 · THE DOER — per-task action loop</text>
<text x="76" y="170" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">CLOCK: seconds · ~1s</text>
<text x="76" y="193" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  tool calls, observations, retries</text>
<text x="76" y="216" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  max 10 tool calls/step · 120s timeout · 3 retries</text>
<text x="76" y="239" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  checkpoint before every mutation</text>
<text x="76" y="262" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  telemetry: pulse every iteration</text>
<rect x="60" y="400" width="880" height="240" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="400" width="880" height="34" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="60" y="422" width="880" height="12" fill="#f59e0b" opacity=".12"/>
<text x="500.0" y="421.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L2 · THE IMPROVER — per-session RRP rounds</text>
<text x="76" y="450" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">CLOCK: ~12s per round</text>
<text x="76" y="473" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  code gen · prompt &amp; tool tuning</text>
<text x="76" y="496" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  IMMUTABLE evaluator gates each candidate</text>
<text x="76" y="519" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  25 rounds per spec · ≤5 eval candidates/session</text>
<text x="76" y="542" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  telemetry: candidate + verdict</text>
<rect x="60" y="680" width="880" height="240" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="680" width="880" height="34" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="60" y="702" width="880" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="701.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">L3 · THE EVOLVER — cross-session consolidation</text>
<text x="76" y="730" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">CLOCK: ~60s per cycle</text>
<text x="76" y="753" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  git → knowledge graph → vector embeddings</text>
<text x="76" y="776" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  strategy &amp; meta-parameter evolution</text>
<text x="76" y="799" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  redundancy refinement + pruning</text>
<text x="76" y="822" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  telemetry: consolidation report</text>
<line x1="36" y1="170" x2="36" y2="890" stroke="#334155" stroke-width="2" marker-start="url(#arwG)" marker-end="url(#arwG)"/>
<text x="26" y="530" text-anchor="middle" fill="#64748b" font-family="ui-monospace,Menlo,monospace" font-size="9" font-weight="700" transform="rotate(-90 26 530)">NESTED SCOPE — L3 ⊃ L2 ⊃ L1</text>
<circle cx="36" cy="185" r="7" fill="#818cf8" stroke="#0b1120" stroke-width="1.6"/>
<circle cx="36" cy="465" r="7" fill="#f59e0b" stroke="#0b1120" stroke-width="1.6"/>
<circle cx="36" cy="745" r="7" fill="#22d3ee" stroke="#0b1120" stroke-width="1.6"/>
<rect x="60" y="968" width="880" height="92" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="968" width="880" height="30" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="986" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="987.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE RATIOS THE CLOCKS IMPLY</text>
<text x="74" y="1012" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">12 pulses per RRP round (12:1) · 25 rounds per spec (25:1) · every round, every pulse, every cycle is logged</text>
<rect x="60" y="1154" width="880" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1154" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1170" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1172.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE JOBS</text>
<text x="72" y="1194" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">ONE JOB PER LOOP: L1 never improves, L2 never consolidates, L3 never acts — separation is what makes the recursion safe.</text>
<text x="72" y="1211" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">COLOUR = the clock: indigo the action loop, amber the improvement rounds, cyan the consolidation cycle.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">NESTING RAIL = scope containment: every L2 round contains ~12 L1 pulses; every L3 cycle contains ~5 RRP rounds.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">BUDGETS are the hard walls: 10 calls/step, 120s, 3 retries · 25 rounds/spec, 5 evals · 20 sessions/plateau.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">three jobs, three clocks, three budgets — the whole engine is these three panels firing in phase</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>