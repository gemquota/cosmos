<text x="300.0" y="141.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">cosmos CLI</text>
<text x="124" y="168" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">cosmos start all   — all servers</text>
<text x="124" y="190" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">cosmos status      — health polls</text>
<text x="124" y="212" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">cosmos stop        — kill all</text>
<text x="124" y="234" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">cosmos list        — file counts</text>
<text x="124" y="256" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">cosmos logs        — sentry.log</text>
<text x="124" y="278" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">cosmos build       — TS builds</text>
<text x="124" y="300" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">cosmos test        — component tests</text>
<text x="124" y="322" fill="#475569" font-family="system-ui,sans-serif" font-size="9">symlinked to ~/.local/bin/cosmos</text>
<rect x="540" y="120" width="380" height="260" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
