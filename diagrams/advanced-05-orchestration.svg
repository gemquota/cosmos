<text x="1130.0" y="141.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Sentry Heartbeat</text>
<text x="984" y="168" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">watches.json definitions</text>
<text x="984" y="190" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">polls ports 9000, 8888, 8899</text>
<text x="984" y="212" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">auto-restart on failure</text>
<text x="984" y="234" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">centralized sentry.log</text>
<text x="984" y="256" fill="#475569" font-family="system-ui,sans-serif" font-size="9">infra/heartbeat/heartbeat.mjs</text>
<text x="984" y="278" fill="#475569" font-family="system-ui,sans-serif" font-size="9">component-prefixed log lines</text>
