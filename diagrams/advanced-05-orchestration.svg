<text x="124" y="478" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">/components/rsis3/dashboard/        → RSIS3 telemetry (Chart.js + Tailwind)</text>
<text x="124" y="502" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">http://localhost:8765/              → MyKB wiki (own server)</text>
<text x="124" y="526" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">/components/space/web/              → SPACE web UI (React)</text>
<text x="124" y="550" fill="#475569" font-family="system-ui,sans-serif" font-size="9">Each component keeps its own UI — the dashboard aggregates, never duplicates</text>
