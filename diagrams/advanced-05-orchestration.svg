<text x="554" y="168" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">6 component cards + status</text>
<text x="554" y="190" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">global health badge</text>
<text x="554" y="212" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">meta document viewer</text>
<text x="554" y="234" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">quick links to servers</text>
<text x="554" y="256" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10">donut + stacked bar charts</text>
<text x="554" y="278" fill="#475569" font-family="system-ui,sans-serif" font-size="9">33KB self-contained SPA (index.html)</text>
<text x="554" y="300" fill="#475569" font-family="system-ui,sans-serif" font-size="9">served by start.sh → python http.server</text>
