<rect width="1600" height="1060" fill="url(#bgGrad)"/>
<text x="800.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE META-LADDER</text>
<text x="800.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Loops about loops — each level reasons about the level below it</text>
<line x1="96.0" y1="76" x2="1504.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<text x="800" y="96" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5" font-style="italic">recursive self-improvement is a ladder: L1 acts · L2 improves the actor · L3 evolves evolution · the observer watches</text>
<line x1="210" y1="200" x2="210" y2="780" stroke="#475569" stroke-width="2" opacity=".7" marker-end="url(#arwG)"/>
<text x="195" y="490" transform="rotate(-90 195 490)" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="10" letter-spacing="1.5">DEEPER ABSTRACTION</text>
<line x1="1390" y1="200" x2="1390" y2="780" stroke="#475569" stroke-width="2" opacity=".7" marker-end="url(#arwG)"/>
<text x="1405" y="490" transform="rotate(-90 1405 490)" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="10" letter-spacing="1.5">LONGER TIMESCALE</text>
<rect x="250" y="190" width="1100" height="120" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="250" y="190" width="8" height="120" rx="4" fill="#818cf8" opacity=".85"/>
<rect x="280" y="212" width="120" height="76" rx="8" fill="#818cf8" opacity=".15" stroke="#818cf8" stroke-width="1" stroke-opacity=".45"/>
<text x="340" y="242" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="24" font-weight="700">L0</text>
<text x="340" y="266" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5">action loop</text>
<text x="450" y="230" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12" font-weight="700">ACTION LOOP (L1) — operates on tasks in the world</text>
<text x="450" y="258" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">tool calls · observations · retries</text>
<text x="450" y="282" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">closes the loop in seconds</text>
<rect x="1130" y="220" width="64" height="20" rx="10.0" fill="#818cf8" opacity=".13"/><text x="1162" y="233.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="10" font-weight="600">⏱ seconds</text>
<rect x="1130" y="252" width="122" height="20" rx="10.0" fill="#818cf8" opacity=".13"/><text x="1191" y="265.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="10" font-weight="600">out: task + raw log</text>
<rect x="250" y="350" width="1100" height="120" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="250" y="350" width="8" height="120" rx="4" fill="#22d3ee" opacity=".85"/>
<rect x="280" y="372" width="120" height="76" rx="8" fill="#22d3ee" opacity=".15" stroke="#22d3ee" stroke-width="1" stroke-opacity=".45"/>
<text x="340" y="402" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="24" font-weight="700">L1</text>
<text x="340" y="426" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5">improvement loop</text>
<text x="450" y="390" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12" font-weight="700">IMPROVEMENT LOOP (L2) — operates on the actor (L1)</text>
<text x="450" y="418" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">code generation · prompt tuning</text>
<text x="450" y="442" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">rewrites the agent that acts</text>
<rect x="1130" y="380" width="64" height="20" rx="10.0" fill="#22d3ee" opacity=".13"/><text x="1162" y="393.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="10" font-weight="600">⏱ minutes</text>
<rect x="1130" y="412" width="169" height="20" rx="10.0" fill="#22d3ee" opacity=".13"/><text x="1214" y="425.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="10" font-weight="600">out: better agent + prompts</text>
<line x1="800" y1="310" x2="800" y2="350" stroke="#475569" stroke-width="2.2" opacity="0.7" marker-end="url(#arwG)"/>
<rect x="250" y="510" width="1100" height="120" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="250" y="510" width="8" height="120" rx="4" fill="#f59e0b" opacity=".85"/>
<rect x="280" y="532" width="120" height="76" rx="8" fill="#f59e0b" opacity=".15" stroke="#f59e0b" stroke-width="1" stroke-opacity=".45"/>
<text x="340" y="562" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="24" font-weight="700">L2</text>
<text x="340" y="586" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5">evolution loop</text>
<text x="450" y="550" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12" font-weight="700">EVOLUTION LOOP (L3) — operates on improvement itself</text>
<text x="450" y="578" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">memory consolidation · strategy evolution</text>
<text x="450" y="602" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">selects which improvements survive</text>
<rect x="1130" y="540" width="82" height="20" rx="10.0" fill="#f59e0b" opacity=".13"/><text x="1171" y="553.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="10" font-weight="600">⏱ hours–days</text>
<rect x="1130" y="572" width="134" height="20" rx="10.0" fill="#f59e0b" opacity=".13"/><text x="1197" y="585.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="10" font-weight="600">out: evolved strategy</text>
<line x1="800" y1="470" x2="800" y2="510" stroke="#475569" stroke-width="2.2" opacity="0.7" marker-end="url(#arwG)"/>
<rect x="250" y="670" width="1100" height="120" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="250" y="670" width="8" height="120" rx="4" fill="#f472b6" opacity=".85"/>
<rect x="280" y="692" width="120" height="76" rx="8" fill="#f472b6" opacity=".15" stroke="#f472b6" stroke-width="1" stroke-opacity=".45"/>
<text x="340" y="722" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="24" font-weight="700">L3</text>
<text x="340" y="746" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5">the observer</text>
<text x="450" y="710" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12" font-weight="700">THE OBSERVER — SPACE probes + immutable evaluator</text>
<text x="450" y="738" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">326 probes audit hidden assumptions</text>
<text x="450" y="762" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">SHA-256 + PASS/FAIL gate on all changes</text>
<rect x="1130" y="700" width="82" height="20" rx="10.0" fill="#f472b6" opacity=".13"/><text x="1171" y="713.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10" font-weight="600">⏱ continuous</text>
<rect x="1130" y="732" width="169" height="20" rx="10.0" fill="#f472b6" opacity=".13"/><text x="1214" y="745.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10" font-weight="600">out: trust, not blind faith</text>
<line x1="800" y1="630" x2="800" y2="670" stroke="#475569" stroke-width="2.2" opacity="0.7" marker-end="url(#arwG)"/>
<path d="M 1460 750 C 1490 600, 1490 400, 1460 250" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="7,5" opacity=".8" marker-end="url(#arwH)"/>
<text x="1475" y="500" transform="rotate(90 1475 500)" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">observer findings feed the next action cycle</text>
<rect x="100" y="830" width="1400" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="100" y="830" width="1400" height="30" rx="10" fill="#10b981" opacity=".16"/>
<rect x="100" y="848" width="1400" height="12" fill="#10b981" opacity=".12"/>
<text x="800.0" y="849.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">CLIMBING THE LADDER</text>
<text x="116" y="876" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Recursive self-improvement is a ladder: L1 executes, L2 improves the executor, L3 evolves the improvement strategy.</text>
<text x="116" y="900" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The observer sits outside the loops so nothing is changed blindly — every rung refactors the one below.</text>
<text x="800.0" y="930" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Generated from source analysis</text>
</svg>