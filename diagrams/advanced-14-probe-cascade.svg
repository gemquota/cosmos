<text x="500.0" y="1172.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE CASCADE</text>
<text x="72" y="1194" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">BAR = probe volume per series per session (pale = minimum, amber = maximum) — Technical Specs opens the widest funnel (4→20).</text>
<text x="72" y="1211" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">COLOUR = SPACE amber for the input cascade, DASH green for the spec product, pink for the ratio callout.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">READ DOWNWARD as time: seven parallel streams converge once per round, and 25 rounds converge into one spec.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">Series order follows the dependency chain S1 → S7 from the probe constellation (A-11).</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">the framework is a funnel: 326 questions in, one spec out — the ecosystem's ideation surface</text>
