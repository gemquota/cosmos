<text x="500.0" y="827.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">25 ROUNDS OF PROBE-ANSWER-REFLECT</text>
<text x="184" y="852" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Each round dispatches one probe per active series · answers are kept, ranked, and re-asked when contradictory</text>
<text x="184" y="876" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The cursor sweeps the constellation in dispatch order (A-11) — the cascade is that sweep, unrolled</text>
