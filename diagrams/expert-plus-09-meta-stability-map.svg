<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE META-STABILITY MAP — EVERY LOOP'S STABILITY REGIME</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Period × damping phase plane — where each loop sits, and what moves it</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<line x1="120" y1="760" x2="880" y2="760" stroke="#334155" stroke-width="1.6" marker-end="url(#arwG)"/>
<text x="500" y="790" text-anchor="middle" fill="#64748b" font-family="ui-monospace,Menlo,monospace" font-size="10">PERIOD — FAST ←———→ SLOW</text>
<line x1="120" y1="170" x2="120" y2="750" stroke="#334155" stroke-width="1.6" marker-end="url(#arwG)"/>
<text x="96" y="460" text-anchor="middle" fill="#64748b" font-family="ui-monospace,Menlo,monospace" font-size="9.5" font-weight="700" transform="rotate(-90 96 460)">DAMPING — OSCILLATORY ↑ · DAMPED ↓</text>
<path d="M 140 720 L 300 720 L 260 500 L 150 500 Z" fill="#10b981" opacity=".08"/>
<path d="M 330 470 L 600 470 L 560 260 L 340 260 Z" fill="#f59e0b" opacity=".08"/>
<path d="M 620 240 L 860 240 L 840 140 L 640 140 Z" fill="#22d3ee" opacity=".08"/>
<text x="210" y="640" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">STABLE · damped</text>
<text x="460" y="380" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="9">LIMIT-CYCLE · oscillatory</text>
<text x="750" y="200" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="9">SLOW · quasi-static</text>
<circle cx="200" cy="620" r="16" fill="#818cf8" stroke="#0b1120" stroke-width="2"/>
<text x="200" y="654" text-anchor="middle" fill="#818cf8" font-family="ui-monospace,Menlo,monospace" font-size="8">L1 · 1s</text>
<circle cx="230" cy="560" r="16" fill="#10b981" stroke="#0b1120" stroke-width="2"/>
<text x="230" y="594" text-anchor="middle" fill="#10b981" font-family="ui-monospace,Menlo,monospace" font-size="8">TELEMETRY · 1s</text>
<circle cx="460" cy="350" r="16" fill="#f59e0b" stroke="#0b1120" stroke-width="2"/>
<text x="460" y="384" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace,Menlo,monospace" font-size="8">RRP · 12s</text>
<circle cx="300" cy="260" r="16" fill="#f472b6" stroke="#0b1120" stroke-width="2"/>
<text x="300" y="294" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="8">EVALUATOR · burst</text>
<circle cx="520" cy="520" r="16" fill="#22d3ee" stroke="#0b1120" stroke-width="2"/>
<text x="520" y="554" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="8">RETRIEVAL · on-demand</text>
<circle cx="760" cy="190" r="16" fill="#22d3ee" stroke="#0b1120" stroke-width="2"/>
<text x="760" y="224" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="8">L3 · 60s</text>
<rect x="60" y="830" width="880" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="830" width="880" height="30" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="848" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="849.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE REGIME READING</text>
<text x="74" y="874" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Fast loops sit in the damped zone (stable); the RRP lives in the limit-cycle zone (its 12s period IS the oscillation); L3 is quasi-static.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE MAP</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">ZONES = dynamic regimes on the period × damping plane; NODES = the real loops from the roster (B-21).</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE EVALUATOR IS THE ODD NODE: short period, high damping — a burst, not a clock; it is the brake from X+-06.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">STABILITY IS NOT UNIFORM: the system is stable because fast parts damp and slow parts barely move (X+-04).</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">each loop has a personality — damped, cycling, or glacial — and the mix is what keeps the recursion sane</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>