<text x="134" y="413" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  lessons persist · retrieval :8765</text>
<text x="134" y="434" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  wiki + KG + temporal snapshots</text>
<text x="134" y="455" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  fixed point becomes a cycle: act → remember</text>
<text x="810" y="376" text-anchor="start" fill="#475569" font-family="ui-monospace,Menlo,monospace" font-size="8.5">bifurcation</text>
<text x="810" y="394" text-anchor="start" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="8.5">↑ added by λ</text>
