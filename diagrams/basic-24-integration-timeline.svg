<text x="134" y="197" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  L1/L2/L3 fire with no external memory</text>
<text x="134" y="218" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  port :8080 static · telemetry local</text>
<text x="134" y="239" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  one fixed point: the loop runs in place</text>
