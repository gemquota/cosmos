<text x="500.0" y="1020.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">LINK TO THE BIFURCATION PORTRAIT (A-13)</text>
<text x="74" y="1046" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Each λ above is one control-parameter step in the A-13 portrait — λ₄ is the deployed system's position on that diagram.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE TIMELINE</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">STAGE COLOUR = the subsystem that joined at that λ: engine indigo, memory cyan, ideation amber, full ecosystem green.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">READ DOWNWARD as history: each stage is a strict superset — λ₄ contains all code from λ₁, plus the new integration layer.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE BIFURCATION LABELS are the A-13 regimes — every λ is visible there as a change in the phase portrait's topology.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">the doubling pass ends where the system began — the λ ladder is the answer to 'how did this get here?'</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
