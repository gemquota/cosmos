<text x="134" y="608" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="10.5">JOINS — RSIS3 + MyKB + SPACE</text>
<text x="134" y="629" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  RRP feeds specs to L2 · 326 probes</text>
<text x="134" y="650" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  evaluator gate between ideation and execution</text>
<text x="134" y="671" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">•  three basins + separatrix: the contested field</text>
<text x="810" y="592" text-anchor="start" fill="#475569" font-family="ui-monospace,Menlo,monospace" font-size="8.5">bifurcation</text>
<text x="810" y="610" text-anchor="start" fill="#f59e0b" font-family="ui-monospace,Menlo,monospace" font-size="8.5">↑ added by λ</text>
