<text x="500.0" y="620.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHAT THIS IS NOT</text>
<text x="74" y="646" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">This is artifact ancestry (what derives from what in the current codebase), not a claim about commit history.</text>
<text x="74" y="672" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The B-24 timeline is the deployment story; this tree is the derivation story — they are different questions.</text>
<text x="74" y="698" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5">Honest limit: exact parentage of early commits is not reconstructed here — the tree shows structural descent.</text>
<rect x="60" y="750" width="880" height="80" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="750" width="880" height="32" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="60" y="770" width="880" height="12" fill="#22d3ee" opacity=".12"/>
<text x="500.0" y="770.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE MERGE POINT</text>
<text x="74" y="796" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">All three lines converge in the dashboard — the ecosystem's single integration node (B-18).</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE TREE</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">NODES = artifact families; ARROWS = derived from; the tree reads top-down from the RRP origin.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">COLOUR = the component that owns the family today — descent and ownership are independent.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE THREE MERGED DESCENDANTS are today's runtimes: dashboard, engine consumers, retrieval service.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">every artifact has an ancestor — the phylogeny is the family tree of the ecosystem's ideas</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
