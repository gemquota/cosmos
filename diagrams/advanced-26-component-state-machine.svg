<rect x="60" y="874" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="874.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHAT THE MACHINES SHARE</text>
<text x="74" y="900" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Every transition is triggered by an artifact crossing an interface — the state machines are the interfaces, animated.</text>
<text x="74" y="924" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">RSIS3 is the only machine with four states; MyKB and SPACE are three-state loops — depth lives in the engine.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE MACHINES</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">STATE COLOUR = owning component; TRANSITION COLOUR = the component that triggers the move.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">READ A MACHINE AS A LOOP: every component returns to a resting state — IDLE / SERVING / COMPOSING.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE TRIGGER LABELS are real events — task arrives, plateau reached, capture hook fires, space init.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">if you know the trigger, you know the state — the machines are the system's choreography</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>