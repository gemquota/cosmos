<defs><radialGradient id="spS" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f59e0b" stop-opacity=".55"/><stop offset="100%" stop-color="#f59e0b" stop-opacity=".05"/></radialGradient><radialGradient id="spR" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#818cf8" stop-opacity=".55"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".05"/></radialGradient><radialGradient id="spM" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22d3ee" stop-opacity=".55"/><stop offset="100%" stop-color="#22d3ee" stop-opacity=".05"/></radialGradient></defs>
