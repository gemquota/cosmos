<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320">
<defs>
  <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0b1120"/>
  </radialGradient>
  <linearGradient id="rGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="mGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
  <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
  <marker id="arwR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#818cf8"/></marker>
  <marker id="arwM" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#22d3ee"/></marker>
  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE SELF-REFERENCE MAP — THE SYSTEM IMPROVING ITSELF</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Four levels of recursion, and the one edge that is deliberately forbidden</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<rect x="140" y="128" width="620" height="96" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="140" y="128" width="620" height="30" rx="10" fill="#f59e0b" opacity=".16"/>
<rect x="140" y="146" width="620" height="12" fill="#f59e0b" opacity=".12"/>
<text x="450.0" y="147.5" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="13" font-weight="700">LEVEL 0 · OBJECTS</text>
<text x="152" y="170" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="10">code + artifacts</text>
<text x="152" y="191" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">the plain things — files, pages, probes, specs</text>
<path d="M 760 176 C 880 176, 880 298, 770 298" fill="none" stroke="#f59e0b" stroke-width="1.8" opacity=".75" marker-end="url(#arwG)"/>
<text x="905" y="228" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace,Menlo,monospace" font-size="8.5">self</text>
<rect x="140" y="338" width="620" height="96" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="140" y="338" width="620" height="30" rx="10" fill="#818cf8" opacity=".16"/>
<rect x="140" y="356" width="620" height="12" fill="#818cf8" opacity=".12"/>
<text x="450.0" y="357.5" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="13" font-weight="700">LEVEL 1 · THE ENGINE</text>
<text x="152" y="380" fill="#818cf8" font-family="system-ui,sans-serif" font-size="10">RSIS3 improving RSIS3</text>
<text x="152" y="401" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">L2 drafts diffs to its own code — evaluator-gated</text>
<path d="M 760 386 C 880 386, 880 508, 770 508" fill="none" stroke="#818cf8" stroke-width="1.8" opacity=".75" marker-end="url(#arwG)"/>
<text x="905" y="438" text-anchor="middle" fill="#818cf8" font-family="ui-monospace,Menlo,monospace" font-size="8.5">self</text>
<rect x="140" y="548" width="620" height="96" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="140" y="548" width="620" height="30" rx="10" fill="#22d3ee" opacity=".16"/>
<rect x="140" y="566" width="620" height="12" fill="#22d3ee" opacity=".12"/>
<text x="450.0" y="567.5" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700">LEVEL 2 · THE META-LOOP</text>
<text x="152" y="590" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="10">improving the improvement</text>
<text x="152" y="611" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">L3 evolves strategies, budgets, and L2 heuristics</text>
<path d="M 760 596 C 880 596, 880 718, 770 718" fill="none" stroke="#22d3ee" stroke-width="1.8" opacity=".75" marker-end="url(#arwG)"/>
<text x="905" y="648" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace,Menlo,monospace" font-size="8.5">self</text>
<rect x="140" y="758" width="620" height="96" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="140" y="758" width="620" height="30" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="140" y="776" width="620" height="12" fill="#f472b6" opacity=".12"/>
<text x="450.0" y="777.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">LEVEL 3 · THE SPEC OF THE SPEC</text>
<text x="152" y="800" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10">RRP specifying RRP</text>
<text x="152" y="821" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">SPACE generates the prompt framework that generates specs</text>
<path d="M 760 806 C 880 806, 880 928, 770 928" fill="none" stroke="#f472b6" stroke-width="1.8" opacity=".75" marker-end="url(#arwG)"/>
<text x="905" y="858" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,Menlo,monospace" font-size="8.5">self</text>
<rect x="60" y="928" width="880" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="928" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="948" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="948.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">THE FORBIDDEN EDGE</text>
<text x="74" y="974" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">NO SELF-EDGE ON THE EVALUATOR: level 1 may change anything except the code that judges it.</text>
<text x="74" y="1000" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">That single prohibition is what keeps the recursion well-founded — everything else can chase its own tail.</text>
<rect x="60" y="1064" width="880" height="96" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1064" width="880" height="32" rx="10" fill="#10b981" opacity=".16"/>
<rect x="60" y="1084" width="880" height="12" fill="#10b981" opacity=".12"/>
<text x="500.0" y="1084.5" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHY FOUR LEVELS AND NOT MORE</text>
<text x="74" y="1110" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Level 3 is the ceiling: specifying the specifier is as meta as the system goes — there is no level-4 component.</text>
<text x="74" y="1134" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">The meta-ladder (E-06) shows the same stack as rungs; this map adds the self-edges and the forbidden one.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE MAP</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">SELF-EDGES = recursion: each level operates on the level below it; the arrow looping back is the self-reference.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">COLOUR = the component that owns that level of recursion — ideation, engine, memory, external boundary.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">THE FORBIDDEN EDGE is the design's whole safety story: recursion is allowed exactly until it reaches the judge.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">self-reference is the feature and the risk — the evaluator boundary is where the risk is capped</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>