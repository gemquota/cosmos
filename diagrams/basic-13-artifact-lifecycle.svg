<text x="500.0" y="1155.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE LIFECYCLE</text>
<text x="72" y="1177" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">COMET = one artifact circulating the lifecycle — one lap is one idea matured end-to-end; motion encodes the pipeline.</text>
<text x="72" y="1194" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">RING SEGMENTS = the five states, clockwise: IDEA (SPACE) → CANDIDATE (RSIS3) → PULSE (telemetry) → LESSON → KG EDGE (MyKB).</text>
<text x="72" y="1211" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">DIAMOND = the evaluator gate between candidate and pulse: SHA-256-verified, 60s subprocess, ≤5 candidates per session.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">DASHED INNER ARC = the return path — retrieval (:8765) pulls consolidated memory back into the next idea.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">STATE COLOURS follow the component palette: amber ideation · indigo execution · green telemetry · cyan memory.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">the system's throughput is simply this ring's rotation rate — ideas that survive the gate become retrievable memory</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
