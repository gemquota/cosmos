<text x="110" y="600" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">PERIOD = CADENCE — the ring's expansion time IS the loop's real firing interval (1s / 12s / 60s, time-compressed).</text>
<text x="110" y="619" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">L1 rings every ~1–2s of real runtime · RRP every ~1 min · L3 every ~1 hr — deeper loops fire slower.</text>
<text x="110" y="638" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">SHUTTLE = the event that pulse emits: L1 writes a rack pulse, RRP writes an artifact, L3 writes consolidated memory.</text>
<text x="110" y="657" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">Nothing else moves. If a ring were decorative, this diagram would be a screensaver — it isn't.</text>
<text x="96" y="724" fill="#64748b" font-family="system-ui,sans-serif" font-size="10" font-weight="700">CADENCE REGISTER — REAL TIMINGS, NOT DECORATION</text>
