<rect width="1600" height="1060" fill="url(#bgGrad)"/>
<text x="800.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">VARIATION &amp; SELECTION</text>
<text x="800.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">The evolutionary engine — generate many, test hard, keep winners, inherit them</text>
<line x1="96.0" y1="76" x2="1504.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<text x="800" y="96" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5" font-style="italic">good ideas are not designed — they are generated, tested, and kept</text>
<rect x="150" y="190" width="560" height="220" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
<rect x="150" y="190" width="560" height="44" rx="14" fill="#f59e0b" opacity=".18"/>
<rect x="150" y="222" width="560" height="12" fill="#f59e0b" opacity=".14"/>
<circle cx="180" cy="212.0" r="13" fill="#f59e0b" opacity=".32"/>
<text x="180" y="217.0" text-anchor="middle" fill="#e2e8f0" font-size="13">①</text>
<text x="444.0" y="217.0" text-anchor="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="15" font-weight="700">VARIATION</text>
<text x="430.0" y="254" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11.5">generate many — SPACE</text>
<text x="200" y="288" text-anchor="start" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">326 probes · 7 series · 25 rounds</text>
<text x="200" y="314" text-anchor="start" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">diverse candidate specifications</text>
<text x="200" y="340" text-anchor="start" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">7 LLM providers → built-in variety</text>
<text x="200" y="366" text-anchor="start" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="10.5">variety beats cleverness</text>
<rect x="890" y="190" width="560" height="220" rx="14" fill="#0f172a" stroke="#f472b6" stroke-width="2" filter="url(#shadow)"/>
<rect x="890" y="190" width="560" height="44" rx="14" fill="#f472b6" opacity=".18"/>
<rect x="890" y="222" width="560" height="12" fill="#f472b6" opacity=".14"/>
<circle cx="920" cy="212.0" r="13" fill="#f472b6" opacity=".32"/>
<text x="920" y="217.0" text-anchor="middle" fill="#e2e8f0" font-size="13">②</text>
<text x="1184.0" y="217.0" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="15" font-weight="700">SELECTION</text>
<text x="1170.0" y="254" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11.5">test hard — the evaluator</text>
<text x="940" y="288" text-anchor="start" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">SHA-256 integrity check</text>
<text x="940" y="314" text-anchor="start" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">isolated subprocess execution</text>
<text x="940" y="340" text-anchor="start" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">PASS/FAIL gate — no mercy</text>
<text x="940" y="366" text-anchor="start" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">trust nothing unproven</text>
<rect x="890" y="520" width="560" height="220" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
<rect x="890" y="520" width="560" height="44" rx="14" fill="#818cf8" opacity=".18"/>
<rect x="890" y="552" width="560" height="12" fill="#818cf8" opacity=".14"/>
<circle cx="920" cy="542.0" r="13" fill="#818cf8" opacity=".32"/>
<text x="920" y="547.0" text-anchor="middle" fill="#e2e8f0" font-size="13">③</text>
<text x="1184.0" y="547.0" text-anchor="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="15" font-weight="700">INHERITANCE</text>
<text x="1170.0" y="584" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11.5">pass it on — RSIS3</text>
<text x="940" y="618" text-anchor="start" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">winners become the new baseline</text>
<text x="940" y="644" text-anchor="start" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">L3 evolves strategy across sessions</text>
<text x="940" y="670" text-anchor="start" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">every generation starts stronger</text>
<text x="940" y="696" text-anchor="start" fill="#818cf8" font-family="system-ui,sans-serif" font-size="10.5">a compounding baseline</text>
<rect x="150" y="520" width="560" height="220" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="2" filter="url(#shadow)"/>
<rect x="150" y="520" width="560" height="44" rx="14" fill="#22d3ee" opacity=".18"/>
<rect x="150" y="552" width="560" height="12" fill="#22d3ee" opacity=".14"/>
<circle cx="180" cy="542.0" r="13" fill="#22d3ee" opacity=".32"/>
<text x="180" y="547.0" text-anchor="middle" fill="#e2e8f0" font-size="13">④</text>
<text x="444.0" y="547.0" text-anchor="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="15" font-weight="700">RETENTION</text>
<text x="430.0" y="584" text-anchor="middle" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11.5">keep winners — MyKB</text>
<text x="200" y="618" text-anchor="start" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">winners → knowledge graph entries</text>
<text x="200" y="644" text-anchor="start" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">session artifacts + wiki pages</text>
<text x="200" y="670" text-anchor="start" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">temporal snapshots preserve history</text>
<text x="200" y="696" text-anchor="start" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="10.5">memory is the gene pool</text>
<line x1="710" y1="300" x2="890" y2="300" stroke="#475569" stroke-width="2.5" opacity="0.85" marker-end="url(#arwG)"/>
<text x="800" y="292" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">candidates</text>
<line x1="1170" y1="410" x2="1170" y2="520" stroke="#475569" stroke-width="2.5" opacity="0.85" marker-end="url(#arwG)"/>
<text x="1182" y="470" text-anchor="start" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">winners</text>
<line x1="890" y1="630" x2="710" y2="630" stroke="#475569" stroke-width="2.5" opacity="0.85" marker-end="url(#arwG)"/>
<text x="800" y="622" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">outcomes</text>
<line x1="430" y1="520" x2="430" y2="410" stroke="#475569" stroke-width="2.5" opacity="0.85" marker-end="url(#arwG)"/>
<text x="418" y="470" text-anchor="end" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">context</text>
<rect x="700" y="445" width="200" height="70" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="800" y="472" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="10.5">survival of the</text>
<text x="800" y="492" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="10.5">fittest ideas</text>
<rect x="100" y="800" width="1400" height="115" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="100" y="800" width="1400" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="100" y="820" width="1400" height="12" fill="#f472b6" opacity=".12"/>
<text x="800.0" y="820.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">BLIND VARIATION · SELECTIVE RETENTION</text>
<text x="116" y="848" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">No idea is trusted in advance — SPACE generates many candidates because the system cannot know which will work.</text>
<text x="116" y="873" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">The immutable evaluator is the selection pressure: integrity checks, isolated runs, PASS/FAIL. Only winners persist.</text>
<text x="116" y="898" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">MyKB is the gene pool — what survives becomes the inheritance every future generation starts from.</text>
<text x="800.0" y="930" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Generated from source analysis</text>
</svg>