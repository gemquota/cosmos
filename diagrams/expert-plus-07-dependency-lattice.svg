  <marker id="arwS" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f59e0b"/></marker>
  <marker id="arwD" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#10b981"/></marker>
  <marker id="arwH" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#f472b6"/></marker>
  <marker id="arwG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 L2,4Z" fill="#475569"/></marker>
</defs>
<rect width="1000" height="1320" fill="url(#bgGrad)"/>
<text x="500.0" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="24" font-weight="700" letter-spacing="1">THE DEPENDENCY LATTICE — THE PARTIAL ORDER OF ARTIFACTS</text>
<text x="500.0" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">What must exist before what — a Hasse diagram of the ecosystem's production rules</text>
<line x1="60.0" y1="76" x2="940.0" y2="76" stroke="#1e293b" stroke-width="1"/>

<circle cx="200" cy="120" r="24" fill="#f59e0b" opacity=".16" stroke="#f59e0b" stroke-width="1.8"/>
<text x="200" y="120" text-anchor="middle" dominant-baseline="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8" font-weight="800">SPACE INIT</text>
<circle cx="500" cy="120" r="24" fill="#f59e0b" opacity=".16" stroke="#f59e0b" stroke-width="1.8"/>
<text x="500" y="120" text-anchor="middle" dominant-baseline="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8" font-weight="800">PROBE</text>
<circle cx="800" cy="120" r="24" fill="#22d3ee" opacity=".16" stroke="#22d3ee" stroke-width="1.8"/>
<text x="800" y="120" text-anchor="middle" dominant-baseline="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="8" font-weight="800">CAPTURE HOOK</text>
<circle cx="300" cy="224" r="24" fill="#f59e0b" opacity=".16" stroke="#f59e0b" stroke-width="1.8"/>
<text x="300" y="224" text-anchor="middle" dominant-baseline="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8" font-weight="800">ANSWER</text>
<circle cx="640" cy="224" r="24" fill="#22d3ee" opacity=".16" stroke="#22d3ee" stroke-width="1.8"/>
<text x="640" y="224" text-anchor="middle" dominant-baseline="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="8" font-weight="800">TRANSCRIPT</text>
<circle cx="470" cy="328" r="24" fill="#f59e0b" opacity=".16" stroke="#f59e0b" stroke-width="1.8"/>
<text x="470" y="328" text-anchor="middle" dominant-baseline="middle" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8" font-weight="800">SPEC</text>
<circle cx="780" cy="328" r="24" fill="#22d3ee" opacity=".16" stroke="#22d3ee" stroke-width="1.8"/>
<text x="780" y="328" text-anchor="middle" dominant-baseline="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="8" font-weight="800">LESSON</text>
<circle cx="240" cy="432" r="24" fill="#818cf8" opacity=".16" stroke="#818cf8" stroke-width="1.8"/>
<text x="240" y="432" text-anchor="middle" dominant-baseline="middle" fill="#818cf8" font-family="system-ui,sans-serif" font-size="8" font-weight="800">CANDIDATE</text>
<circle cx="720" cy="432" r="24" fill="#22d3ee" opacity=".16" stroke="#22d3ee" stroke-width="1.8"/>
<text x="720" y="432" text-anchor="middle" dominant-baseline="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="8" font-weight="800">KG EDGE</text>
<circle cx="380" cy="536" r="24" fill="#f472b6" opacity=".16" stroke="#f472b6" stroke-width="1.8"/>
<text x="380" y="536" text-anchor="middle" dominant-baseline="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="8" font-weight="800">VERDICT</text>
<circle cx="850" cy="536" r="24" fill="#22d3ee" opacity=".16" stroke="#22d3ee" stroke-width="1.8"/>
<text x="850" y="536" text-anchor="middle" dominant-baseline="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="8" font-weight="800">INDEX</text>
<circle cx="500" cy="640" r="24" fill="#10b981" opacity=".16" stroke="#10b981" stroke-width="1.8"/>
<text x="500" y="640" text-anchor="middle" dominant-baseline="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="8" font-weight="800">PULSE</text>
<circle cx="500" cy="744" r="24" fill="#22d3ee" opacity=".16" stroke="#22d3ee" stroke-width="1.8"/>
<text x="500" y="744" text-anchor="middle" dominant-baseline="middle" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="8" font-weight="800">RETRIEVAL</text>
<line x1="SPACE INIT" y1="144" x2="ANSWER" y2="200" stroke="#334155" stroke-width="1.4" marker-end="url(#arwG)"/>
<line x1="PROBE" y1="144" x2="ANSWER" y2="200" stroke="#334155" stroke-width="1.4" marker-end="url(#arwG)"/>
<line x1="PROBE" y1="144" x2="SPEC" y2="304" stroke="#334155" stroke-width="1.4" marker-end="url(#arwG)"/>
<line x1="CAPTURE HOOK" y1="144" x2="TRANSCRIPT" y2="200" stroke="#334155" stroke-width="1.4" marker-end="url(#arwG)"/>
<line x1="ANSWER" y1="248" x2="SPEC" y2="304" stroke="#334155" stroke-width="1.4" marker-end="url(#arwG)"/>
<line x1="TRANSCRIPT" y1="248" x2="LESSON" y2="304" stroke="#334155" stroke-width="1.4" marker-end="url(#arwG)"/>
<line x1="SPEC" y1="352" x2="CANDIDATE" y2="408" stroke="#334155" stroke-width="1.4" marker-end="url(#arwG)"/>
<line x1="LESSON" y1="352" x2="KG EDGE" y2="408" stroke="#334155" stroke-width="1.4" marker-end="url(#arwG)"/>
<line x1="CANDIDATE" y1="456" x2="VERDICT" y2="512" stroke="#334155" stroke-width="1.4" marker-end="url(#arwG)"/>
<line x1="KG EDGE" y1="456" x2="INDEX" y2="512" stroke="#334155" stroke-width="1.4" marker-end="url(#arwG)"/>
<line x1="VERDICT" y1="560" x2="PULSE" y2="616" stroke="#334155" stroke-width="1.4" marker-end="url(#arwG)"/>
<line x1="INDEX" y1="560" x2="PULSE" y2="616" stroke="#334155" stroke-width="1.4" marker-end="url(#arwG)"/>
<line x1="PULSE" y1="664" x2="RETRIEVAL" y2="720" stroke="#334155" stroke-width="1.4" marker-end="url(#arwG)"/>
<text x="500" y="62" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">a lattice reads UPWARD: nothing exists until everything below it exists</text>
<rect x="60" y="880" width="880" height="100" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="880" width="880" height="32" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="900" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="900.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">WHAT THE LATTICE FORBIDS</text>
<text x="74" y="926" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">No SKIPPING: a candidate without a spec is a violation; a KG edge without a lesson is a violation.</text>
<text x="74" y="950" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">The conservation laws (E-24) are the lattice's enforcement — parentless artifacts are the forbidden nodes.</text>
<rect x="60" y="1171" width="880" height="93" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
<rect x="60" y="1171" width="880" height="28" rx="10" fill="#f472b6" opacity=".16"/>
<rect x="60" y="1187" width="880" height="12" fill="#f472b6" opacity=".12"/>
<text x="500.0" y="1189.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">READING THE LATTICE</text>
<text x="72" y="1211" fill="#f472b6" font-family="system-ui,sans-serif" font-size="10.5">NODE COLOUR = owning component; ARROWS = 'is produced from' — the partial order, not a timeline.</text>
<text x="72" y="1228" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">LEVELS ARE RANKS: two nodes on the same level are independent — capture hooks and probes never meet.</text>
<text x="72" y="1245" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5">RETRIEVAL tops the lattice because everything below it exists to make it possible.</text>
<text x="500.0" y="1278" text-anchor="middle" fill="#475569" font-family="system-ui,sans-serif" font-size="9.5" font-style="italic">production rules are a partial order — the lattice is the system's grammar of what comes first</text>
<text x="500.0" y="1300" text-anchor="middle" fill="#334155" font-family="system-ui,sans-serif" font-size="9.5">COSMOS — Architecture Diagrams • Round 6 · the doubling pass</text>
</svg>