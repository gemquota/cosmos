<text x="500.0" y="849.5" text-anchor="middle" fill="#f472b6" font-family="system-ui,sans-serif" font-size="13" font-weight="700">PROJECTION, NOT TRUTH</text>
<text x="74" y="874" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Isometric projection loses real depth — but the A-24 spheres keep it. Here the point is the terrain, not the metric.</text>
