<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' },
      }
    }
  }
}
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
body { font-family: 'Inter', system-ui, sans-serif; }
.fade-in { animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
.progress-bar { transition: width .4s ease; }
textarea:focus, input:focus, select:focus { outline: none; box-shadow: 0 0 0 2px rgba(99,102,241,.4); }
</style>

<body class="h-full bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100">

<div id="app" class="h-full flex flex-col">

<!-- ═══ Top Bar ═══ -->
<header class="flex items-center justify-between px-4 md:px-6 h-14 border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shrink-0">
  <div class="flex items-center gap-3">
    <button onclick="toggleSidebar()" class="md:hidden p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 class="text-lg font-bold tracking-tight">
      <span class="text-brand-600 dark:text-brand-400">SPACE</span>
      <span class="text-gray-400 dark:text-gray-600 font-normal text-sm ml-2 hidden sm:inline">Superb Prompt Automatic Creation Engine</span>
    </h1>
  </div>
  <div class="flex items-center gap-2">
    <span id="session-badge" class="hidden px-2.5 py-0.5 text-xs font-medium rounded-full bg-brand-100 dark:bg-brand-900 text-brand-700 dark:text-brand-300"></span>
    <button onclick="toggleTheme()" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800" title="Toggle theme">
      <svg id="sun-icon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      <svg id="moon-icon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    </button>
  </div>
</header>

<div class="flex flex-1 overflow-hidden">

<!-- ═══ Sidebar ═══ -->
<aside id="sidebar" class="w-64 shrink-0 border-r border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 flex flex-col overflow-y-auto hidden md:flex">
  <nav class="flex-1 p-3 space-y-1">
    <a href="#" onclick="showView('dashboard')" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-800 transition" data-view="dashboard">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Dashboard
    </a>
    <a href="#" onclick="showView('projects')" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-800 transition" data-view="projects">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
      Projects
    </a>
    <a href="#" onclick="showView('run')" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-800 transition" data-view="run">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Run Session
    </a>
    <a href="#" onclick="showView('export')" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-800 transition" data-view="export">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      Export
    </a>
    <a href="#" onclick="showView('framework')" class="nav-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-800 transition" data-view="framework">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      Framework
    </a>
  </nav>
  <div class="p-3 border-t border-gray-200 dark:border-gray-800 text-xs text-gray-400 dark:text-gray-600">
    v2.1.0 · 326 probes · 7 series
  </div>
</aside>

<!-- ═══ Main Content ═══ -->
<main id="main" class="flex-1 overflow-y-auto">
  <div id="view-container" class="max-w-4xl mx-auto p-4 md:p-8"></div>
</main>

</div>
</div>

<script>
const API = '';
let currentView = 'dashboard';
let currentSession = null;
let currentProject = null;
let framework = null;
let projects = [];

// ── Theme ──
var embedCosmos = location.search.indexOf('embed=cosmos') > -1;
if (embedCosmos || localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  document.documentElement.classList.add('dark');
  if (embedCosmos) localStorage.setItem('theme', 'dark');
}
function toggleTheme() {
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
}

// ── Sidebar ──
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('hidden');
  sb.classList.toggle('flex');
  sb.classList.toggle('absolute');
  sb.classList.toggle('inset-y-14');
  sb.classList.toggle('z-50');
  sb.classList.toggle('shadow-xl');
}

// ── Navigation ──
function showView(view) {
  currentView = view;
  document.querySelectorAll('.nav-link').forEach(el => {
    el.classList.toggle('bg-brand-50', el.dataset.view === view);
    el.classList.toggle('dark:bg-brand-950', el.dataset.view === view);
    el.classList.toggle('text-brand-700', el.dataset.view === view);
    el.classList.toggle('dark:text-brand-300', el.dataset.view === view);
  });
  // Close mobile sidebar
  const sb = document.getElementById('sidebar');
  if (window.innerWidth < 768) { sb.classList.add('hidden'); sb.classList.remove('flex','absolute','z-50','shadow-xl'); }
  
  const renderers = { dashboard: renderDashboard, projects: renderProjects, run: renderRun, export: renderExport, framework: renderFramework };
  (renderers[view] || renderDashboard)();
}

// ── API helpers ──
const STATIC_API = {
  '/api/framework': 'framework-summary.json',
  '/api/framework/full': 'framework-full.json',
  '/api/projects': 'projects.json',
};

// API bases tried in order. Same-origin first (served by web/server.mjs);
// when this page is embedded in the Cosmos dashboard or opened statically,
// fall back to the local SPACE server so sessions and mutations still work.
const API_BASES = ['', 'http://localhost:8888', 'http://127.0.0.1:8888'];

async function api(path, opts = {}) {
  const method = opts.method || 'GET';
  const body = opts.body ? JSON.stringify(opts.body) : undefined;
  let lastErr = null;
  for (let i = 0; i < API_BASES.length; i++) {
    try {
      const res = await fetch(API_BASES[i] + path, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body,
      });
      if (res.ok) return res.json();
      lastErr = new Error('HTTP ' + res.status);
    } catch (e) {
      lastErr = e;
    }
  }
  // Static fallback: GETs read from bundled JSON; mutations report failure
  // instead of pretending to succeed.
  if (method === 'GET') {
    const sp = STATIC_API[path];
    if (sp) {
      try {
        const sr = await fetch(sp);
        if (sr.ok) return sr.json();
      } catch (e) {}
    }
  }
  throw lastErr || new Error('offline');
}

function offlineNotice(c) {
  c.innerHTML = '<div class="fade-in rounded-xl border border-amber-200 dark:border-amber-900 bg-amber-50 dark:bg-amber-950 p-6 text-sm">' +
    '<h2 class="font-semibold mb-1">SPACE engine offline</h2>' +
    '<p class="text-gray-600 dark:text-gray-400">This view needs the SPACE server. Run <code class="font-mono text-xs">cosmos</code> locally for the full engine — the 📄 Spec Viewer and 🕸️ Knowledge Graph tabs still work statically.</p>' +
    '</div>';
}

// ═══════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════
async function renderDashboard() {
  const c = document.getElementById('view-container');
  c.innerHTML = '<div class="animate-pulse space-y-4"><div class="h-32 bg-gray-200 dark:bg-gray-800 rounded-xl"></div><div class="h-48 bg-gray-200 dark:bg-gray-800 rounded-xl"></div></div>';
  
  const [fw, projList] = await Promise.all([api('/api/framework'), api('/api/projects')]);
  if (fw && fw.error) { offlineNotice(c); return; }
  framework = fw;
  projects = projList;
  
  c.innerHTML = `
    <div class="fade-in space-y-6">
      <div>
        <h2 class="text-2xl font-bold mb-1">Welcome to SPACE</h2>
        <p class="text-gray-500 dark:text-gray-400">Superb Prompt Automatic Creation Engine — ${fw.meta.total_open_ended} structured probes across ${fw.meta.total_series} progressive series.</p>
      </div>
      
      <!-- Stats -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-4">
          <div class="text-2xl font-bold text-brand-600 dark:text-brand-400">${fw.meta.total_series}</div>
          <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">Series</div>
        </div>
        <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-4">
          <div class="text-2xl font-bold text-brand-600 dark:text-brand-400">${fw.meta.total_open_ended}</div>
          <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">Questions</div>
        </div>
        <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-4">
          <div class="text-2xl font-bold text-brand-600 dark:text-brand-400">${projects.length}</div>
          <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">Projects</div>
        </div>
        <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-4">
          <div class="text-2xl font-bold text-brand-600 dark:text-brand-400">${fw.meta.total_open_ended + fw.meta.total_multi_choice}</div>
          <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">Total Probes</div>
        </div>
      </div>
      
      <!-- Series overview -->
      <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 overflow-hidden">
        <div class="px-5 py-3 border-b border-gray-200 dark:border-gray-800 font-semibold text-sm">Series Overview</div>
        <div class="divide-y divide-gray-100 dark:divide-gray-800">
          ${fw.series.map(s => `
            <div class="px-5 py-3 flex items-center justify-between hover:bg-gray-50 dark:hover:bg-gray-800/50 transition">
              <div class="flex items-center gap-3">
                <span class="w-7 h-7 rounded-lg bg-brand-50 dark:bg-brand-950 text-brand-600 dark:text-brand-400 flex items-center justify-center text-xs font-bold">${s.id}</span>
                <div>
                  <div class="text-sm font-medium">${s.name}</div>
                  <div class="text-xs text-gray-400 dark:text-gray-500">${s.description}</div>
                </div>
              </div>
              <div class="flex items-center gap-4 text-xs text-gray-400 dark:text-gray-500">
                <span>${s.rounds} rounds</span>
                <span>${s.total_open_ended} Q</span>
                ${s.depends_on.length ? `<span class="px-1.5 py-0.5 rounded bg-gray-100 dark:bg-gray-800">→${s.depends_on.join(',')}</span>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
      
      <!-- Quick actions -->
      <div class="flex gap-3 flex-wrap">
        <button onclick="showView('projects');setTimeout(()=>document.getElementById('create-modal')?.classList.remove('hidden'),100)" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition">
          + New Project
        </button>
        <button onclick="showView('framework')" class="px-4 py-2 border border-gray-200 dark:border-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition">
          View Framework
        </button>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════
// PROJECTS
// ═══════════════════════════════════════
async function renderProjects() {
  const c = document.getElementById('view-container');
  c.innerHTML = '<div class="animate-pulse h-48 bg-gray-200 dark:bg-gray-800 rounded-xl"></div>';
  
  projects = await api('/api/projects');
  
  c.innerHTML = `
    <div class="fade-in space-y-6">
      <div class="flex items-center justify-between">
        <h2 class="text-2xl font-bold">Projects</h2>
        <button onclick="document.getElementById('create-modal').classList.remove('hidden')" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition">
          + New Project
        </button>
      </div>
      
      ${projects.length === 0 ? `
        <div class="text-center py-16 text-gray-400">
          <svg class="w-12 h-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          <p class="text-sm">No projects yet. Create one to get started.</p>
        </div>
      ` : `
        <div class="grid gap-3">
          ${projects.map(p => `
            <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-5 hover:border-brand-300 dark:hover:border-brand-700 transition cursor-pointer" onclick="selectProject('${p.name}')">
              <div class="flex items-start justify-between">
                <div>
                  <h3 class="font-semibold text-lg">${p.name}</h3>
                  <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">${p.description || 'No description'}</p>
                </div>
                <button onclick="event.stopPropagation();deleteProject('${p.name}')" class="p-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-950 text-gray-400 hover:text-red-500 transition" title="Delete">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </div>
              <div class="flex items-center gap-4 mt-3 text-xs text-gray-400 dark:text-gray-500">
                <span>${p.session_count} session${p.session_count !== 1 ? 's' : ''}</span>
                <span>${p.completed_sessions} completed</span>
                <span>${new Date(p.created_at).toLocaleDateString()}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `}
    </div>
    
    <!-- Create modal -->
    <div id="create-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
      <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-2xl w-full max-w-md mx-4 p-6">
        <h3 class="text-lg font-bold mb-4">New Project</h3>
        <input id="new-project-name" type="text" placeholder="Project name" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-gray-50 dark:bg-gray-800 text-sm mb-3">
        <textarea id="new-project-desc" placeholder="Description (optional)" rows="2" class="w-full px-3 py-2 border border-gray-200 dark:border-gray-700 rounded-lg bg-gray-50 dark:bg-gray-800 text-sm mb-4 resize-none"></textarea>
        <div class="flex justify-end gap-2">
          <button onclick="document.getElementById('create-modal').classList.add('hidden')" class="px-4 py-2 text-sm rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition">Cancel</button>
          <button onclick="createProject()" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg transition">Create</button>
        </div>
      </div>
    </div>
  `;
}

async function createProject() {
  const name = document.getElementById('new-project-name').value.trim();
  const desc = document.getElementById('new-project-desc').value.trim();
  if (!name) return;
  try {
    await api('/api/projects', { method: 'POST', body: { name, description: desc } });
    document.getElementById('create-modal').classList.add('hidden');
    renderProjects();
  } catch (e) {
    alert('Could not create project — start the SPACE server (node web/server.mjs) or check localhost:8888.\n\n' + (e && e.message ? e.message : e));
  }
}

async function deleteProject(name) {
  if (!confirm(`Delete project "${name}"?`)) return;
  try {
    await api(`/api/projects/${name}`, { method: 'DELETE' });
    renderProjects();
  } catch (e) {
    alert('Could not delete project — ' + (e && e.message ? e.message : e));
  }
}

async function selectProject(name) {
  currentProject = name;
  showView('run');
}

// ═══════════════════════════════════════
// RUN SESSION
// ═══════════════════════════════════════
async function renderRun() {
  const c = document.getElementById('view-container');
  
  // If no project selected, show project picker
  if (!currentProject) {
    if (projects.length === 0) projects = await api('/api/projects');
    if (projects.length === 0) {
      c.innerHTML = `<div class="fade-in text-center py-16"><p class="text-gray-400 mb-4">Create a project first.</p><button onclick="showView('projects')" class="px-4 py-2 bg-brand-600 text-white rounded-lg text-sm">Go to Projects</button></div>`;
      return;
    }
    c.innerHTML = `
      <div class="fade-in space-y-6">
        <h2 class="text-2xl font-bold">Select Project</h2>
        <div class="grid gap-2">
          ${projects.map(p => `
            <button onclick="currentProject='${p.name}';renderRun()" class="text-left px-4 py-3 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl hover:border-brand-300 dark:hover:border-brand-700 transition">
              <div class="font-medium">${p.name}</div>
              <div class="text-xs text-gray-400">${p.session_count} sessions</div>
            </button>
          `).join('')}
        </div>
      </div>
    `;
    return;
  }
  
  // Start or resume session
  if (!currentSession) {
    c.innerHTML = `
      <div class="fade-in space-y-6">
        <div>
          <button onclick="currentProject=null;renderRun()" class="text-sm text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 mb-2 inline-flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            Back
          </button>
          <h2 class="text-2xl font-bold">${currentProject}</h2>
        </div>
        <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-6 text-center space-y-4">
          <div class="w-16 h-16 mx-auto rounded-2xl bg-brand-50 dark:bg-brand-950 flex items-center justify-center">
            <svg class="w-8 h-8 text-brand-600 dark:text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </div>
          <p class="text-gray-500 dark:text-gray-400">Start a new elicitation session with 326 structured probes across 7 progressive series.</p>
          <div class="flex gap-3 justify-center">
          <button onclick="startSession()" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition">
            Start Session
          </button>
          <button onclick="startSessionAndAutofill()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium transition">
            ⚡ Autofill Session
          </button>

async function submitAnswer() {
  if (!currentSession?.id) return;
  const text = document.getElementById('answer-text').value.trim();
  if (!text) { document.getElementById('answer-text').classList.add('ring-2','ring-red-300'); return; }
  
  const choice = document.querySelector('input[name="choice"]:checked');
  const choiceId = choice ? choice.value : '';
  
  const data = await api(`/api/sessions/${currentSession.id}/answer`, {
    method: 'POST',
    body: { question_id: currentSession.currentQuestionId || '', open_ended: text, choice_id: choiceId },
  });
  
  if (data.session_completed) {
    currentSession = { ...currentSession, complete: true };
    renderQuestion();
    return;
  }
  
  await renderQuestion();
}

async function skipQuestion() {
  if (!currentSession?.id) return;
  const qid = document.querySelector('.text-xs.text-gray-400')?.textContent?.match(/Q ([\d.]+)/)?.[1];
  if (qid) {
    await api(`/api/sessions/${currentSession.id}/skip`, {
      method: 'POST',
      body: { question_id: qid, reason: 'skipped by user' },
    });
  }
  await renderQuestion();
}

async function runExport() {
  const formats = [...document.querySelectorAll('input[type="checkbox"]:checked')].map(c => c.value);
  if (!formats.length) return;
  
  const btn = document.getElementById('export-btn');
  btn.disabled = true;
  btn.textContent = 'Generating…';
  
  const data = await api(`/api/sessions/${currentSession.id}/export`, {
    method: 'POST',
    body: { formats, project_name: currentProject || 'export' },
  });
  
  btn.disabled = false;
  btn.textContent = 'Generate Export';
  
  const container = document.getElementById('export-results');
  container.innerHTML = data.exports.map(exp => `
    <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 overflow-hidden">
      <div class="px-5 py-3 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between">
        <div>
          <span class="font-semibold text-sm capitalize">${exp.format}</span>
          <span class="text-xs text-gray-400 ml-2">${(exp.size_bytes / 1024).toFixed(1)} KB</span>
        </div>
        <button onclick="downloadExport('${exp.format}', this)" class="px-3 py-1 text-xs font-medium bg-brand-50 dark:bg-brand-950 text-brand-700 dark:text-brand-300 rounded-lg hover:bg-brand-100 dark:hover:bg-brand-900 transition">
          Download
        </button>
      </div>
      <pre class="p-4 text-xs text-gray-600 dark:text-gray-400 overflow-x-auto max-h-64 overflow-y-auto bg-gray-50 dark:bg-gray-800/50"><code>${escapeHtml(exp.content.slice(0, 2000))}${exp.content.length > 2000 ? '\n…' : ''}</code></pre>
    </div>
  `).join('');
  
  // Store for download
  window._exportData = {};
  data.exports.forEach(exp => { window._exportData[exp.format] = exp; });
}

function downloadExport(format) {
  const exp = window._exportData?.[format];
  if (!exp) return;
  const blob = new Blob([exp.content], { type: exp.mime_type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = exp.filename;
  a.click();
  URL.revokeObjectURL(url);
}

async function autofillSession() {
  if (!currentSession?.id) return;
  const btn = document.getElementById('autofill-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Filling...'; }
  
  let count = 0;
  for (const [qid, ans] of Object.entries(AUTO_ANSWERS)) {
    const data = await api(`/api/sessions/${currentSession.id}/answer`, {
      method: 'POST',
      body: { question_id: qid, open_ended: ans.text, choice_id: ans.choice },
    });
    if (data.accepted) count++;
    if (data.session_completed) break;
  }
  
  if (btn) { btn.disabled = false; btn.textContent = 'Autofill All'; }
  await renderQuestion();
}
