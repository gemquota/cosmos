<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test Dashboard</title>
<script src="/rack/vue.global.js"></script>
<script src="/rack/chart.umd.js"></script>
<style>
[v-cloak]{display:none}
body{background:#0f172a;color:#e2e8f0;font-family:sans-serif;margin:20px}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;margin-bottom:16px}
h1{color:#818cf8}
</style>
</head>
<body>
<div id="app" v-cloak>
  <div class="card">
    <h1>Test Dashboard</h1>
    <p>Vue loaded: {{ vueLoaded ? "YES" : "NO" }}</p>
    <p>Chart loaded: {{ typeof Chart !== 'undefined' ? "YES" : "NO" }}</p>
    <p>Pulses: {{ pulses.length }}</p>
    <p>Goals: {{ goals.length }}</p>
  </div>
  <div class="card">
    <canvas ref="testChart" style="height:200px;width:100%"></canvas>
  </div>
</div>
<script>
const { createApp, ref, computed, onMounted, nextTick } = Vue;

createApp({
  setup() {
    const vueLoaded = ref(true);
    const testChart = ref(null);
    const pulses = ref([{id:1},{id:2},{id:3}]);
    const goals = ref([{id:1},{id:2},{id:3},{id:4},{id:5}]);

    onMounted(() => {
      nextTick(() => {
        if (testChart.value && typeof Chart !== 'undefined') {
          new Chart(testChart.value, {
            type: 'bar',
            data: {
              labels: ['A','B','C'],
              datasets: [{data: [3,7,2], backgroundColor: '#6366f1'}]
            }
          });
          console.log("Chart created");
        }
      });
    });

    return { vueLoaded, testChart, pulses, goals };
  }
}).mount('#app');
</script>
</body>
</html>
