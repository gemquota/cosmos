<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>COSMOS Bridge</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .hide{display:none !important}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#334155;border-radius:8px}
  .msg p{margin:0 0 .5rem}
  .msg pre{background:#0f172a;border:1px solid #334155;border-radius:.5rem;padding:.6rem .75rem;overflow-x:auto;font-size:.75rem;margin:.4rem 0}
  .msg code{font-family:ui-monospace,monospace;font-size:.8em;background:#1e293b;padding:.1rem .3rem;border-radius:.3rem}
  .msg pre code{background:transparent;padding:0}
  .msg ul,.msg ol{margin:.3rem 0 .5rem 1.2rem;list-style:disc}
  .msg ol{list-style:decimal}
  .msg a{color:#818cf8;text-decoration:underline}
  .msg h1,.msg h2,.msg h3{font-weight:700;margin:.5rem 0 .3rem}
  .msg h1{font-size:1rem}.msg h2{font-size:.9rem}.msg h3{font-size:.85rem}
</style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
<div class="max-w-3xl mx-auto px-3 sm:px-5 py-4 sm:py-6 flex flex-col" style="height:100vh">

  <!-- Header -->
  <div class="flex items-center justify-between gap-3 mb-3">
    <div class="flex items-center gap-2">
      <span class="text-lg">🌉</span>
      <h1 class="text-base sm:text-lg font-bold">COSMOS Bridge</h1>
      <span id="st-bridge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-400 border border-amber-500/25 uppercase">checking…</span>
    </div>
    <div class="flex items-center gap-2">
      <span id="st-model" class="text-[10px] font-mono text-slate-400 bg-slate-800/60 border border-slate-700/50 rounded-lg px-2 py-1">—</span>
      <span id="st-kg" class="text-[10px] font-mono text-slate-400 bg-slate-800/60 border border-slate-700/50 rounded-lg px-2 py-1">—</span>
      <span id="st-strat" class="text-[10px] font-mono text-slate-400 bg-slate-800/60 border border-slate-700/50 rounded-lg px-2 py-1">—</span>
    </div>
  </div>

  <!-- Drives strip -->
  <div id="drives" class="mb-3"></div>

  <!-- Chat scroll -->
  <div id="chat" class="flex-1 overflow-y-auto space-y-3 pr-1 pb-3"></div>

  <!-- Suggested prompts -->
  <div id="sugg" class="flex flex-wrap gap-1.5 mb-3"></div>

  <!-- Input row -->
  <form id="form" class="flex items-end gap-2">
    <label class="flex items-center gap-1.5 text-[10px] sm:text-xs text-slate-400 select-none shrink-0 pb-2 cursor-pointer" title="Include the live Cosmos snapshot in the prompt">
      <input id="ctx" type="checkbox" checked class="accent-indigo-500 h-3.5 w-3.5" />
      Cosmos ctx
    </label>
    <textarea id="inp" rows="1" placeholder="Ask the bridge — system state, drives, plans, or a build task…"
      class="flex-1 resize-none bg-slate-800/60 border border-slate-700/50 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-indigo-500/60 placeholder:text-slate-500"
      style="max-height:140px"></textarea>
    <button type="submit" class="shrink-0 bg-indigo-500 hover:bg-indigo-400 text-white text-sm font-semibold rounded-xl px-4 py-2.5 transition">Send ↵</button>
  </form>
</div>

<script>
var API = '';
var hist = [];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function el(tag, cls, html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

// markdown-lite: code fences, inline code, bold, italic, lists, links
function render(md){
  var out = esc(md);
  var blocks = [];
  out = out.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code){blocks.push('<pre><code>'+esc(code.trim())+'</code></pre>');return '\u0000B'+(blocks.length-1)+'\u0000';});
  out = out.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
           .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
           .replace(/`([^`]+)`/g,'<code>$1</code>')
           .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.split('\n').map(function(l){
    if(/^\s*[-*] /.test(l)) return '<li>'+l.replace(/^\s*[-*] /,'')+'</li>';
    if(/^\s*\d+\. /.test(l)) return '<li>'+l.replace(/^\s*\d+\. /,'')+'</li>';
    return l;
  }).join('\n');
  out = out.replace(/(<li>[\s\S]*?<\/li>)/g, function(m){return '<ul>'+m+'</ul>';});
  out = out.replace(/\u0000B(\d+)\u0000/g, function(_,i){return blocks[+i];});
  return out.replace(/\n{3,}/g,'\n\n');
}

function addMsg(role, text){
  hist.push({role: role, content: text});
  var box = document.getElementById('chat');
  var wrap = el('div', 'flex ' + (role==='user' ? 'justify-end' : 'justify-start'));
  var cls = role==='user'
    ? 'max-w-[85%] bg-indigo-500/20 border border-indigo-500/40 text-indigo-50 rounded-2xl rounded-br-md px-3.5 py-2.5 text-sm'
    : 'max-w-[92%] bg-slate-800/60 border border-slate-700/50 text-slate-200 rounded-2xl rounded-bl-md px-3.5 py-2.5 text-sm msg';
  var b = el('div', cls);
  if (role==='assistant') b.innerHTML = render(text);
  else b.textContent = text;
  wrap.appendChild(b);
  box.appendChild(wrap);
  box.scrollTop = box.scrollHeight;
  return b;
}

function chip(label, fn){
  var c = el('button', 'text-[10px] sm:text-[11px] px-2.5 py-1.5 rounded-lg bg-slate-800/60 border border-slate-700/50 text-slate-300 hover:border-indigo-500/50 hover:text-indigo-300 transition', esc(label));
  c.onclick = function(){document.getElementById('inp').value = label; autosize(); send();};
  document.getElementById('sugg').appendChild(c);
}

function setStatus(id, text, color){
  var e = document.getElementById(id);
  e.textContent = text;
  e.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full border uppercase ' + (color || 'bg-slate-600/20 text-slate-400 border-slate-500/30');
}

function autosize(){
  var t = document.getElementById('inp');
  t.style.height = 'auto';
  t.style.height = Math.min(140, t.scrollHeight) + 'px';
}

async function loadCosmos(){
  try{
    var r = await fetch(API + '/api/cosmos');
    if(!r.ok) throw new Error('HTTP '+r.status);
    var c = await r.json();
    setStatus('st-bridge', c.llm === 'connected' ? '● live' : '● offline-fallback', c.llm === 'connected' ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/25' : 'bg-amber-500/15 text-amber-400 border-amber-500/25');
    document.getElementById('st-model').textContent = c.model || '—';
    document.getElementById('st-kg').textContent = 'KG ' + (c.kg ? c.kg.nodes + 'n/' + c.kg.edges + 'e' : '—');
    document.getElementById('st-strat').textContent = 'gen ' + (c.strategies ? c.strategies.generation : '—') + ' · fit ' + (c.strategies && c.strategies.best_fitness != null ? c.strategies.best_fitness : '—');
    var dr = document.getElementById('drives');
    if (c.drives && c.drives.tiers && c.drives.tiers.length){
      dr.innerHTML = '<div class="bg-slate-800/60 border border-slate-700/50 rounded-xl p-2.5 sm:p-3">' +
        '<div class="flex items-center gap-2 mb-1.5"><span class="text-[10px] font-bold text-indigo-400 uppercase">🧭 Active drives</span>' +
        '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded-full bg-indigo-500/15 text-indigo-400 border border-indigo-500/25 uppercase">'+esc(c.drives.status)+'</span></div>' +
        '<div class="flex flex-wrap gap-1.5">' + c.drives.tiers.map(function(t){
          return '<span class="text-[10px] px-2 py-1 rounded-lg bg-slate-700/40 border border-slate-600/40 text-slate-300">T'+t.tier+' '+esc(t.name)+'</span>';
        }).join('') + '</div></div>';
      c.drives.tiers.forEach(function(t){
        chip('T'+t.tier+' — '+t.name, null);
      });
    }
    chip('Summarize current system state', null);
    chip('What are the active drives and next steps?', null);
    chip('Explain the goal stack', null);
    return c;
  }catch(e){
    setStatus('st-bridge', 'offline', 'bg-rose-500/15 text-rose-400 border-rose-500/25');
    addMsg('assistant', '⚠ Bridge API unreachable (' + esc(e.message) + ').\n\nStart it with:\n\n```bash\ncd components/rsis3 && node rack/bridge/server.mjs\n```');
    return null;
  }
}

async function send(){
  var inp = document.getElementById('inp');
  var q = inp.value.trim();
  if(!q) return;
  inp.value = ''; autosize();
  addMsg('user', q);
  var typing = addMsg('assistant', '…');
  typing.innerHTML = '<span class="text-slate-400">thinking…</span>';
  try{
    var r = await fetch(API + '/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ messages: hist, cosmos: document.getElementById('ctx').checked }),
    });
    var d = await r.json();
    if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
    typing.innerHTML = render(d.reply);
  }catch(e){
    typing.innerHTML = render('⚠ Request failed: ' + esc(e.message));
  }
  hist = hist.filter(function(m){return m.role==='assistant' && m.content !== '…';});
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
}

document.getElementById('form').addEventListener('submit', function(e){e.preventDefault(); send();});
document.getElementById('inp').addEventListener('input', autosize);
document.getElementById('inp').addEventListener('keydown', function(e){
  if(e.key==='Enter' && !e.shiftKey){e.preventDefault(); send();}
});
loadCosmos().then(function(c){
  if(c && c.llm !== 'connected'){
    addMsg('assistant', 'Bridge is in **offline-fallback** mode (no `GEMINI_API_KEY` on the server). Replies are deterministic cosmos envelopes — start the server with a key for real LLM answers.');
  } else if (c) {
    addMsg('assistant', 'Bridge online — I can read the live Cosmos snapshot (KG, strategies, pulses, syntheses) and the active drive stack. Ask about system state, plan the next tier, or describe a build task.');
  }
});
</script>
</body>
</html>
