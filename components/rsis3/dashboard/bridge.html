<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>COSMOS Bridge</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; margin: 0; background: #020617; }
  body { color: #e2e8f0; }
</style>
</head>
<body class="bg-slate-950 text-slate-200">
<div id="bridge-app" style="height:100vh"></div>
<script src="bridge.js"></script>
<script>
  window.initCosmosBridge(document.getElementById('bridge-app'), {
    api: typeof BRIDGE_URL !== 'undefined' ? BRIDGE_URL : '',
    token: typeof BRIDGE_TOKEN !== 'undefined' ? BRIDGE_TOKEN : ''
  });
</script>
</body>
</html>
