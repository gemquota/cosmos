function renderGraph() { /* alias for initForceGraph - graph inits on tab click */ }
function render() {
  if (!DATA) return;
  const s = DATA.summary || {};
  const cq = DATA.code_quality || {};
  const pp = cq.per_project || {};
  const arch = DATA.architecture || {};
  const integ = DATA.integration || {};
  const di = DATA.data_integrity || {};
  const perf = DATA.performance || {};
  const findings = DATA.findings || [];

  document.getElementById('report-date').textContent = (DATA.timestamp||'').replace('T',' ').replace('Z','');
  document.getElementById('report-duration').textContent = (s.total_duration||DATA.duration||'—')+'s';

  const projs = ['rsis3','mykb','myrsikb'];
  document.getElementById('metric-cards').innerHTML = projs.map(p => {
    const info = pp[p]||{files:0,lines:0,functions:0};
    return metricCard(p, info.files+' files', info.lines+' lines · '+info.functions+' funcs', `text-${p}`);
  }).join('') +
  metricCard('Total Lines', s.total_lines||Object.values(pp).reduce((a,b)=>a+b.lines,0), 'across all projects') +
  metricCard('Findings', findings.length, s.by_level?Object.entries(s.by_level).map(([k,v])=>`${k}:${v}`).join(' · '):'');

  // Store render args for lazy rendering
  window._RENDER_ARGS = {pp, arch, perf, s, di, integ, findings, cq};

  // Lazy tab rendering — only render what's visible or was visited
  const tabRenderers = {
    overview: () => renderOverview(pp, arch, perf, s, di),
    graph: () => { /* graph handled separately */ },
    blueprint: () => renderBlueprint(),
    workflows: () => renderWorkflows(),
    files: () => renderFiles(pp, perf),
    integration: () => renderIntegration(integ),
    findings: () => renderFindings(findings),
    review: () => renderReview(s, cq, arch, perf, di),
    critique: () => renderCritique(s, cq, arch, perf, di, integ),
    database: () => renderDatabase(di),
    wiki: () => renderWiki(di),
  };
  window._tabRenderers = tabRenderers;
  window._renderedTabs = new Set();

  // Render only the active (overview) tab immediately
  renderOverview(pp, arch, perf, s, di);
  window._renderedTabs.add('overview');

  // Tab click handler with lazy rendering
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      const panel = document.getElementById('tab-'+btn.dataset.tab);
      if (panel) panel.classList.remove('hidden');

      const tab = btn.dataset.tab;

      // Pause graph when leaving, resume when entering
      if (tab !== 'graph' && window._graphRunning) {
        window._graphRunning = false;
        if (window._graphAnimFrame) { cancelAnimationFrame(window._graphAnimFrame); window._graphAnimFrame = null; }
      }

      // Lazy render on first visit
      if (!window._renderedTabs.has(tab) && window._tabRenderers[tab]) {
        window._tabRenderers[tab]();
        window._renderedTabs.add(tab);
      }

      // Init/resume graph on tab click
      if (tab === 'graph') {
        setTimeout(() => {
          if (!window._graphInitialized) {
            initForceGraph();
            window._graphInitialized = true;
          } else {
            // Resume simulation
            window._graphRunning = true;
            if (window._resumeGraph) window._resumeGraph();
          }
        }, 50);
      }
    };
  });
}

  });
  html += `</div><div class="card p-5 mb-8 animate-in">
    <h3 class="text-sm font-semibold text-surface-200 uppercase tracking-wider mb-4">Architecture</h3>
    <div class="grid grid-cols-3 gap-6 text-sm">

  html += `<div class="card p-5 animate-in"><h3 class="text-sm font-semibold text-surface-200 uppercase tracking-wider mb-4">Largest Files</h3><div class="space-y-2">`;
  (perf.largest_files||[]).slice(0,10).forEach(([lines,fn,proj]) => {

// graph state managed via window._graph* vars

function initForceGraph() {
  if (window._graphAnimFrame) return;
  const canvas = document.getElementById('graph-canvas');
  if (!canvas) return;

  const rect = canvas.getBoundingClientRect();
  const W = rect.width || 900;
  const H = rect.height || 600;
  canvas.width = W * (window.devicePixelRatio||1);
  canvas.height = H * (window.devicePixelRatio||1);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio||1, window.devicePixelRatio||1);

  const nodes = GRAPH_NODES.map((n,i) => ({
    ...n, x: W/2 + (Math.random()-0.5)*W*0.4, y: H/2 + (Math.random()-0.5)*H*0.4,
    vx:0, vy:0, r: Math.max(30, 50 * n.w),
    color: n.group === 'rsis3' ? '#8b5cf6' : n.group === 'bridge' ? '#f59e0b' : '#06b6d4'
  }));
  const nodeMap = {}; nodes.forEach(n => nodeMap[n.id]=n);
  const links = GRAPH_LINKS.map(l => ({
    s: nodeMap[l.s], t: nodeMap[l.t], label: l.label, w: l.w, bridge: l.bridge || false
  })).filter(l => l.s && l.t);

  const tooltip = document.getElementById('graph-tooltip');
  const alpha = { value: 0.5 };

  function simulate() {
    if (!window._graphRunning) return;
    const decay = 0.99, repulsion = 8000, attraction = 0.005, centering = 0.001, maxSpeed = 4;

    for (let i = 0; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        let dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
        let dist = Math.sqrt(dx*dx + dy*dy) || 1;
        let force = repulsion * alpha.value / (dist * dist);
        nodes[i].vx += (dx/dist) * force; nodes[i].vy += (dy/dist) * force;
        nodes[j].vx -= (dx/dist) * force; nodes[j].vy -= (dy/dist) * force;
      }
    }
    links.forEach(l => {
      let dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, dist = Math.sqrt(dx*dx + dy*dy) || 1;
      let force = (dist - 120) * attraction * l.w;
      l.s.vx += (dx/dist) * force; l.s.vy += (dy/dist) * force;
      l.t.vx -= (dx/dist) * force; l.t.vy -= (dy/dist) * force;
    });
    nodes.forEach(n => {
      n.vx += (W/2 - n.x) * centering; n.vy += (H/2 - n.y) * centering;
    });
    nodes.forEach(n => {
      n.vx *= decay; n.vy *= decay;
      const speed = Math.sqrt(n.vx*n.vx + n.vy*n.vy);
      if (speed > maxSpeed) { n.vx *= maxSpeed/speed; n.vy *= maxSpeed/speed; }
      n.x += n.vx; n.y += n.vy;
      n.x = Math.max(n.r, Math.min(W-n.r, n.x));
      n.y = Math.max(n.r, Math.min(H-n.r, n.y));
    });
    alpha.value *= 0.995;
    if (alpha.value < 0.001) alpha.value = 0.001;

    draw(ctx, W, H, nodes, links, tooltip, canvas);
    window._graphAnimFrame = requestAnimationFrame(simulate);
  }

  window._resumeGraph = function() { simulate(); };

  canvas.onmousemove = (e) => {
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    let hovered = null;
    for (let i = nodes.length-1; i >= 0; i--) {
      const n = nodes[i], dx = mx - n.x, dy = my - n.y;
      if (dx*dx + dy*dy < n.r*n.r) { hovered = n; break; }
    }
    if (hovered) {
      tooltip.classList.remove('hidden');
      tooltip.style.left = Math.min(mx+15, W-290)+'px';
      tooltip.style.top = Math.min(my-10, H-80)+'px';
      tooltip.innerHTML = '<div class="font-bold text-sm" style="color:'+hovered.color+'">'+hovered.label.replace(/\n/,' ')+'</div><div class="text-surface-400 text-xs mt-1">'+hovered.desc+'</div><div class="text-[10px] text-surface-500 mt-1 uppercase">'+hovered.group+'</div>';
      canvas.style.cursor = 'pointer';
    } else { tooltip.classList.add('hidden'); canvas.style.cursor = 'default'; }
  };
  canvas.onmouseleave = () => { tooltip.classList.add('hidden'); };

  window._graphRunning = true;
  window._graphInitialized = true;
  simulate();
}

function draw(ctx, W, H, nodes, links, tooltip, canvas) {
  ctx.clearRect(0, 0, W, H);

  // Links
  links.forEach(l => {
    ctx.beginPath();
    ctx.moveTo(l.s.x, l.s.y);
    ctx.lineTo(l.t.x, l.t.y);
    ctx.strokeStyle = l.bridge ? 'rgba(245,158,11,0.15)' : 'rgba(148,163,184,0.15)';
    ctx.lineWidth = l.w * 1.5;
    ctx.stroke();
  });

  // Nodes
  nodes.forEach(n => {
    const grad = ctx.createRadialGradient(n.x-5, n.y-8, 0, n.x, n.y, n.r);
    grad.addColorStop(0, n.color + '88');
    grad.addColorStop(0.7, n.color + '44');
    grad.addColorStop(1, n.color + '22');
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = n.color + '66';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Label
    const lines = n.label.split('\n');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    lines.forEach((line, i) => {
      ctx.fillStyle = '#e2e8f0';
      ctx.font = lines.length > 1 ? '11px Inter, sans-serif' : '13px Inter, sans-serif';
      const offset = (i - (lines.length-1)/2) * 16;
      ctx.fillText(line, n.x, n.y + offset);
    });
  });
}

// WIKI
// ═══════════════════════════════════════════════════════════════
function renderWiki(di) {
  const wiki = di.wiki||{};
  const total = wiki.total||0;
  const valid = wiki.valid_frontmatter||0;
  const missing = wiki.missing_frontmatter||0;
  const versions = di.versions||{};

  let html = `<div class="grid grid-cols-3 gap-6 mb-8">`;
  html += metricCard('Wiki Files', total, 'markdown files');
  html += metricCard('Valid Frontmatter', valid, `${total>0?(valid/total*100).toFixed(1):0}%`, 'text-green-400');
  html += metricCard('Missing Frontmatter', missing, `${total>0?(missing/total*100).toFixed(1):0}%`, missing>0?'text-orange-400':'text-green-400');
  html += `</div>`;

  if (missing > 0) {
    html += `<div class="card p-5 mb-6 animate-in"><h3 class="text-sm font-semibold text-surface-200 uppercase tracking-wider mb-3">Files Missing Frontmatter</h3>
      <div class="text-xs text-surface-400 mb-3">Auto-generated community index pages — expected</div>
      <div class="grid grid-cols-4 gap-1 text-xs font-mono text-surface-500 max-h-48 overflow-y-auto">`;
    for (let i = 0; i < Math.min(missing, 60); i++) html += `<div>community-${String(i).padStart(3,'0')}/index.md</div>`;
    if (missing > 60) html += `<div>... and ${missing-60} more</div>`;
    html += `</div></div>`;
  }

  html += `<div class="card p-5 animate-in"><h3 class="text-sm font-semibold text-surface-200 uppercase tracking-wider mb-4">Version Alignment</h3>
    <div class="grid grid-cols-3 gap-4">${Object.entries(versions).map(([p,v]) => 
      `<div class="bg-surface-700/30 rounded-lg p-4 text-center"><div class="text-xs text-surface-400">${p}</div><div class="text-xl font-bold font-mono mt-1" style="color:${projectColor(p)}">${v}</div></div>`
    ).join('')}</div></div>`;

  document.getElementById('tab-wiki').innerHTML = html;
}

// Persona selector
function selectPersona(id) {
  document.querySelectorAll('.persona-btn').forEach(b => {
    b.classList.remove('ring-2', 'ring-offset-2', 'ring-offset-surface-800');
    if (b.dataset.persona === id) b.classList.add('ring-2', 'ring-offset-2', 'ring-offset-surface-800');
  });
  document.querySelectorAll('.persona-review').forEach(r => {
    r.style.display = r.dataset.persona === id ? 'block' : 'none';
  });
  // Scroll to review
  const el = document.querySelector('.persona-review[data-persona="'+id+'"]');
  if (el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
