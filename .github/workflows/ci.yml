name: COSMOS CI (Phase 4)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install --quiet numpy networkx psutil pytest -r components/rsis3/requirements.txt

      - name: Usage practices
        run: cd components/rsis3 && python3 -m rsis check-practices

      - name: Snapshot integrity
        run: python3 gen-static-data.py --check

      - name: Contract validation
        run: python3 contracts/validate.py

      - name: Wiki link check
        run: cd components/mykb && python3 .wiki-daemon/link_check.py

      - name: rsis3 test suite
        run: cd components/rsis3 && python3 -m pytest tests/ -q

      - name: Envelope unit tests
        run: cd components/rsis3 && node --test tests/bridge-envelope.test.mjs

      - name: Bridge smoke (offline fallback)
        run: bash infra/health/bridge_smoke.sh
