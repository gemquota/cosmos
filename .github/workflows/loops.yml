name: COSMOS Loop Runner (3-min cadence)

on:
  schedule:
    - cron: '0 * * * *'   # hourly: each run covers one cycle every ~3 minutes
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Cycles to run this hour (one every ~3 min)'
        required: false
        default: '20'
      spec_cycle:
        description: 'Cycle that sources its L2 goal from a SPACE spec artifact'
        required: false
        default: '1'

permissions:
  contents: write

# GitHub Actions cron has a 5-minute floor, and a 5-min cron would collide
# with per-run overhead — so the cadence is driven inside one hourly job:
# each cycle runs back-to-back with a sleep that pads the iteration to a
# 3-minute rhythm. A new hour cancels the previous run (results are pushed
# per cycle, so nothing is lost).
concurrency:
  group: loops
  cancel-in-progress: true

jobs:
  run-loops:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout main
        run: git checkout main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install --quiet numpy networkx psutil

      - name: Run cycles on a 3-minute rhythm
        run: |
          TOTAL="${{ inputs.cycles || '20' }}"
          SPEC="${{ inputs.spec_cycle || '1' }}"
          git config user.name "RSIS Test"
          git config user.email "rsis@test.local"
          for i in $(seq 1 "$TOTAL"); do
            ITER_START=$(date +%s)
            echo ""
            echo "── Cycle $i/$TOTAL — $(date -u +%H:%M:%SZ) ─────────────────"
            if ! bash infra/loops/run-batch.sh --cycles 1 --goal-space-cycle "$SPEC"; then
              echo "  ⚠ cycle $i finished with failures — continuing"
            fi
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "rsis: cadence cycle $i — $(date -u +%Y-%m-%dT%H:%MZ)"
              git push origin main || echo "  ⚠ push failed — next cycle will carry it"
            fi
            if [ "$i" -lt "$TOTAL" ]; then
              ELAPSED=$(( $(date +%s) - ITER_START ))
              SLEEP=$(( 180 - ELAPSED ))
              if [ "$SLEEP" -gt 0 ]; then sleep "$SLEEP"; fi
            fi
          done

      - name: Auto-sync main → gh-pages
        env:
          REMOTE: origin
        run: |
          git config user.name "RSIS Test"
          git config user.email "rsis@test.local"
          bash infra/deploy/sync-gh-pages.sh
