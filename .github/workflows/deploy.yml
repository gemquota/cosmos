name: Deploy COSMOS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'   # daily safety net: 04:20 UTC

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout main
        run: git checkout main

      - name: Verify snapshots
        run: |
          python3 gen-static-data.py --check

      - name: Auto-sync main → gh-pages
        env:
          REMOTE: origin
        run: |
          git config user.name "RSIS Test"
          git config user.email "rsis@test.local"
          bash infra/deploy/sync-gh-pages.sh
