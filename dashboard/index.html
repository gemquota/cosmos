<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>COSMOS — Ecosystem Dashboard</title>
<style>
:root{--bg:#0c0e14;--bg-subtle:#12141e;--surface:#181b27;--surface-hover:#1e2233;--border:rgba(255,255,255,.06);--border-hover:rgba(255,255,255,.12);--text:#e8eaf0;--text-secondary:#8b90a3;--text-muted:#5a5f72;--primary:#6c8cff;--primary-bright:#8aa8ff;--primary-glow:rgba(108,140,255,.15);--accent:#a78bfa;--green:#34d399;--amber:#fbbf24;--red:#f87171;--radius:12px;--radius-sm:8px;--font:system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:14px;padding:0}
.header{padding:24px 32px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--primary-bright),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-sub{font-size:12px;color:var(--text-muted)}
.header-right{display:flex;align-items:center;gap:16px}
.status-badge{font-size:11px;padding:4px 12px;border-radius:99px;border:1px solid var(--border);font-weight:600}
.status-badge.up{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.2);color:var(--green)}
.status-badge.degraded{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.2);color:var(--amber)}
.status-badge.down{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.2);color:var(--red)}
.content{padding:24px 32px;max-width:1200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:32px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .15s}
.card:hover{border-color:var(--border-hover)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-name{font-size:15px;font-weight:700}
.card-type{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);background:var(--bg-subtle);padding:2px 8px;border-radius:4px}
.card-status{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600}
.card-status.running{background:rgba(52,211,153,.1);color:var(--green)}
.card-status.idle{background:rgba(155,160,179,.1);color:var(--text-muted)}
.card-status.missing{background:rgba(248,113,113,.1);color:var(--red)}
.card-desc{font-size:12.5px;color:var(--text-secondary);margin-bottom:12px;line-height:1.5}
.card-stats{display:flex;gap:16px;font-size:11px;color:var(--text-muted)}
.card-stats span{display:flex;align-items:center;gap:4px}
.card-links{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.card-link{font-size:11px;padding:4px 10px;border-radius:6px;background:var(--bg-subtle);border:1px solid var(--border);color:var(--text-secondary);text-decoration:none;transition:all .15s}
.card-link:hover{background:var(--surface-hover);border-color:var(--border-hover);color:var(--text)}

/* Meta viewer embed */
.meta-section{margin-top:24px;border-top:1px solid var(--border);padding-top:24px}
.meta-section h2{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--text)}
.embed-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.embed-btn{font-size:11px;padding:4px 12px;border-radius:6px;background:var(--surface);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;transition:all .15s;font-family:var(--font)}
.embed-btn:hover{background:var(--surface-hover);color:var(--text)}
.embed-btn.active{background:var(--primary-glow);border-color:var(--primary);color:var(--primary)}
.embed-frame{background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;min-height:400px}
.embed-frame iframe{width:100%;height:500px;border:none;display:block}

/* Responsive */
@media(max-width:640px){
  .header{padding:16px;flex-direction:column;align-items:flex-start}
  .content{padding:16px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>🌌 COSMOS</h1>
    <div class="header-sub">Comprehensive Ontological System for Meta-cognitive Orchestration & Synthesis</div>
  </div>
  <div class="header-right">
    <span class="status-badge" id="globalStatus">⚪ Loading...</span>
    <span class="status-badge up">v0.1.0</span>
  </div>
</div>
<div class="content">
  <div class="grid" id="componentGrid"></div>

  <div class="meta-section">
    <h2>📄 Meta Documents</h2>
    <div class="embed-bar" id="embedBar"></div>
    <div class="embed-frame" id="embedFrame">
      <div style="padding:40px;text-align:center;color:var(--text-muted);font-size:13px">
        Select a document above to view
      </div>
    </div>
  </div>
</div>

<script>
const COMPONENTS = [
  { id:'space', name:'SPACE', type:'typescript', desc:'Prompt engine, CLI, spec generation', icon:'🚀', port:null, dir:'components/space', files:540, tests:150, links:[
    {label:'Meta Viewer', url:'http://localhost:8899'}, {label:'Web UI', url:'http://localhost:8888'}
  ]},
  { id:'mykb', name:'myKB', type:'markdown+python', desc:'Daily knowledge base (Obsidian wiki)', icon:'📚', port:null, dir:'components/mykb', files:2492 },
  { id:'myrsikb', name:'myRSIKB', type:'python', desc:'RSI knowledge base with audit reports', icon:'🧠', port:null, dir:'components/myrsikb', files:44 },
  { id:'myrsiskb', name:'myRSISKB', type:'python', desc:'RSI knowledge bridge (RSIS3 ↔ myKB)', icon:'🔗', port:null, dir:'components/myrsiskb', files:187 },
  { id:'rsis3', name:'RSIS3', type:'python', desc:'3-loop RSI system with dashboard', icon:'🔄', port:null, dir:'components/rsis3', files:137 },
  { id:'rsisb', name:'RSISB', type:'python', desc:'Earlier RSIS version (archived)', icon:'📦', port:null, dir:'components/rsisb', files:187 },
];

const META_DOCS = [
  { file:'COSMOS-SPEC.md', title:'Unification Spec', icon:'📋' },
  { file:'ARCHITECTURE.md', title:'Architecture', icon:'🏗️' },
  { file:'ROADMAP.md', title:'Roadmap', icon:'🗺️' },
  { file:'README.md', title:'Readme', icon:'📖' },
];

// Component rendering
function renderComponents() {
  let allUp = 0;
  const grid = document.getElementById('componentGrid');
  grid.innerHTML = COMPONENTS.map(c => {
    // Check if running
    const isRunning = false; // Would need health check endpoint
    const statusClass = 'idle';
    const statusLabel = 'Idle';
    
    const linksHtml = (c.links || []).map(l =>
      `<a href="${l.url}" target="_blank" rel="noopener" class="card-link">${l.label}</a>`
    ).join('');

    return `
      <div class="card">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:18px">${c.icon}</span>
            <span class="card-name">${c.name}</span>
          </div>
          <span class="card-type">${c.type}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span class="card-status ${statusClass}">● ${statusLabel}</span>
        </div>
        <div class="card-desc">${c.desc}</div>
        <div class="card-stats">
          <span>📁 ${c.files} files</span>
          ${c.tests ? `<span>🧪 ${c.tests} tests</span>` : ''}
        </div>
        ${linksHtml ? `<div class="card-links">${linksHtml}</div>` : ''}
      </div>
    `;
  }).join('');
  
  document.getElementById('globalStatus').textContent = '✅ 6 components';
  document.getElementById('globalStatus').className = 'status-badge up';
}

// Meta viewer
function renderMetaBar() {
  const bar = document.getElementById('embedBar');
  bar.innerHTML = META_DOCS.map(d =>
    `<button class="embed-btn" onclick="loadMetaDoc('${d.file}','${d.title}')">${d.icon} ${d.title}</button>`
  ).join('');
}

async function loadMetaDoc(file, title) {
  // Highlight active
  document.querySelectorAll('.embed-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  
  const frame = document.getElementById('embedFrame');
  frame.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted)">Loading...</div>';
  
  try {
    const resp = await fetch(file);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const md = await resp.text();
    
    // Marked not loaded, render pre
    frame.innerHTML = `<pre style="padding:20px;font-size:12px;line-height:1.6;overflow:auto;max-height:500px;color:var(--text-secondary);font-family:var(--mono);white-space:pre-wrap">${md.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>`;
  } catch(e) {
    frame.innerHTML = `<div style="padding:40px;text-align:center;color:var(--red);font-size:13px">Failed to load: ${e.message}</div>`;
  }
}

// Init
renderComponents();
renderMetaBar();
</script>
</body>
</html>
